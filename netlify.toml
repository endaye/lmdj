[build]
base = "apps/architecture-portal"
command = "npm ci && npm run check"
publish = "build"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
