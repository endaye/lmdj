  <g class="card"><rect x="40" y="638" width="356" height="132" rx="14"/><text class="card-title" x="58" y="670">Clock / scheduled start</text><foreignObject x="58" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">连续 tempo 保持位置/Voice；switch 从零开始。S6 先复制/借用再 Armed；e1=实际 S，e2=真 F。</div></foreignObject></g>
<g class="card"><rect x="414" y="638" width="356" height="132" rx="14"/><text class="card-title" x="432" y="670">Input / lifetime</text><foreignObject x="432" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">2N FIFO/completion；N ordinary + N held release。ACK 不退役物理 hold；借用/回调各自结算。</div></foreignObject></g>
<g class="card"><rect x="788" y="638" width="356" height="132" rx="14"/><text class="card-title" x="806" y="670">Gate / product / cue</text><foreignObject x="806" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Gate 首帧断输入，96 帧恢复；FX 尾音保留。product 经 tap；cue 只到 monitor。</div></foreignObject></g>
<g class="card"><rect x="1162" y="638" width="356" height="132" rx="14"/><text class="card-title" x="1180" y="670">Realtime boundary</text><foreignObject x="1180" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Audio 不分配/析构/加锁/写 Truth 或 Journal。值快照不锁 audio；audition 退役不退款 Project。</div></foreignObject></g>
