<g class="connection"><path class="edge-mask" d="M 570 218 H 605 V 218 H 640"/><path class="edge" d="M 570 218 H 605 V 218 H 640" marker-end="url(#arrow)"/><text x="605" y="209">slot token + 64-bit identity</text></g>
<g class="connection"><path class="edge-mask" d="M 530 428 H 585 V 218 H 640"/><path class="edge" d="M 530 428 H 585 V 218 H 640" marker-end="url(#arrow)"/><text x="585" y="314">bounded gesture / tempo</text></g>
<g class="connection"><path class="edge-mask" d="M 870 218 H 910 V 218 H 950"/><path class="edge" d="M 870 218 H 910 V 218 H 950" marker-end="url(#arrow)"/><text x="910" y="209">mixed stereo bus</text></g>
