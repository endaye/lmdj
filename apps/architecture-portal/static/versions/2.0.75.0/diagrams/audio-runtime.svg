<g class="connection"><path class="edge-mask" d="M 320 538 H 480 V 218 H 640"/><path class="edge" d="M 320 538 H 480 V 218 H 640" marker-end="url(#arrow)"/><text x="480" y="369">one POD command; before claim</text></g>
<g class="connection"><path class="edge-mask" d="M 870 218 H 904 V 482 H 606 V 428 H 640"/><path class="edge" d="M 870 218 H 904 V 482 H 606 V 428 H 640" marker-end="url(#arrow)"/><text x="755" y="314">audio-owned S &lt; F decision</text></g>
<g class="connection"><path class="edge-mask" d="M 890 428 H 924 V 592 H 6 V 538 H 40"/><path class="edge" d="M 890 428 H 924 V 592 H 6 V 538 H 40" marker-end="url(#arrow)"/><text x="465" y="474">immutable until acknowledgment</text></g>
<g class="connection"><path class="edge-mask" d="M 870 218 H 904 V 272 H 296 V 218 H 330"/><path class="edge" d="M 870 218 H 904 V 272 H 296 V 218 H 330" marker-end="url(#arrow)"/></g>

