      <text class="node-title" x="56" y="522">Pattern Transport</text>
      <text class="node-detail" x="56" y="548">control: submit / inspect / ack</text>
    </g>
    <g class="component kind-core">
      <rect class="node-mask" x="636" y="376" width="258" height="104" rx="18"/>
      <rect class="node" x="640" y="380" width="250" height="96" rx="14"/>
      <text class="node-title" x="656" y="412">Retained Receipt</text>
      <text class="node-detail" x="656" y="438">F / origin / identity / cutoff</text>
    </g>
  <g class="card"><rect x="40" y="638" width="356" height="132" rx="14"/><text class="card-title" x="58" y="670">Pattern Transport / Phase</text><foreignObject x="58" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Start anchors F; Stop ramps Pattern voices; Fence keeps origin. Phase retains PCM/cursor/release; control reclaims after last Voice.</div></foreignObject></g>
<g class="card"><rect x="414" y="638" width="356" height="132" rx="14"/><text class="card-title" x="432" y="670">Telemetry</text><foreignObject x="432" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Audio/control value snapshots; only non-realtime readers lock. Transport has a separate control reader. Drain callbacks before lifecycle handoff. Runtime-only Facade owns OPEN/BUSY drain; its audio-only consumed counter is not proof of a started Voice.</div></foreignObject></g>
<g class="card"><rect x="788" y="638" width="356" height="132" rx="14"/><text class="card-title" x="806" y="670">Master FX</text><foreignObject x="806" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Fixed order filter, delay, reverb, stutter, gate, reverse, crush, cutter; values are 0..1000 and every period derives from the Bar, not wall clock.</div></foreignObject></g>
<g class="card"><rect x="1162" y="638" width="356" height="132" rx="14"/><text class="card-title" x="1180" y="670">Forbidden boundary</text><foreignObject x="1180" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">No allocation, destruction, lock, Project mutation, quantization, journal I/O or production test hook on the realtime thread. Reclaimed decoded PCM bytes refund Project Banks only; the reserved audition pool contributes no Project reservation refund.</div></foreignObject></g>
</svg>
