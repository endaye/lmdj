      <rect class="node" x="640" y="170" width="230" height="96" rx="14"/>
      <text class="node-title" x="656" y="202">Realtime Engine</text>
      <text class="node-detail" x="656" y="228">atomic32 claim · Bar clock</text>
    </g>
