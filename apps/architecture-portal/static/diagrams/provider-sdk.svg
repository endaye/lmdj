<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 820" role="img" aria-labelledby="title description" data-source-sha256="c72e4f5424e0c467fd5b58b2e66f3993548b02b8bdff64256ccb6936e3601bea">
  <title id="title">Provider SDK Module</title><desc id="description">Capability 解析、Attempt 隔离与 Artifact-only Provider 端口</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <style>
    :root{--bg:#f7fafb;--panel:#fff;--text:#102427;--muted:#4b6569;--line:#2b7778;--border:#b8cdcf;--boundary:#eaf4f4;--accent:#00a9a5;--mask:#f7fafb}
    @media(prefers-color-scheme:dark){:root{--bg:#071011;--panel:#102023;--text:#f1fbfb;--muted:#a7c0c3;--line:#59d8d3;--border:#29464a;--boundary:#0c1a1c;--accent:#35d5cf;--mask:#071011}}
    [data-theme=dark]{--bg:#071011;--panel:#102023;--text:#f1fbfb;--muted:#a7c0c3;--line:#59d8d3;--border:#29464a;--boundary:#0c1a1c;--accent:#35d5cf;--mask:#071011}
    [data-theme=light]{--bg:#f7fafb;--panel:#fff;--text:#102427;--muted:#4b6569;--line:#2b7778;--border:#b8cdcf;--boundary:#eaf4f4;--accent:#00a9a5;--mask:#f7fafb}
    svg{background:var(--bg);font-family:Inter,"PingFang SC",system-ui,sans-serif}.page-title{font-size:32px;font-weight:750;fill:var(--text)}.page-summary{font-size:16px;fill:var(--muted)}
    .boundary rect{fill:var(--boundary);stroke:var(--border);stroke-dasharray:7 6}.boundary text{fill:var(--muted);font-size:15px;font-weight:700}.edge-mask{fill:none;stroke:var(--mask);stroke-width:10}.edge{fill:none;stroke:var(--line);stroke-width:2.5}.connection text{fill:var(--muted);font-size:14px;text-anchor:middle}.node-mask{fill:var(--mask)}.node{fill:var(--panel);stroke:var(--border);stroke-width:2}.kind-host .node,.kind-provider .node{stroke:var(--accent)}.node-title{fill:var(--text);font-size:19px;font-weight:750}.node-detail{fill:var(--muted);font-size:14px}.card rect{fill:var(--panel);stroke:var(--border)}.card-title{fill:var(--text);font-size:17px;font-weight:750}.card-body{color:var(--muted);font-size:15px;line-height:1.45}.marker{fill:var(--line)}
  </style>
  <rect width="1560" height="820" fill="var(--bg)"/><text class="page-title" x="40" y="44">Provider SDK Module</text><text class="page-summary" x="40" y="68">Capability 解析、Attempt 隔离与 Artifact-only Provider 端口</text>

  <g class="connection"><path class="edge-mask" d="M 300 238 H 360 V 238 H 420"/><path class="edge" d="M 300 238 H 360 V 238 H 420" marker-end="url(#arrow)"/></g>
<g class="connection"><path class="edge-mask" d="M 690 238 H 760 V 238 H 830"/><path class="edge" d="M 690 238 H 760 V 238 H 830" marker-end="url(#arrow)"/></g>
<g class="connection"><path class="edge-mask" d="M 1060 238 H 1135 V 238 H 1210"/><path class="edge" d="M 1060 238 H 1135 V 238 H 1210" marker-end="url(#arrow)"/></g>

    <g class="component kind-host">
      <rect class="node-mask" x="46" y="186" width="258" height="104" rx="18"/>
      <rect class="node" x="50" y="190" width="250" height="96" rx="14"/>
      <text class="node-title" x="66" y="222">Capability Request</text>
      <text class="node-detail" x="66" y="248">Host / Workspace</text>
    </g>
    <g class="component kind-core">
      <rect class="node-mask" x="416" y="186" width="278" height="104" rx="18"/>
      <rect class="node" x="420" y="190" width="270" height="96" rx="14"/>
      <text class="node-title" x="436" y="222">Registry + Attempt</text>
      <text class="node-detail" x="436" y="248">selection / lifecycle</text>
    </g>
    <g class="component kind-provider">
      <rect class="node-mask" x="826" y="186" width="238" height="104" rx="18"/>
      <rect class="node" x="830" y="190" width="230" height="96" rx="14"/>
      <text class="node-title" x="846" y="222">Provider</text>
      <text class="node-detail" x="846" y="248">Artifact ports</text>
    </g>
    <g class="component kind-host">
      <rect class="node-mask" x="1206" y="186" width="248" height="104" rx="18"/>
      <rect class="node" x="1210" y="190" width="240" height="96" rx="14"/>
      <text class="node-title" x="1226" y="222">Artifact Result</text>
      <text class="node-detail" x="1226" y="248">or typed error</text>
    </g>
  <g class="card"><rect x="40" y="638" width="481" height="132" rx="14"/><text class="card-title" x="58" y="670">Dependency</text><foreignObject x="58" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Foundation only.</div></foreignObject></g>
<g class="card"><rect x="539" y="638" width="481" height="132" rx="14"/><text class="card-title" x="557" y="670">Owned state</text><foreignObject x="557" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Registry and Attempt state; failure never enters Project Truth.</div></foreignObject></g>
<g class="card"><rect x="1038" y="638" width="481" height="132" rx="14"/><text class="card-title" x="1056" y="670">Forbidden boundary</text><foreignObject x="1056" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Provider never receives mutable Project or bundle path.</div></foreignObject></g>
</svg>
