<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 820" role="img" aria-labelledby="title description" data-source-sha256="4aa8727f0f6aff12bc6fa1a57b9191f0ce9a842ace83008edb3bac6cf5b8daf2">
  <title id="title">Application Facade Module</title><desc id="description">Host 唯一 Core 入口与下层 Module 编排</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <style>
    :root{--bg:#f7fafb;--panel:#fff;--text:#102427;--muted:#4b6569;--line:#2b7778;--border:#b8cdcf;--boundary:#eaf4f4;--accent:#00a9a5;--mask:#f7fafb}
    @media(prefers-color-scheme:dark){:root{--bg:#071011;--panel:#102023;--text:#f1fbfb;--muted:#a7c0c3;--line:#59d8d3;--border:#29464a;--boundary:#0c1a1c;--accent:#35d5cf;--mask:#071011}}
    [data-theme=dark]{--bg:#071011;--panel:#102023;--text:#f1fbfb;--muted:#a7c0c3;--line:#59d8d3;--border:#29464a;--boundary:#0c1a1c;--accent:#35d5cf;--mask:#071011}
    [data-theme=light]{--bg:#f7fafb;--panel:#fff;--text:#102427;--muted:#4b6569;--line:#2b7778;--border:#b8cdcf;--boundary:#eaf4f4;--accent:#00a9a5;--mask:#f7fafb}
    svg{background:var(--bg);font-family:Inter,"PingFang SC",system-ui,sans-serif}.page-title{font-size:32px;font-weight:750;fill:var(--text)}.page-summary{font-size:16px;fill:var(--muted)}
    .boundary rect{fill:var(--boundary);stroke:var(--border);stroke-dasharray:7 6}.boundary text{fill:var(--muted);font-size:15px;font-weight:700}.edge-mask{fill:none;stroke:var(--mask);stroke-width:10}.edge{fill:none;stroke:var(--line);stroke-width:2.5}.connection text{fill:var(--muted);font-size:14px;text-anchor:middle}.node-mask{fill:var(--mask)}.node{fill:var(--panel);stroke:var(--border);stroke-width:2}.kind-host .node,.kind-provider .node{stroke:var(--accent)}.node-title{fill:var(--text);font-size:19px;font-weight:750}.node-detail{fill:var(--muted);font-size:14px}.card rect{fill:var(--panel);stroke:var(--border)}.card-title{fill:var(--text);font-size:17px;font-weight:750}.card-body{color:var(--muted);font-size:15px;line-height:1.45}.marker{fill:var(--line)}
  </style>
  <rect width="1560" height="820" fill="var(--bg)"/><text class="page-title" x="40" y="44">Application Facade Module</text><text class="page-summary" x="40" y="68">Host 唯一 Core 入口与下层 Module 编排</text>

  <g class="connection"><path class="edge-mask" d="M 270 238 H 330 V 238 H 390"/><path class="edge" d="M 270 238 H 330 V 238 H 390" marker-end="url(#arrow)"/><text x="330" y="229">only entry</text></g>
<g class="connection"><path class="edge-mask" d="M 660 238 H 730 V 238 H 800"/><path class="edge" d="M 660 238 H 730 V 238 H 800" marker-end="url(#arrow)"/><text x="730" y="229">orchestrate</text></g>
<g class="connection"><path class="edge-mask" d="M 1050 238 H 1130 V 238 H 1210"/><path class="edge" d="M 1050 238 H 1130 V 238 H 1210" marker-end="url(#arrow)"/></g>

    <g class="component kind-host">
      <rect class="node-mask" x="46" y="186" width="228" height="104" rx="18"/>
      <rect class="node" x="50" y="190" width="220" height="96" rx="14"/>
      <text class="node-title" x="66" y="222">Hosts</text>
      <text class="node-detail" x="66" y="248">CLI · MCP · Native</text>
    </g>
    <g class="component kind-core">
      <rect class="node-mask" x="386" y="186" width="278" height="104" rx="18"/>
      <rect class="node" x="390" y="190" width="270" height="96" rx="14"/>
      <text class="node-title" x="406" y="222">Application Facade</text>
      <text class="node-detail" x="406" y="248">public C++ / C API</text>
    </g>
    <g class="component kind-core">
      <rect class="node-mask" x="796" y="186" width="258" height="104" rx="18"/>
      <rect class="node" x="800" y="190" width="250" height="96" rx="14"/>
      <text class="node-title" x="816" y="222">Core Modules</text>
      <text class="node-detail" x="816" y="248">domain · I/O · cook</text>
    </g>
    <g class="component kind-host">
      <rect class="node-mask" x="1206" y="186" width="248" height="104" rx="18"/>
      <rect class="node" x="1210" y="190" width="240" height="96" rx="14"/>
      <text class="node-title" x="1226" y="222">Typed Response</text>
      <text class="node-detail" x="1226" y="248">Artifact / error</text>
    </g>
  <g class="card"><rect x="40" y="638" width="481" height="132" rx="14"/><text class="card-title" x="58" y="670">Dependencies</text><foreignObject x="58" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">All six lower Core Modules at locked versions.</div></foreignObject></g>
<g class="card"><rect x="539" y="638" width="481" height="132" rx="14"/><text class="card-title" x="557" y="670">Assembly Loader</text><foreignObject x="557" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Validates Product Assembly identity before use.</div></foreignObject></g>
<g class="card"><rect x="1038" y="638" width="481" height="132" rx="14"/><text class="card-title" x="1056" y="670">Forbidden boundary</text><foreignObject x="1056" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">No Host protocol, UI or product-specific wiring in the Facade.</div></foreignObject></g>
</svg>
