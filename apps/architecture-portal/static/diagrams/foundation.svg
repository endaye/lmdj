<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 820" role="img" aria-labelledby="title description" data-source-sha256="a54a6bb33829596f678df41b907e56eefb2c63b93772820e32ff554277296398">
  <title id="title">Foundation Module</title><desc id="description">Artifact、JSON 与 typed error 的产品中立底座</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
  <style>
    :root{--bg:#f7fafb;--panel:#fff;--text:#102427;--muted:#4b6569;--line:#2b7778;--border:#b8cdcf;--boundary:#eaf4f4;--accent:#00a9a5;--mask:#f7fafb}
    @media(prefers-color-scheme:dark){:root{--bg:#071011;--panel:#102023;--text:#f1fbfb;--muted:#a7c0c3;--line:#59d8d3;--border:#29464a;--boundary:#0c1a1c;--accent:#35d5cf;--mask:#071011}}
    [data-theme=dark]{--bg:#071011;--panel:#102023;--text:#f1fbfb;--muted:#a7c0c3;--line:#59d8d3;--border:#29464a;--boundary:#0c1a1c;--accent:#35d5cf;--mask:#071011}
    [data-theme=light]{--bg:#f7fafb;--panel:#fff;--text:#102427;--muted:#4b6569;--line:#2b7778;--border:#b8cdcf;--boundary:#eaf4f4;--accent:#00a9a5;--mask:#f7fafb}
    svg{background:var(--bg);font-family:Inter,"PingFang SC",system-ui,sans-serif}.page-title{font-size:32px;font-weight:750;fill:var(--text)}.page-summary{font-size:16px;fill:var(--muted)}
    .boundary rect{fill:var(--boundary);stroke:var(--border);stroke-dasharray:7 6}.boundary text{fill:var(--muted);font-size:15px;font-weight:700}.edge-mask{fill:none;stroke:var(--mask);stroke-width:10}.edge{fill:none;stroke:var(--line);stroke-width:2.5}.connection text{fill:var(--muted);font-size:14px;text-anchor:middle}.node-mask{fill:var(--mask)}.node{fill:var(--panel);stroke:var(--border);stroke-width:2}.kind-host .node,.kind-provider .node{stroke:var(--accent)}.node-title{fill:var(--text);font-size:19px;font-weight:750}.node-detail{fill:var(--muted);font-size:14px}.card rect{fill:var(--panel);stroke:var(--border)}.card-title{fill:var(--text);font-size:17px;font-weight:750}.card-body{color:var(--muted);font-size:15px;line-height:1.45}.marker{fill:var(--line)}
  </style>
  <rect width="1560" height="820" fill="var(--bg)"/><text class="page-title" x="40" y="44">Foundation Module</text><text class="page-summary" x="40" y="68">Artifact、JSON 与 typed error 的产品中立底座</text>

  <g class="connection"><path class="edge-mask" d="M 310 238 H 400 V 238 H 490"/><path class="edge" d="M 310 238 H 400 V 238 H 490" marker-end="url(#arrow)"/><text x="400" y="229">wrap / parse</text></g>
<g class="connection"><path class="edge-mask" d="M 740 238 H 830 V 238 H 920"/><path class="edge" d="M 740 238 H 830 V 238 H 920" marker-end="url(#arrow)"/><text x="830" y="229">result</text></g>
<g class="connection"><path class="edge-mask" d="M 1150 238 H 1215 V 238 H 1280"/><path class="edge" d="M 1150 238 H 1215 V 238 H 1280" marker-end="url(#arrow)"/><text x="1215" y="229">public API</text></g>

    <g class="component kind-host">
      <rect class="node-mask" x="86" y="186" width="228" height="104" rx="18"/>
      <rect class="node" x="90" y="190" width="220" height="96" rx="14"/>
      <text class="node-title" x="106" y="222">Bytes / Files</text>
      <text class="node-detail" x="106" y="248">public inputs</text>
    </g>
    <g class="component kind-core">
      <rect class="node-mask" x="486" y="186" width="258" height="104" rx="18"/>
      <rect class="node" x="490" y="190" width="250" height="96" rx="14"/>
      <text class="node-title" x="506" y="222">Foundation</text>
      <text class="node-detail" x="506" y="248">Artifact · JSON</text>
    </g>
    <g class="component kind-core">
      <rect class="node-mask" x="916" y="186" width="238" height="104" rx="18"/>
      <rect class="node" x="920" y="190" width="230" height="96" rx="14"/>
      <text class="node-title" x="936" y="222">Typed Results</text>
      <text class="node-detail" x="936" y="248">stable identity</text>
    </g>
    <g class="component kind-host">
      <rect class="node-mask" x="1276" y="186" width="228" height="104" rx="18"/>
      <rect class="node" x="1280" y="190" width="220" height="96" rx="14"/>
      <text class="node-title" x="1296" y="222">Core Modules</text>
      <text class="node-detail" x="1296" y="248">direct consumers</text>
    </g>
  <g class="card"><rect x="40" y="638" width="481" height="132" rx="14"/><text class="card-title" x="58" y="670">Owned state</text><foreignObject x="58" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Artifact identity and JSON values; no Project ownership.</div></foreignObject></g>
<g class="card"><rect x="539" y="638" width="481" height="132" rx="14"/><text class="card-title" x="557" y="670">No dependencies</text><foreignObject x="557" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">module.json declares no Module dependency.</div></foreignObject></g>
<g class="card"><rect x="1038" y="638" width="481" height="132" rx="14"/><text class="card-title" x="1056" y="670">Forbidden boundary</text><foreignObject x="1056" y="684" width="445" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">No storage, audio device, Provider or product wiring.</div></foreignObject></g>
</svg>
