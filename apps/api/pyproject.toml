[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmdj-api"
version = "0.1.0"
description = "LMDJ app backend: upload -> job -> status -> patch"
requires-python = ">=3.11"
# 本地依赖（path 依赖不写 metadata）：
#   pip install -e ../../packages/core-models -e ../../packages/patchify -e ../../workers/audio
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lmdj_api*"]
