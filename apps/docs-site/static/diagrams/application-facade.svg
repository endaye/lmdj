  <g class="card"><rect x="40" y="638" width="356" height="132" rx="14"/><text class="card-title" x="58" y="670">Facade / I/O owner</text><foreignObject x="58" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Host 只用 Facade；Runtime-only 无 IO/Provider。worker 独占 Store/Journal/lease；scheduled count-in 在真 S 后开 Journal。</div></foreignObject></g>
<g class="card"><rect x="414" y="638" width="356" height="132" rx="14"/><text class="card-title" x="432" y="670">独立录音 release</text><foreignObject x="432" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Native + durable 才 complete。press ticket 消费后保留 release correlation；真 S/F、exact readback。</div></foreignObject></g>
<g class="card"><rect x="788" y="638" width="356" height="132" rx="14"/><text class="card-title" x="806" y="670">Performance authority</text><foreignObject x="806" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Core epoch 绑定 verified Project；header 保存 live state。reserve → durable → publish → complete；unknown 冻结，replay 先还原 header。</div></foreignObject></g>
<g class="card"><rect x="1162" y="638" width="356" height="132" rx="14"/><text class="card-title" x="1180" y="670">shutdown 与验收</text><foreignObject x="1180" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">request_shutdown 后等 I/O stopped；Native/cue/hold 独立静止。原旅程保留；S6 执行 UNVERIFIED。</div></foreignObject></g>
</svg>
