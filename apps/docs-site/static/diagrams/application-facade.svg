  <g class="card"><rect x="40" y="638" width="356" height="132" rx="14"/><text class="card-title" x="58" y="670">Facade / I/O owner</text><foreignObject x="58" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Facade 保留切换票据；Journal worker 独占耐久 owner。close 后独立 reader 准备 Snapshot，Control 只收取结果并发布。</div></foreignObject></g>
<g class="card"><rect x="414" y="638" width="356" height="132" rx="14"/><text class="card-title" x="432" y="670">独立录音 release</text><foreignObject x="432" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Native 与 durable 分开。S 只结算旧段元数据；真实按键 release 票据仍需实际 Native 消费者。</div></foreignObject></g>
<g class="card"><rect x="788" y="638" width="356" height="132" rx="14"/><text class="card-title" x="806" y="670">Performance authority</text><foreignObject x="806" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">Core epoch 绑定 verified Project；header 保存 live state。reserve → durable → publish → complete；unknown 冻结，replay 先还原 header。</div></foreignObject></g>
<g class="card"><rect x="1162" y="638" width="356" height="132" rx="14"/><text class="card-title" x="1180" y="670">shutdown 与验收</text><foreignObject x="1180" y="684" width="320" height="70"><div xmlns="http://www.w3.org/1999/xhtml" class="card-body">先 I/O owner disposition，后 Host reset pin/consume 与 Native quiescence。失败保留 error；Creator 与候选/设备待验收。</div></foreignObject></g>
</svg>
