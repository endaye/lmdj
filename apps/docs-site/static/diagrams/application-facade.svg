<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 820" role="img" aria-labelledby="title description" data-source-sha256="9fde2676e671b64185c13a80a2b662438a4d5a5b6c6cc380efb91755773ddd93">
  <title id="title">Application Facade Module</title><desc id="description">唯一 Core 入口；S6 源码草稿以 serialized control + 单一 I/O owner 保留真实录音身份</desc>
