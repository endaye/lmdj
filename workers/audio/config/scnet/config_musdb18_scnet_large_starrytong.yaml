# LMDJ-owned vendored config (spec §5/§6) — origin + local tuning documented here.
# 来源: MSST release v1.0.9
#   https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v1.0.9/config_musdb18_scnet_large_starrytong.yaml
# 原始文件 sha256: 3efa43af7c50d4a6e1105d2599d2d6a31c8012ee99eaad9a7e80e057945d44ee
# LMDJ 改动（MPS 内存适配，2026-07-16，Fix round 2）：
#   - inference.batch_size: 8 -> 1
#     原因：MSST `demix()`（generic 模式，见 .msst/utils/model_utils.py）按
#     `batch_size` 把多个 chunk_size 长的音频块一次性 `torch.stack` 后送入模型；
#     batch_size=8 时 SCNet-large 在 Apple Silicon MPS 上 device 内存占用超出
#     驱动可用上限，进程被 SIGKILL（exit -9，OOM）。改为 batch_size=1（逐块串行推理，
#     其余分块/交叉淡入淡出逻辑不变）后 MPS 峰值降到 ~11.16GB，推理通过；CPU 路径
#     同一改动下峰值 RSS 也从 ~27.9GB 降到 ~5.17GB。chunk_size 未改（无需再收窄）。
#   - 其余字段（audio.*、model.*、training.*、augmentations.*、inference 内其余字段）
#     保持与上游 release 完全一致，未作任何改动。
audio:
  chunk_size: 485100 # 44100 * 11
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  sources:
    - drums
    - bass
    - other
    - vocals
  audio_channels: 2
  dims:
    - 4
    - 64
    - 128
    - 256
  nfft: 4096
  hop_size: 1024
  win_size: 4096
  normalized: True
  band_SR:
    - 0.225
    - 0.372
    - 0.403
  band_stride:
    - 1
    - 4
    - 16
  band_kernel:
    - 3
    - 4
    - 16
  conv_depths:
    - 3
    - 2
    - 1
  compress: 4
  conv_kernel: 3
  num_dplayer: 6
  expand: 1

training:
  batch_size: 6
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments:
    - drums
    - bass
    - other
    - vocals
  # lr: 1.0e-04
  lr: 1.0
  patience: 2
  reduce_factor: 0.95
  target_instrument: null
  num_epochs: 1000
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: prodigy
  other_fix: false # it's needed for checking on multisong dataset if other is actually instrumental
  use_amp: true # enable or disable usage of mixed precision (float16) - usually it must be true

augmentations:
  enable: true # enable or disable all augmentations (to fast disable if needed)
  loudness: true # randomly change loudness of each stem on the range (loudness_min; loudness_max)
  loudness_min: 0.5
  loudness_max: 1.5
  mixup: true # mix several stems of same type with some probability (only works for dataset types: 1, 2, 3)
  mixup_probs:
    !!python/tuple # 2 additional stems of the same type (1st with prob 0.2, 2nd with prob 0.02)
    - 0.2
    - 0.02
  mixup_loudness_min: 0.5
  mixup_loudness_max: 1.5
  all:
    channel_shuffle: 0.5 # Set 0 or lower to disable
    random_inverse: 0.1 # inverse track (better lower probability)
    random_polarity: 0.5 # polarity change (multiply waveform to -1)

inference:
  batch_size: 1
  dim_t: 256
  num_overlap: 4
  normalize: true
