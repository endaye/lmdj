[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmdj-audio-worker"
version = "0.1.0"
description = "LMDJ audio worker: audio -> pipeline -> patchify -> patch.json"
requires-python = ">=3.11"
# 本地依赖（path 依赖不写 metadata，与 patchify 同惯例）：
#   pip install -e ../../packages/core-models -e ../../packages/patchify
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
# pipeline-from-stems / canonical stems 校验的 DSP 依赖。
# 版本由 workers/audio/config/parity-constraints.txt 锁定（安装时 -c 传入）。
pfs = [
  "numpy",
  "soundfile",
  "librosa",
  "scikit-learn",
  "pretty_midi",
]
# 指标计算依赖。
# 版本由 workers/audio/config/metrics-constraints.txt 锁定（安装时 -c 传入）。
metrics = [
  "museval",
  "pandas",
]

[project.scripts]
lmdj-audio-worker = "lmdj_audio_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lmdj_audio_worker*"]
