name: Grok Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: grok-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  grok-review:
    # Advisory only: this job is not part of Core CI, PR Gate, or the merge
    # queue. Findings post a sticky comment and never fail the workflow.
    # Hosted ubuntu-24.04 is not justified under hosted_runner_policy.json:
    # this job holds no control-plane evidence or deploy authority, and
    # ci-general already has outbound HTTPS for the Grok CLI install.
    name: Grok advisory review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 15
    env:
      GROK_DISABLE_AUTOUPDATER: "1"
      GROK_VERSION: "1.0.13"
      # The digest names the exact bytes; the version alone names only a
      # release. Recomputed by downloading the artifact whenever the version
      # moves. The upstream install script publishes no checksum and verifies
      # nothing but an HTTP status and a `--version` string, so pinning has to
      # happen here.
      GROK_SHA256: "edf79521581bb5e6b95abef848491a6a742e860da3e237ebe86a280d30dce4c1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fetch the versioned artifact directly and verify it, rather than
      # piping the upstream installer to a shell. This job holds
      # `pull-requests: write` and a `GITHUB_TOKEN`, and it now runs on a
      # self-hosted runner, so an altered installer would execute on our own
      # machine with those credentials in reach. The same reasoning already
      # governs the CI contract lane, which validates workflows with a
      # checksum-verified actionlint release rather than a container action.
      - name: Install the pinned Grok CLI
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/grok"
          curl --fail --silent --show-error --location \
            --output "$binary" \
            "https://x.ai/cli/grok-${GROK_VERSION}-linux-x86_64"
          printf '%s  %s\n' "$GROK_SHA256" "$binary" | sha256sum --check --strict -
          chmod +x "$binary"
          mkdir -p "$HOME/.local/bin"
          mv "$binary" "$HOME/.local/bin/grok"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm Grok CLI pin
        run: |
          set -euo pipefail
          grok --version
          grok --version | grep -F "$GROK_VERSION"

      - name: Collect the pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --find-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"

      - name: Write the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.md"

      - name: Run advisory Grok review
        env:
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          DIFF_FILE: ${{ runner.temp }}/pr.diff
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: "false"
          PR_SAME_REPOSITORY: "true"
          POST_COMMENT: "true"
          POST_ISSUE: "true"
        run: python3 .github/scripts/grok_review.py
