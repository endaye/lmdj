name: Deploy Web Runtime Host

on:
  workflow_dispatch:
    inputs:
      prior_site_sha256:
        description: Frozen canonical Site digest required for managed release requests
        required: false
        default: ""
        type: string
      request_id:
        description: Optional release operation digest for correlation only
        required: false
        default: ""
        type: string
      tag:
        description: Exact signed Product tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-runtime-host-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout protected main tooling
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Record dispatch correlation
        if: ${{ inputs.request_id != '' }}
        timeout-minutes: 1
        shell: bash
        run: python3 -m tools.release.dispatch_receipt --workflow deploy-web-runtime-host.yml --output build/release-dispatch/receipt.json

      - name: Upload dispatch correlation
        if: ${{ inputs.request_id != '' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-dispatch-correlation
          path: build/release-dispatch/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Select exact signed Product tag
        timeout-minutes: 2
        id: release-tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$MANUAL_TAG"
          [[ "$tag" =~ ^lmdj-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Deployment tag must be an exact Product tag" >&2
            exit 64
          }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Verify signed Runtime Host release
        timeout-minutes: 7
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LMDJ_RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$LMDJ_RELEASE_TAG"
          timeout --signal=TERM --kill-after=30s 300s \
            scripts/web-runtime-deploy.sh verify "$tag"

  deploy:
    needs: preflight
    environment: runtime-canary
    runs-on: ubuntu-24.04
    # 80, not 75: the job now pins a second Node and installs Wrangler before
    # it deploys. The step budgets below still have to fit inside this.
    timeout-minutes: 80
    steps:
      - name: Checkout protected main tooling
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up the pinned upload Node
        timeout-minutes: 3
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.16.0"

      - name: Record the pinned upload Node
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          # The adapter refuses any Node but 22.16.0 for the Worker upload,
          # while the browser leg needs 26. Record this one before the next
          # setup-node takes over PATH; the tool cache keeps both.
          printf 'LMDJ_UPLOAD_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"

      - name: Set up Node
        timeout-minutes: 3
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tests/platform/web/package-lock.json

      - name: Verify the recorded upload Node survived
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          # The adapter checks this too, but only at the upload boundary. Fail
          # here instead of thirty minutes in, if the tool cache moved.
          found="$("$LMDJ_UPLOAD_NODE" --version)"
          [[ "$found" == "v22.16.0" ]] || {
            echo "pinned upload Node is $found, not v22.16.0" >&2
            exit 64
          }

      - name: Install the pinned deploy CLI without deployment credentials
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/host-wrangler-$GITHUB_RUN_ID" \
            --no-audit --no-fund wrangler@4.129.1

      - name: Install browser smoke dependencies
        timeout-minutes: 5
        working-directory: tests/platform/web
        run: npm ci

      - name: Install Chromium
        timeout-minutes: 10
        working-directory: tests/platform/web
        run: npx --no-install playwright install --with-deps chromium

      - name: Deploy signed Runtime Host release to Cloudflare
        timeout-minutes: 35
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          LMDJ_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          LMDJ_RELEASE_REQUEST_ID: ${{ inputs.request_id }}
          LMDJ_PRIOR_SITE_SHA256: ${{ inputs.prior_site_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p build/deploy/web-runtime-host
          state="$RUNNER_TEMP/host-state-$GITHUB_RUN_ID"
          mkdir -p "$state"
          chmod 700 "$state"
          tag="$LMDJ_RELEASE_TAG"
          timeout --signal=TERM --kill-after=900s 1080s \
            scripts/cloudflare-host-deploy.sh "$tag" \
              --target web-runtime-host \
              --state-root "$state" \
              --output build/deploy/web-runtime-host/evidence.json \
              --run-id "$GITHUB_RUN_ID" \
              --node "$LMDJ_UPLOAD_NODE" \
              --wrangler "$RUNNER_TEMP/host-wrangler-$GITHUB_RUN_ID/node_modules/wrangler/bin/wrangler.js" \
            2>&1 | tee build/deploy/web-runtime-host/deployment.log

      - name: Upload deployment evidence and failure logs
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: runtime-host-deployment-evidence
          path: |
            build/deploy/web-runtime-host/evidence.json
            build/deploy/web-runtime-host/deployment.log
            ${{ runner.temp }}/host-state-${{ github.run_id }}/diagnostics
          if-no-files-found: warn
