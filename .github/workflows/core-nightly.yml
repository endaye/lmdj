name: Core Nightly

on:
  workflow_dispatch:
    inputs:
      probe_self_hosted_tsan:
        description: Run the matching TSan lane on ci-core for compatibility evidence.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: core-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tsan:
    # Keep the scheduled authority on a clean Hosted image until an explicit
    # same-revision probe proves that the self-hosted Core host can execute the
    # TSan runtime. Both self-hosted hosts fail `unexpected memory mapping`
    # under the 6.8 kernel's 32-bit `vm.mmap_rnd_bits` (#676, #693).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - name: Install the pinned Core toolchain
        # The Hosted image ships Ubuntu's clang-18 and GCC 13. The Core pin is
        # Clang/LLVM 22 (#693) and is installed here through the same script
        # that provisioned the self-hosted hosts, so both TSan lanes compile
        # with one compiler and the probe below measures the runtime, not a
        # compiler difference.
        run: sudo bash scripts/ci/host/install-llvm-toolchain.sh 22
      - name: Verify the TSan toolchain
        run: |
          command -v clang-22
          command -v clang++-22
      - run: env CC=clang-22 CXX=clang++-22 scripts/core.sh configure tsan
      - run: scripts/core.sh build tsan
      - run: scripts/core.sh test tsan stress

  core-tsan-self-hosted-probe:
    # Same repository-wide capacity queue as every other native-heavy job.
    # Separate runner services on the `ci-core` host are not independent
    # CPU: without this, a dispatch of this probe starts in the same second as
    # `core-stress` below and the two timing-sensitive suites destroy each
    # other's budgets. The first dispatch did exactly that, and its failure said
    # nothing about whether the host can execute the TSan runtime -- which is
    # the only question the probe exists to answer.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_self_hosted_tsan }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - name: Verify the TSan toolchain
        # Host state, provisioned once by the operator with
        # scripts/ci/host/install-llvm-toolchain.sh; the lane installs nothing
        # on a machine two runner services share.
        run: |
          command -v clang-22
          command -v clang++-22
      - run: env CC=clang-22 CXX=clang++-22 scripts/core.sh configure tsan
      - run: scripts/core.sh build tsan
      - run: scripts/core.sh test tsan stress

  core-stress:
    # Release stress is trusted native Core workload. The literal role queues
    # behind other native lanes instead of consuming Hosted Ubuntu minutes.
    #
    # Naming the role was not enough. The role spans two runner services on one
    # physical host, so a sibling job runs beside this one rather than after it,
    # and twenty consecutive stress repetitions are the least tolerant workload
    # in the repository. The capacity queue is what makes "queues behind" true.
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure release
      - run: scripts/core.sh build release
      - run: >-
          ctest --test-dir build/core/release
          -L '^stress$'
          --repeat until-fail:20
          --output-on-failure
