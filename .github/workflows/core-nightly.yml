name: Core Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: core-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tsan:
    # Trusted native Core workload on the `ci-core` role since #693. TSan was
    # Hosted from 2026-08-05 because the self-hosted hosts' 6.8 kernel hands
    # out 32-bit `vm.mmap_rnd_bits` and no TSan runtime -- GCC 13, LLVM 18 or
    # LLVM 22 -- can start under that layout without re-exec'ing with ASLR
    # off, which `LockPersonality=true` forbids. The host now caps the entropy
    # at 28 (scripts/ci/host/configure-sanitizer-aslr.sh), and the same-
    # revision probe passed with that state: run 34030066433 on
    # netcup-lmdj-linux-04, 11/11 stress tests, 52 s, beside the Hosted lane's
    # 11/11 in 157 s (docs/quality/2026-09-06-llvm-22-coverage-measurement.md). The
    # prerequisite is verified below before any TSan binary runs, so a host
    # that loses the setting fails with the remedy named instead of with a
    # runtime FATAL or, on some runtimes, no output at all.
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - name: Verify the TSan host prerequisite
        run: |
          bits="$(sysctl -n vm.mmap_rnd_bits)"
          if [ "$bits" -gt 28 ]; then
            echo "why: vm.mmap_rnd_bits is $bits on $(hostname); ThreadSanitizer cannot start under more than 28 bits of mmap ASLR entropy and the runner unit forbids the re-exec it would use to cope; remedy: an operator runs sudo scripts/ci/host/configure-sanitizer-aslr.sh on this host" >&2
            exit 1
          fi
          echo "vm.mmap_rnd_bits=$bits on $(hostname)"
      - name: Verify the TSan toolchain
        # Host state, provisioned once by the operator with
        # scripts/ci/host/install-llvm-toolchain.sh; the lane installs nothing
        # on a machine several runner services share.
        run: |
          command -v clang-22
          command -v clang++-22
      - run: env CC=clang-22 CXX=clang++-22 scripts/core.sh configure tsan
      - run: scripts/core.sh build tsan
      - run: scripts/core.sh test tsan stress

  core-stress:
    # Release stress is trusted native Core workload. The literal role queues
    # behind other native lanes instead of consuming Hosted Ubuntu minutes.
    #
    # Naming the role was not enough. The role spans two runner services on one
    # physical host, so a sibling job runs beside this one rather than after it,
    # and twenty consecutive stress repetitions are the least tolerant workload
    # in the repository. The capacity queue is what makes "queues behind" true.
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure release
      - run: scripts/core.sh build release
      - run: >-
          ctest --test-dir build/core/release
          -L '^stress$'
          --repeat until-fail:20
          --output-on-failure
