name: Core Nightly

# Reusable stress implementation for the complete daily/manual self-test batch.
# A manual suite probe remains diagnostic, not a substitute for that batch.
on:
  # Automatic stress coverage belongs to Core CI's 16:00 UTC self-test batch.
  workflow_dispatch:
    inputs:
      suite:
        description: Which stress workload to run.
        required: false
        default: all
        type: choice
        options: [all, tsan, stress]
      target_revision:
        description: Exact commit to check out; empty checks out the dispatched ref.
        required: false
        default: ""
        type: string
  workflow_call:
    outputs:
      infrastructure_failure:
        description: The TSan host prerequisite prevented test execution.
        value: ${{ jobs.core-tsan.outputs.infrastructure_failure }}
    inputs:
      suite:
        description: all | tsan | stress
        required: false
        default: all
        type: string
      target_revision:
        description: Exact commit the caller resolved; empty checks out the caller's ref.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  core-tsan:
    outputs:
      infrastructure_failure: ${{ steps.prerequisite.outputs.infrastructure_failure }}
    # Trusted native Core workload on the `ci-core` role since #693. TSan was
    # Hosted from 2026-08-05 because the self-hosted hosts' 6.8 kernel hands
    # out 32-bit `vm.mmap_rnd_bits` and no TSan runtime -- GCC 13, LLVM 18 or
    # LLVM 22 -- can start under that layout without re-exec'ing with ASLR
    # off, which `LockPersonality=true` forbids. The host now caps the entropy
    # at 28 (scripts/ci/host/configure-sanitizer-aslr.sh), and the same-
    # revision probe passed with that state: run 34030066433 on
    # netcup-lmdj-linux-04, 11/11 stress tests, 52 s, beside the Hosted lane's
    # 11/11 in 157 s (docs/quality/2026-09-06-llvm-22-coverage-measurement.md). The
    # prerequisite is verified with the pinned runtime below, as the runner
    # user cannot read the root-only entropy sysctl. A failed startup keeps
    # infrastructure debt and never reaches the product tests.
    if: ${{ inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'tsan' }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_revision || '' }}
          lfs: true
      - name: Verify the checked-out target
        if: ${{ inputs.target_revision != '' }}
        env:
          EXPECTED_TARGET: ${{ inputs.target_revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - name: Verify the TSan host prerequisite
        id: prerequisite
        run: |
          fail_prerequisite() {
            echo 'infrastructure_failure=true' >>"$GITHUB_OUTPUT"
            echo 'why: the pinned TSan runtime cannot compile or start under the runner service; remedy: inspect the compiler/runtime output and have an operator verify the host ASLR cap with scripts/ci/host/configure-sanitizer-aslr.sh before a fresh test request' >&2
            exit 1
          }
          # mmap_rnd_bits is root-only (0600); test runtime compatibility as
          # the actual runner user instead of requiring privileged sysctl reads.
          probe_dir="$(mktemp -d)" || fail_prerequisite
          trap 'rm -rf "$probe_dir"' EXIT
          cat >"$probe_dir/probe.cpp" <<'CPP' || fail_prerequisite
          #include <thread>
          int main() {
            int result = 0;
            std::thread worker([&] { result = 42; });
            worker.join();
            return result == 42 ? 0 : 1;
          }
          CPP
          runtime_dir="$(clang++-22 -print-runtime-dir)" || fail_prerequisite
          test -d "$runtime_dir" || fail_prerequisite
          clang++-22 -fsanitize=thread -shared-libsan "-Wl,-rpath,$runtime_dir" -pthread \
            "$probe_dir/probe.cpp" -o "$probe_dir/probe" || fail_prerequisite
          # All ten starts must succeed; this is a startup check, not retries.
          for attempt in {1..10}; do
            timeout 10s "$probe_dir/probe" || fail_prerequisite
          done
      - name: Verify the TSan toolchain
        # Host state, provisioned once by the operator with
        # scripts/ci/host/install-llvm-toolchain.sh; the lane installs nothing
        # on a machine several runner services share.
        run: |
          command -v clang-22
          command -v clang++-22
      - run: env CC=clang-22 CXX=clang++-22 scripts/core.sh configure tsan
      - run: scripts/core.sh build tsan
      - run: scripts/core.sh test tsan stress

  core-stress:
    # Release stress is trusted native Core workload. The literal role queues
    # behind other native lanes instead of consuming Hosted Ubuntu minutes.
    #
    # Naming the role was not enough. The role spans two runner services on one
    # physical host, so a sibling job runs beside this one rather than after it,
    # and twenty consecutive stress repetitions are the least tolerant workload
    # in the repository. The capacity queue is what makes "queues behind" true.
    if: ${{ inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'stress' }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_revision || '' }}
          lfs: true
      - name: Verify the checked-out target
        if: ${{ inputs.target_revision != '' }}
        env:
          EXPECTED_TARGET: ${{ inputs.target_revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure release
      - run: scripts/core.sh build release
      - run: >-
          ctest --test-dir build/core/release
          -L '^stress$'
          --repeat until-fail:20
          --output-on-failure
