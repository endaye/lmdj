name: Release identity audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-audit-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout protected main authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Audit release identity and drift
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PATH: build/release/audit/report.json
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name == 'push' }}" == "true" ]]; then
            scripts/release.sh audit --local --json "$REPORT_PATH"
          else
            scripts/release.sh audit --remote --json "$REPORT_PATH"
          fi

      - name: Retain the audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-audit-${{ github.run_id }}
          path: build/release/audit/report.json
          if-no-files-found: error
          retention-days: 30
