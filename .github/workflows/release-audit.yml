name: Release identity audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-audit-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout protected main authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # The static audit validates the exact Product target through
      # apps/architecture-portal/scripts/check-release-docs.mjs, so the job must
      # pin the same Node toolchain every other Node-consuming job pins instead
      # of inheriting whatever the runner image happens to expose.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # The repository is private and the checkout deliberately persists no
      # credential, so the steps whose git commands must reach the canonical
      # https://github.com/ remote (the remote audit's authority fetch and
      # the intent hydration below) scope this job's read-level token through
      # environment-only git config; nothing is written to disk.
      # Allocated release intents may target pre-squash commits that no
      # branch or tag reaches, so a fresh full clone lacks their objects and
      # the audit reports the intents unverifiable; hydrate them by SHA
      # first. Pitfall: .agents/pitfalls/release-intent-target-reachability.md
      - name: Hydrate release intent target objects
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          python3 - <<'EOF'
          import json, subprocess
          data = json.load(open("docs/release-evidence/release-intents.json"))
          revisions = [entry["target_revision"] for entry in data["entries"]]
          revisions += [entry["target_revision"] for entry in data["historical_exceptions"]]
          missing = [
              revision for revision in revisions
              if subprocess.run(["git", "cat-file", "-e", f"{revision}^{{commit}}"],
                                capture_output=True).returncode != 0
          ]
          if missing:
              subprocess.run(["git", "fetch", "--no-tags", "origin", *missing], check=True)
              print("hydrated intent targets:", " ".join(missing))
          else:
              print("all intent targets already present")
          EOF

      - name: Audit release identity and drift
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          REPORT_PATH: build/release/audit/report.json
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name == 'push' }}" == "true" ]]; then
            scripts/release.sh audit --local --json "$REPORT_PATH"
          else
            scripts/release.sh audit --remote --json "$REPORT_PATH"
          fi

      - name: Retain the audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-audit-${{ github.run_id }}
          path: build/release/audit/report.json
          if-no-files-found: error
          retention-days: 30
