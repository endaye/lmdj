name: Release identity audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-audit-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 15
    steps:
      - name: Checkout protected main authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select standalone system Python
        shell: bash
        run: |
          set -euo pipefail

          python_executable="/usr/bin/python3"

          python_bin="$(mktemp -d "${RUNNER_TEMP:?}/lmdj-system-python.XXXXXX")"
          trap 'rm -rf -- "$python_bin"' EXIT
          ln -s "$python_executable" "$python_bin/python3"
          ln -s "$python_executable" "$python_bin/python"

          # Probe both resolution by name and the sys.executable spawn used by release
          # validators. Do not forward LD_LIBRARY_PATH, PYTHONHOME or any parent state.
          if ! env -i PATH="$python_bin:/usr/bin:/bin" python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11+ is required")
          child = subprocess.run(
              [sys.executable, "-c", "import sys; print(sys.version)"],
              env={"PATH": os.environ["PATH"]},
              check=True, capture_output=True, text=True,
          )
          print(json.dumps({"python": os.path.realpath(sys.executable),
                            "version": sys.version, "sanitized_child": child.stdout.strip()}))
          PY
          then
            echo 'why: system Python cannot run a Python 3.11+ parent and child without loader variables; remedy: repair the host Python installation, never forward loader variables into sanitized children' >&2
            exit 1
          fi

          printf '%s\n' "$python_bin" >>"${GITHUB_PATH:?}"
          trap - EXIT

      # The static audit validates the exact Product target through
      # apps/docs-site/scripts/check-release-docs.mjs, so the job must
      # pin the same Node toolchain every other Node-consuming job pins instead
      # of inheriting whatever the runner image happens to expose.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26"

      # The repository is private and the checkout deliberately persists no
      # credential, so the steps whose git commands must reach the canonical
      # https://github.com/ remote (the remote audit's authority fetch and
      # the intent hydration below) scope this job's read-level token through
      # environment-only git config; nothing is written to disk.
      # Allocated release intents may target pre-squash commits that no
      # branch or tag reaches, so a fresh full clone lacks their objects and
      # the audit reports the intents unverifiable. `hydrate` is the stable
      # interface's only object-store write and runs first; the audit itself
      # never fetches. Decision:
      # docs/prd/decisions/2026-09-06-release-intent-hydrate-subcommand.md;
      # pitfall: .agents/pitfalls/release-intent-target-reachability.md
      - name: Hydrate release intent target objects
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        shell: bash
        run: |
          set -euo pipefail
          scripts/release.sh hydrate

      - name: Audit release identity and drift
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          REPORT_PATH: build/release/audit/report.json
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name == 'push' }}" == "true" ]]; then
            scripts/release.sh audit --local --json "$REPORT_PATH"
          else
            scripts/release.sh audit --remote --json "$REPORT_PATH"
          fi

      - name: Retain the audit report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: release-audit-${{ github.run_id }}
          path: build/release/audit/report.json
          if-no-files-found: error
          retention-days: 30
