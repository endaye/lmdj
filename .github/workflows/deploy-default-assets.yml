name: Deploy original default assets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lmdj-default-assets-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: creator-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected integration revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Set up pinned Worker upload Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.16.0'
      - name: Verify original corpus and Worker route boundaries
        run: scripts/asset-server.sh check
      - name: Install pinned Wrangler
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/default-assets-wrangler" --no-audit --no-fund wrangler@4.129.1
      - name: Deploy independent asset Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/default-assets
          node "$RUNNER_TEMP/default-assets-wrangler/node_modules/wrangler/bin/wrangler.js" \
            deploy --config tools/asset-server/wrangler.json 2>&1 | tee build/default-assets/deployment.log
      - name: Authenticate live Catalog, manifest and every original audio object
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('build/default-assets/deployment.log').read_text()
          origins = set(re.findall(r'https://lmdj-default-assets\.[a-z0-9-]+\.workers\.dev', log))
          if len(origins) != 1:
              raise SystemExit('Deployment must report one actual asset Worker origin')
          pathlib.Path('build/default-assets/origin.txt').write_text(origins.pop() + '\n')
          PY
          scripts/asset-server.sh verify-live "$(cat build/default-assets/origin.txt)" \
            | tee build/default-assets/verification.log
          git rev-parse HEAD > build/default-assets/source-revision.txt
      - name: Retain exact revision and live byte verification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: default-assets-deployment
          path: build/default-assets/
          if-no-files-found: ignore
          retention-days: 30
