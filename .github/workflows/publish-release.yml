name: Publish verified Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact verified tag
        required: true
        type: string
      release_id:
        description: Numeric Draft Release ID
        required: true
        type: string
      plan_sha256:
        description: Exact plan SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Checkout protected main tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # The repository is private and the checkout deliberately persists no
      # credential, so every step whose git commands must reach the canonical
      # https://github.com/ remote (the release tooling's authority fetch and
      # the intent hydration below) scopes this job's own read-level token
      # through environment-only git config. Nothing is written to disk and
      # no write token enters preflight.
      # Allocated release intents may target pre-squash commits that no
      # branch or tag reaches, so a fresh full clone lacks their objects and
      # the release audit reports the intents unverifiable; hydrate them by
      # SHA before any release.sh invocation. Pitfall:
      # .agents/pitfalls/release-intent-target-reachability.md
      - name: Hydrate release intent target objects
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          python3 - <<'EOF'
          import json, subprocess
          data = json.load(open("docs/release-evidence/release-intents.json"))
          revisions = [entry["target_revision"] for entry in data["entries"]]
          revisions += [entry["target_revision"] for entry in data["historical_exceptions"]]
          missing = [
              revision for revision in revisions
              if subprocess.run(["git", "cat-file", "-e", f"{revision}^{{commit}}"],
                                capture_output=True).returncode != 0
          ]
          if missing:
              subprocess.run(["git", "fetch", "--no-tags", "origin", *missing], check=True)
              print("hydrated intent targets:", " ".join(missing))
          else:
              print("all intent targets already present")
          EOF

      # GitHub exposes Draft Releases only to write-scoped identities, so a
      # read-only preflight cannot run verify-draft at all (the Actions token
      # receives 403). Draft verification is owned entirely by the publish
      # job, which re-runs verify-draft and the audit with contents: write
      # after the release Environment gate and before the single mutation.
      # Spec amendment 2026-08-26; pitfall:
      # .agents/pitfalls/draft-release-read-visibility.md
      - name: Audit exact tag before publication job
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          scripts/release.sh audit --remote --tag "$RELEASE_TAG"

  publish:
    needs: preflight
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      deployments: read
    steps:
      - name: Checkout protected main tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # Same environment-only fetch credential and hydration contract as
      # preflight; see the comment there. Pitfall:
      # .agents/pitfalls/release-intent-target-reachability.md
      - name: Hydrate release intent target objects
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          python3 - <<'EOF'
          import json, subprocess
          data = json.load(open("docs/release-evidence/release-intents.json"))
          revisions = [entry["target_revision"] for entry in data["entries"]]
          revisions += [entry["target_revision"] for entry in data["historical_exceptions"]]
          missing = [
              revision for revision in revisions
              if subprocess.run(["git", "cat-file", "-e", f"{revision}^{{commit}}"],
                                capture_output=True).returncode != 0
          ]
          if missing:
              subprocess.run(["git", "fetch", "--no-tags", "origin", *missing], check=True)
              print("hydrated intent targets:", " ".join(missing))
          else:
              print("all intent targets already present")
          EOF

      - name: Reverify exact Draft Release before publication
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          scripts/release.sh verify-draft \
            "$RELEASE_TAG" "$RELEASE_ID" "$PLAN_SHA256"

      - name: Audit exact tag immediately before publication
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          scripts/release.sh audit --remote --tag "$RELEASE_TAG"

      - name: Publish exact verified Draft Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          scripts/release.sh publish-draft \
            "$RELEASE_TAG" "$RELEASE_ID" "$PLAN_SHA256"

      - name: Audit the exact published tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          scripts/release.sh audit --remote --tag "$RELEASE_TAG"
