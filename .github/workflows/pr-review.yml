name: PR Review
run-name: "PR Review / #${{ inputs.pr_number || github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha || 'dispatch' }}"

# One valid review supplies findings and test scope. Product tests remain
# independent. main retains required_conversation_resolution; clean reviews
# create no inline threads (#707). This is not a new gate or merge authority.
# The pinned PR-Agent engine installed on the Netcup review host sees only the
# authenticated complete input (trusted base and head bytes plus the fixed
# diff), never PR code execution or a write token. A separate publisher
# reauthenticates exact source, run/attempt and current head. Labels are
# advisory projections, not authority.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number to review at its current head.
        required: true
        type: string
      recheck_comment_id:
        description: Optional original LMDJ bot comment ID to reverify against the current source before resolving its thread.
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr-review-${{ inputs.pr_number || github.event.pull_request.number }}${{ github.event.action == 'closed' && '-merge-map' || '' }}
  cancel-in-progress: true

jobs:
  target:
    name: Resolve review target
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    # Covers one bounded GitHub REST primary reset wait, not model time.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.target.outputs.number }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      review: ${{ steps.target.outputs.review }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Resolve the Pull Request head
        id: target
        if: ${{ github.event.action != 'closed' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/pr_review_target.py --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" --expect-head "${EXPECT_HEAD:-}" --github-output "$GITHUB_OUTPUT"

  review:
    # The job name is part of the producer identity that publisher, wait and
    # discovery readers authenticate; keep it stable.
    name: Review fallback
    needs: [target]
    if: ${{ needs.target.outputs.review == 'true' }}
    # The PR-Agent engine is installed only on the Netcup host
    # (scripts/ci/pr-agent/install.sh); every netcup runner shares it.
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, netcup, ci-general]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize attempt-local review directory
        run: printf 'REVIEW_DIR=%s/review-scope-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Collect complete fixed input without executing PR files
        id: input
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.target.outputs.number }}
          HEAD_SHA: ${{ needs.target.outputs.head_sha }}
          RECHECK_COMMENT_ID: ${{ inputs.recheck_comment_id }}
          AUTO_RECHECK: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
          PR_EVENT_ACTION: ${{ github.event.action }}
        run: python3 scripts/ci/review_pipeline.py collect-t2 --directory "$REVIEW_DIR"
      - name: deepseek review
        # PR-Agent runs here as the runner account with no GitHub token in its
        # environment; the engine clears everything but the named provider key.
        # Witness and model execution share the installation slot lock, so a
        # release switch cannot mix their identities. The ledger caps spend.
        id: deepseek
        if: ${{ !cancelled() && steps.input.outcome == 'success' }}
        timeout-minutes: 25
        continue-on-error: true
        env:
          PR_AGENT_DEEPSEEK_API_KEY: ${{ secrets.PR_AGENT_DEEPSEEK_API_KEY }}
        run: |
          flock -w 900 /var/lib/lmdj/pr-agent/slot.lock bash -euo pipefail <<'REVIEW'
            bash scripts/ci/pr-agent/run-engine.sh --witness > "$REVIEW_DIR/t2-config-witness.json"
            bash scripts/ci/pr-agent/run-engine.sh --input "$REVIEW_DIR/t2-input.json" > "$REVIEW_DIR/t2-result.json"
          REVIEW
      - name: Validate PR-Agent result
        id: capture-deepseek
        if: ${{ !cancelled() && steps.input.outcome == 'success' }}
        env:
          BACKEND_OUTCOME: ${{ steps.deepseek.outcome }}
          T2_RESULT_JSON: ${{ env.REVIEW_DIR }}/t2-result.json
        run: python3 scripts/ci/review_pipeline.py capture --backend deepseek --directory "$REVIEW_DIR"
      - name: Save honest final result
        if: ${{ !cancelled() && steps.input.outcome == 'success' }}
        run: python3 scripts/ci/review_pipeline.py finalize --directory "$REVIEW_DIR"
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: pr-review-result-${{ needs.target.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REVIEW_DIR }}/context.json
            ${{ env.REVIEW_DIR }}/history.json
            ${{ env.REVIEW_DIR }}/review.json
            ${{ env.REVIEW_DIR }}/result.json
            ${{ env.REVIEW_DIR }}/failure.json
            ${{ env.REVIEW_DIR }}/t2-input.json
            ${{ env.REVIEW_DIR }}/collection-receipt.json
            ${{ env.REVIEW_DIR }}/collection-failure.json
            ${{ env.REVIEW_DIR }}/t2-config-witness.json
            ${{ env.REVIEW_DIR }}/t2-result.json
            ${{ env.REVIEW_DIR }}/collector.json
            ${{ env.REVIEW_DIR }}/coverage-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Manual takeover
        if: ${{ failure() }}
        run: echo "NOT REVIEWED. Review the current head manually; no failure is a clean review." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish review and scope
    needs: [target, review]
    if: >-
      !cancelled() &&
      ((github.event.action == 'closed' && github.event.pull_request.merged == true) ||
       (needs.target.outputs.review == 'true' && needs.review.result == 'success'))
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    # Covers one bounded GitHub REST primary reset wait, not model time.
    timeout-minutes: 25
    permissions:
      # GitHub requires contents write for resolveReviewThread as well as PR
      # write. Only this trusted data consumer gets it; it never runs PR code.
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        if: ${{ github.event.action != 'closed' }}
        with:
          name: pr-review-result-${{ needs.target.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-publish
      - name: Publish exact-head review and scope
        if: ${{ github.event.action != 'closed' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.target.outputs.number }}
          HEAD_SHA: ${{ needs.target.outputs.head_sha }}
          RECHECK_COMMENT_ID: ${{ inputs.recheck_comment_id }}
          AUTO_RECHECK: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
          PR_EVENT_ACTION: ${{ github.event.action }}
        run: python3 scripts/ci/review_pipeline.py publish --directory "$RUNNER_TEMP/review-publish"
      - uses: actions/upload-artifact@v6
        if: ${{ always() && github.event.action != 'closed' }}
        with:
          name: pr-test-scope-${{ needs.target.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/review-publish/scope.json
            ${{ runner.temp }}/review-publish/repair-recheck.json
          if-no-files-found: error
          retention-days: 30
      - name: Map merged PR without another AI call
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: python3 scripts/ci/review_merge_map.py --output "$RUNNER_TEMP/review-merge-map/map.json"
      - uses: actions/upload-artifact@v6
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
        with:
          name: pr-review-merge-map-${{ github.event.pull_request.merge_commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-merge-map/map.json
          if-no-files-found: error
          retention-days: 30
      - name: Report the review state
        if: ${{ always() }}
        run: |
          echo "Publication outcome: ${{ job.status }}. Exact head: ${{ needs.target.outputs.head_sha }}. If stale, missing or failed, review the current head manually. This does not authorize merge or release." >> "$GITHUB_STEP_SUMMARY"
