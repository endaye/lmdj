name: Advisory Review Liveness

# Read-only manual diagnostic retained after retirement of the old scheduled
# monitor. Independent PR Review jobs now expose missing/failed review honestly.
# This workflow creates no Issues and holds no merge authority.

on:
  # Legacy periodic entry retired. The standalone PR Review jobs expose their
  # own failures; this read-only manual diagnostic remains available.
  workflow_dispatch:

# `actions: read` lists the runs and jobs; the other two read the surfaces the
# check actually judges by. `evidence_posted` asks whether a lane signed an
# issue comment, a review comment or a review body, and an explicit
# `permissions:` block makes everything it omits `none` -- so without these the
# three reads 403, `_gh` raises, and the job is permanently red while observing
# nothing. All read-only: this workflow publishes no evidence and mutates
# nothing.
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: advisory-review-liveness
  cancel-in-progress: true

jobs:
  liveness:
    name: Advisory review liveness
    # Self-hosted, like everything else that does not publish scope, trust,
    # admission or verdict evidence. A daily job billed by the minute is how
    # the Merge Queue watchdog consumed an entire included allowance.
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Report advisory review liveness
        env:
          # Read by urllib in the script, not by a CLI. The name matches what
          # grok_review.py already reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 .github/scripts/advisory_review_liveness.py
          --repository "${{ github.repository }}"
          --window 5
          --summary "$GITHUB_STEP_SUMMARY"
