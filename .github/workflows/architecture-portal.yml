name: Architecture Portal

on:
  workflow_call:
    inputs:
      check_documentation_impact:
        required: false
        type: boolean
        default: false
      base_sha:
        required: false
        type: string
        default: ""
      head_sha:
        required: false
        type: string
        default: ""
      pull_request_body:
        required: false
        type: string
        default: ""
      checkout_ref:
        description: >-
          Exact commit to check out instead of the caller's default ref. Set
          only by a self-test batch whose target is not the tip; a Pull
          Request call leaves it empty and keeps the merge ref.
        required: false
        type: string
        default: ""
      snapshot_mode:
        description: Authenticated self-test main interval, or strict PR own-tree (default).
        required: false
        type: string
        default: own-tree

permissions:
  contents: read

jobs:
  portal:
    # Portal's share of the general Linux workload on the dual-node trusted
    # role. The role is declared here because the caller in `ci.yml` is a
    # `uses:` job, which GitHub does not allow to carry `runs-on`. The label
    # set is literal rather than selector-resolved, so a busy or absent role
    # queues this job instead of diverting it to paid runners. The caller
    # holds the closed trust condition, and this workflow has no trigger but
    # `workflow_call` and no other caller, so it cannot run untrusted.
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || '' }}
          fetch-depth: 0
      - name: Verify the checked-out target
        if: ${{ inputs.checkout_ref != '' }}
        env:
          EXPECTED_TARGET: ${{ inputs.checkout_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/architecture-portal/package-lock.json
      - name: Install locked portal dependencies
        run: scripts/architecture-portal.sh install
      # The PR checks measure this change from its merge base, which the
      # checkers resolve themselves from the two revisions. `base_sha` is the
      # base branch tip at event time, so a two-dot range would additionally
      # report, in reverse, everything that landed on `main` after the branch
      # was cut -- and a branch that is merely behind would inherit unrelated
      # portal pages as its own. Issue #531 is that failure.
      - name: Check Pull Request documentation impact
        if: ${{ inputs.check_documentation_impact }}
        env:
          PORTAL_PR_BODY: ${{ inputs.pull_request_body }}
          PORTAL_BASE_SHA: ${{ inputs.base_sha }}
          PORTAL_HEAD_SHA: ${{ inputs.head_sha }}
        run: npm --prefix apps/architecture-portal run check:impact
      # A squash merge never keeps the branch commit a snapshot records as its
      # revision, so on `main` the snapshot is only provable when its recorded
      # projection matches the introducing commit's tree -- and that commit is
      # the squash, whose tree is this change's own. Deciding the same
      # comparison here gives the identical verdict before the merge instead of
      # after it, which is what issue #296 was about. Only added snapshots are
      # its subject: a landed divergence may be authorized by a squash witness,
      # and a witness names the introducing commit, so a snapshot introduced
      # here cannot have one. Authenticated main batches instead enumerate
      # every introducing commit in their first-parent interval; subsequent
      # mutable page changes are not attributed to an earlier introduction.
      - name: Check snapshot projection against the merge target
        env:
          PORTAL_SNAPSHOT_MODE: ${{ inputs.snapshot_mode }}
          PORTAL_BASE_SHA: ${{ inputs.base_sha }}
          PORTAL_HEAD_SHA: ${{ inputs.head_sha }}
        run: npm --prefix apps/architecture-portal run check:snapshot-projection
      # This remains unconditional even for an empty main interval/candidate:
      # it verifies the current Build's complete canonical snapshot provenance.
      - name: Verify architecture portal
        run: scripts/architecture-portal.sh check
