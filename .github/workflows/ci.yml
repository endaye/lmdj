name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/core-models/pyproject.toml
      - run: python -m pip install -e "packages/core-models[test]"
      - run: python -m pytest packages/core-models/tests -q

  patchify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/core-models/pyproject.toml
            packages/patchify/pyproject.toml
      - run: python -m pip install -e packages/core-models -e "packages/patchify[test]"
      - run: python -m pytest packages/patchify/tests -q

  audio-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/core-models/pyproject.toml
            packages/patchify/pyproject.toml
            workers/audio/pyproject.toml
            workers/audio/config/parity-constraints.txt
      # pfs extra 带 DSP 测试依赖（soundfile/numpy/librosa/...），版本由 parity-constraints 锁定
      - run: python -m pip install -e packages/core-models -e packages/patchify -e "workers/audio[test,pfs,metrics]" -c workers/audio/config/parity-constraints.txt -c workers/audio/config/metrics-constraints.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pytest workers/audio/tests -q

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/core-models/pyproject.toml
            packages/patchify/pyproject.toml
            workers/audio/pyproject.toml
            apps/api/pyproject.toml
      - run: python -m pip install -e packages/core-models -e packages/patchify -e workers/audio -e "apps/api[test]"
      - run: python -m pytest apps/api/tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE: /api

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/release/tests/test-release-versioning.sh
      - run: bash scripts/deploy/tests/test-package-release.sh
      - run: bash scripts/deploy/tests/test-activate-release.sh
      - run: bash scripts/deploy/tests/test-deploy-workflow.sh
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: >-
          docker run --rm
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate
          --config /etc/caddy/Caddyfile
          --adapter caddyfile
