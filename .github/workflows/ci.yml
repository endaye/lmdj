name: Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-runtime-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: scripts/web-runtime-lab.sh test

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh proof
      - name: Verify Apple-only audio targets are absent on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          scripts/core.sh configure dev
          scripts/core.sh build dev

          evidence_dir="$(mktemp -d)"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          cmake --build build/core/dev --target help >"$evidence_dir/targets.txt"

          for target in lmdj_audio_coreaudio lmdj_native_audio_probe; do
            if grep -Fq "$target" "$evidence_dir/targets.txt"; then
              echo "unexpected Apple-only target on Ubuntu: $target" >&2
              exit 1
            fi
            if cmake --build build/core/dev --target "$target" \
              >"$evidence_dir/$target.log" 2>&1; then
              echo "unexpected Apple-only target built on Ubuntu: $target" >&2
              exit 1
            fi
            cat "$evidence_dir/$target.log"
          done

  core-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure asan
      - run: scripts/core.sh build asan
      - run: scripts/core.sh test asan full
      - run: scripts/core.sh test asan stress

  core-asan-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure asan
      - run: scripts/core.sh build asan
      - name: Verify Apple-only audio targets are built under the sanitizer
        shell: bash
        run: |
          set -euo pipefail
          for target in lmdj_audio_coreaudio lmdj_audio_coreaudio_tests; do
            if ! cmake --build build/core/asan --target "$target"; then
              echo "Apple-only target missing from the macOS sanitizer build: $target" >&2
              exit 1
            fi
          done
      # Native tests only, which is every test whose command is a built target
      # and therefore all of the Apple-only audio coverage this job exists for.
      # It also covers both stress tests, since they are native.
      #
      # The Python-hosted tests are deliberately excluded here. They dlopen the
      # instrumented C ABI dylib from an uninstrumented CPython, which needs
      # DYLD_INSERT_LIBRARIES to preload the ASan runtime; that does not
      # interpose into the runner's Python on arm64 macOS, so they die with
      # DEADLYSIGNAL before reaching any assertion. The Linux core-asan job
      # keeps that coverage via LD_PRELOAD.
      - run: ctest --preset asan -L '^native$' --output-on-failure

  core-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - run: |
          env \
            PATH="/usr/lib/llvm-18/bin:$PATH" \
            CC=clang-18 \
            CXX=clang++-18 \
            scripts/core-coverage.sh check
      - name: Upload failed coverage evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-failure
          path: |
            build/core/coverage/coverage/report.txt
            build/core/coverage/coverage/summary.json
