name: Core CI
run-name: Core CI / ${{ inputs.queue_ticket || github.ref_name }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: >-
          Comma-separated lanes to run, e.g. "web_toolchain,creator". Leave
          empty to run every lane; an empty dispatch on the exact main SHA is
          the authorized way to produce full release evidence for a SHA whose
          own push classified focused. A lane selection is never full evidence.
        required: false
        default: ""
      queue_ticket:
        description: Controller ticket mq:<queue-run-id>:<attempt>; all queue inputs are required together.
        required: false
        default: ""
      queue_pr_number:
        description: Pull Request number bound to the controller ticket.
        required: false
        default: ""
      queue_base_sha:
        description: Exact canonical main SHA captured by the controller.
        required: false
        default: ""
      queue_head_sha:
        description: Exact synchronized Pull Request head SHA to validate.
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  LMDJ_EMSDK_REVISION: dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
  LMDJ_EMSDK_VERSION: "6.0.5"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('core-ci-pr-{0}', github.event.pull_request.number) || format('core-ci-sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-scope:
    name: Change Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      manifest: ${{ steps.scope.outputs.manifest }}
      trusted-head: ${{ steps.scope.outputs.trusted-head }}
      queue-mode: ${{ steps.scope.outputs.queue-mode }}
      pull-request-body: ${{ steps.scope.outputs.pull-request-body }}
      resolved-base-sha: ${{ steps.scope.outputs.resolved-base-sha }}
      resolved-head-sha: ${{ steps.scope.outputs.resolved-head-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify the complete change inventory
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.queue_base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ inputs.queue_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ inputs.queue_ticket != '' && github.repository || github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ inputs.queue_pr_number || github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_PATH: ${{ runner.temp }}/ci-scope.json
          QUEUE_VALIDATION_PATH: ${{ runner.temp }}/queue-validation.json
          REQUESTED_LANES: ${{ inputs.lanes }}
          QUEUE_TICKET: ${{ inputs.queue_ticket }}
          QUEUE_PR_NUMBER: ${{ inputs.queue_pr_number }}
          QUEUE_BASE_SHA: ${{ inputs.queue_base_sha }}
          QUEUE_HEAD_SHA: ${{ inputs.queue_head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/change_scope.py \
            --policy scripts/ci/scope_policy.json \
            --event "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --repository "$REPOSITORY" \
            --head-repository "$HEAD_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --manifest-out "$MANIFEST_PATH" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --lanes "${REQUESTED_LANES:-}" \
            --queue-ticket "${QUEUE_TICKET:-}" \
            --queue-pr-number "${QUEUE_PR_NUMBER:-}" \
            --queue-base-sha "${QUEUE_BASE_SHA:-}" \
            --queue-head-sha "${QUEUE_HEAD_SHA:-}" \
            --queue-validation-out "$QUEUE_VALIDATION_PATH"
      - name: Retain the queue validation classification
        if: ${{ always() && inputs.queue_ticket != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: queue-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-validation.json
          if-no-files-found: error
          retention-days: 14
      # Release authority reads this artifact: `tools/release/ci_evidence.py`
      # accepts a target only while its exact run still retains a `full`
      # manifest for that SHA, so the retention below is a prospective evidence
      # lifetime rather than a diagnostic, and a failed upload must fail the
      # producer job instead of leaving the run without scope evidence.
      - name: Retain the scope manifest
        uses: actions/upload-artifact@v4
        with:
          name: ci-scope-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-scope.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  docs-static:
    # First of the five general Linux jobs on the dual-node trusted role. That
    # role exists on both the shared and the CI-only host, so unlike the Web
    # role it absorbs whichever node has capacity. These jobs are short, cheap
    # and share no toolchain contract, so the group is the reviewable unit
    # rather than the lane. The label set is literal rather than
    # selector-resolved, so a busy or absent role queues them instead of
    # diverting them to paid runners; trust therefore cannot come from the
    # selector's fork branch and stays on each job itself.
    name: Docs / static
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.docs_static && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Three-dot for the same reason `read_git_inventory` uses it: `BASE_SHA`
      # is the base branch tip at event time, so a two-dot range would report,
      # in reverse, everything that landed on the base branch after the branch
      # was cut. A whitespace-carrying line the base branch *deleted* after the
      # cut would then read as added here and fail a branch that never wrote it.
      - name: Validate the exact selected revision range
        env:
          BASE_SHA: ${{ needs.change-scope.outputs.resolved-base-sha }}
          HEAD_SHA: ${{ needs.change-scope.outputs.resolved-head-sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  portal:
    # The one general lane that runs as a reusable workflow. GitHub does not
    # allow a `uses:` job to declare `runs-on`, so this caller keeps only the
    # lane guard and the closed trust condition and the trusted role is
    # declared on the called workflow's own job. That workflow is
    # `workflow_call`-only with this as its single caller, so the role there
    # reroutes Portal and nothing else.
    name: Architecture Portal
    needs: [change-scope, pre-heavy-gate]
    if: >-
      ${{
        !cancelled()
        && needs.pre-heavy-gate.result == 'success'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.portal
        && needs.change-scope.outputs.trusted-head == 'true'
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/architecture-portal.yml
    with:
      check_documentation_impact: ${{ github.event_name == 'pull_request' || needs.change-scope.outputs.queue-mode == 'true' }}
      base_sha: ${{ needs.change-scope.outputs.resolved-base-sha }}
      head_sha: ${{ needs.change-scope.outputs.resolved-head-sha }}
      pull_request_body: ${{ needs.change-scope.outputs.pull-request-body }}

  ci-contract:
    # On the dual-node trusted role with the rest of the general group.
    name: CI contract
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.ci_contract && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Queue-aware actionlint release, pinned harder than a mutable Docker tag.
      # The original container action named a version but not an artifact; the
      # digest below names the exact bytes and the check fails closed on
      # mismatch. It also removes CI's only Docker dependency, which the
      # trusted role cannot satisfy by design: the CI-only host runs no
      # daemon and the shared host's runner users are outside the `docker`
      # group, so CI can never reach the socket that runs production.
      # actionlint still reads `.github/actionlint.yaml` from the workspace.
      # v1.7.12 predates GitHub's concurrency.queue schema and reports the
      # approved keys as unknown (https://github.com/rhysd/actionlint/issues/657).
      # Keep the exception exact and removable: workflow contract tests prove
      # every `queue: max` site, while every other actionlint diagnostic still
      # fails this job.
      - name: Validate workflows with pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            -ignore 'unexpected key "queue" for "concurrency" section'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run every CI-control contract
        run: python3 -m unittest discover -s tests/build -p 'ci_*_test.py'

  deploy-contract:
    # On the dual-node trusted role with the rest of the general group. This
    # lane only reads release history and runs hermetic tests; it holds no
    # deployment credentials and the runner users have no deployment tree or
    # secret access, so routing it does not widen what CI can reach.
    name: Deploy contract
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.deploy_contract && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Allocated release intents may target pre-squash commits that no
      # branch or tag reaches, so a fresh full clone lacks their objects and
      # the repository-local audit reports them unverifiable. Long-lived
      # runner workspaces masked this with leftover objects; hydrating by SHA
      # makes the lane deterministic on any runner, new or old.
      - name: Hydrate release intent target objects
        run: |
          python3 - <<'EOF'
          import json, subprocess
          data = json.load(open("docs/release-evidence/release-intents.json"))
          revisions = [entry["target_revision"] for entry in data["entries"]]
          revisions += [entry["target_revision"] for entry in data["historical_exceptions"]]
          missing = [
              revision for revision in revisions
              if subprocess.run(["git", "cat-file", "-e", f"{revision}^{{commit}}"],
                                capture_output=True).returncode != 0
          ]
          if missing:
              subprocess.run(["git", "fetch", "--no-tags", "origin", *missing], check=True)
              print("hydrated intent targets:", " ".join(missing))
          else:
              print("all intent targets already present")
          EOF
      - run: python3 -m unittest discover -s tests/build -p 'release_*_test.py'
      - run: python3 tests/build/web_runtime_deploy_workflow_test.py
      - run: python3 tests/build/creator_web_deploy_workflow_test.py
      - run: python3 tests/build/web_runtime_public_deployment_docs_test.py
      - run: python3 tests/build/creator_web_public_deployment_docs_test.py
      # The suite is hermetic per test, so it shards across the runner's cores
      # instead of spending its serial wall clock on process spawns. The runner
      # runs its two timing-sensitive signal tests alone after the shards and
      # fails closed if the executed test set differs from the discovered one.
      - run: python3 apps/web-runtime-host/test/deploy_command_test.py --shards 4
      - run: python3 apps/creator-web/test/deploy_command_test.py --shards 4

  chameleon-lab:
    # On the dual-node trusted role with the rest of the general group. Like
    # Web Runtime Lab it keeps its own proof path: a short Node/Python suite
    # that installs nothing on the host, so the cutover changes where it runs
    # and nothing about what it runs.
    name: Chameleon Lab
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.chameleon_lab && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: scripts/chameleon-lab.sh test

  package:
    # Native Core role on the shared host. The role is named literally rather
    # than resolved by a selector, so a saturated or absent role queues this
    # job instead of buying paid Ubuntu capacity for it. Trust therefore
    # cannot come from a selector's fork branch and stays on the job itself.
    name: Core package
    # Direct needs: change-scope is preserved; admission also requires the
    # Pre-heavy Gate and each earlier selected native-heavy predecessor.
    needs: [change-scope, pre-heavy-gate, portal, core-ubuntu]
    if: >-
      ${{
        !cancelled()
        && needs.pre-heavy-gate.result == 'success'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.package
        && needs.change-scope.outputs.trusted-head == 'true'
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu || needs.core-ubuntu.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: false
      # `package` builds Release and runs only the unit and component tiers,
      # so it deliberately skips scripts/verify-core-dependencies.sh and
      # fixture generation: both tiers must stay satisfiable by the LFS
      # fixtures rehydrated above. A generated fixture entering either tier
      # must break this job rather than silently invalidate that assumption.
      - run: scripts/core.sh package
      # Digest-level comparison evidence, never a release input: release assets
      # stay rebuilt and signed by `prepare` on the operator machine, and this
      # lets an operator confirm they describe the same package CI proved
      # packageable. Detached Manifest and checksum only -- a few KB.
      - name: Retain the packaging comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            build/core/dist/*.build-manifest.json
            build/core/dist/*.zip.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  web-toolchain-conformance:
    # First lane cut over to the dedicated CI-only netcup node. The earlier
    # hosted pinning answered heterogeneity on the shared Linux pool, not
    # capacity; the dedicated Web role removes that heterogeneity, so the
    # determinism argument no longer applies to this lane. The label set is
    # literal rather than selector-resolved, so a busy or absent role queues
    # this job instead of diverting it to paid runners. System dependencies
    # are provisioned with the role, so Playwright must not apt-install them
    # into state shared by both runner services on every run.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_toolchain && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/web-ci-proof
        with:
          lane: web_toolchain
          install-system-deps: "false"

  web-runtime-host:
    # Third lane cut over to the dedicated CI-only netcup node, after Web
    # Toolchain and Creator proved the role. This lane was the shared pool's
    # critical path, so it is the one the dedicated capacity exists for. The
    # label set is literal rather than selector-resolved, so a busy or absent
    # role queues this job instead of diverting it to paid runners; leaving
    # the selector also removes the last path by which a fallback could send
    # this lane back to hosted Ubuntu. System dependencies are provisioned
    # with the role, so Playwright must not apt-install them into state
    # shared by both runner services on every run.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_host && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    # 45 was calibrated to GitHub-hosted speed (16-19 min observed). The
    # shared trusted pool ran this lane about 2.2x slower: one success at 40
    # min and one cancellation at exactly 45. The limit is a hang detector, not
    # a performance budget -- the suite owns its own behavior timeouts -- so it
    # must clear the slow machine with room for contention, which rises as
    # runner services per host go up. The netcup role has not yet reported its
    # own timings for this lane, so the headroom stays until it does.
    timeout-minutes: 75
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: ./.github/actions/web-ci-proof
        with:
          lane: web_runtime_host
          install-system-deps: "false"

  creator-web:
    # Second lane cut over to the dedicated CI-only netcup node, after Web
    # Toolchain proved the role. The full Wasm/OPFS fault matrix is
    # timing-sensitive and has exceeded bounded test budgets on the
    # heterogeneous shared Linux pool; the dedicated Web role removes that
    # heterogeneity, so the earlier determinism pinning no longer applies to
    # this lane either. The label set is literal rather than
    # selector-resolved, so a busy or absent role queues this job
    # instead of diverting it to paid runners. System dependencies are
    # provisioned with the role, so Playwright must not apt-install them into
    # state shared by both runner services on every run.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.creator && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: ./.github/actions/web-ci-proof
        with:
          lane: creator
          install-system-deps: "false"

  web-runtime-lab:
    # Fourth and last Web lane cut over to the dedicated CI-only netcup node,
    # after Web Toolchain, Creator and Web Runtime Host proved the role. The
    # label set is literal rather than selector-resolved, so a busy or absent
    # role queues this job instead of diverting it to paid runners, and the
    # selector now has no Web consumer left at all. This lane keeps its own
    # proof path: it never shared the emsdk/Playwright setup contract, so the
    # cutover changes where it runs and nothing about what it runs.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_lab && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: scripts/web-runtime-lab.sh test

  select-review-backend:
    # One Claude backend reviews each Pull Request, not two (#659 item 3).
    # Which one is decided here from the same evidence the scheduled liveness
    # check uses -- what each backend actually posted on recent Pull Requests
    # -- so the fallback takes over on the signal rather than by hand. The
    # decision is a job rather than a step because `strategy.matrix` is
    # evaluated before any step of the job it belongs to runs.
    #
    # The two backends duplicated each other: over the six Pull Requests of
    # the #591 closeout they collided or both posted nothing, while Grok --
    # a different runtime with a different prompt -- shared no finding with
    # either. So the saving is here and not in dropping Grok.
    name: Select review backend
    # Deliberately unconditional. `advisory-review` builds `strategy.matrix`
    # from this job's output, and a matrix expression is not obviously
    # evaluated after that job's own `if:` -- on a push run, where there is no
    # Pull Request to review, a skipped selector would leave `fromJSON('')`
    # to be evaluated on the protected branch's own CI. So this always runs
    # and always prints a valid matrix; the review job's own condition is what
    # keeps it to Pull Requests. Off the Pull Request path it answers without
    # reading the API at all.
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 5
    # A selector that cannot decide must not withhold the review: the script
    # already falls back to the primary when the API is unreadable, and this
    # keeps a crash from skipping the job that `needs:` this one.
    continue-on-error: true
    # Job-level `permissions:` replaces the workflow block outright, so every
    # scope omitted here is `none`. The script lists workflow runs and reads
    # three comment surfaces; without these it would 403, raise, and be caught
    # by the fail-open path above -- which always returns the primary. The
    # handover would then never happen and nothing would say so, the failure
    # this whole check exists to avoid. Same set as
    # advisory-review-liveness.yml, all read.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # The base revision, never the Pull Request's merge ref. This job is
      # unconditional, so it also runs for forks, and checking out the head
      # would execute a fork's copy of the script below on a trusted runner --
      # the other two review jobs refuse fork heads outright and this one
      # cannot, because `advisory-review` needs its matrix either way. A
      # read-only token would not help: the failure domain is the machine.
      # Reading history with the base's script is also the right semantics --
      # a Pull Request should not get to choose its own reviewer.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      - name: Choose the backend from the liveness evidence
        id: select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Preference order, primary first. A repository variable moves the
          # primary without editing this file; the fallback is whatever
          # remains after it.
          ORDER: ${{ vars.CLAUDE_REVIEW_ORDER || 'glm,kimi' }}
          EVENT_NAME: ${{ github.event_name }}
          PRIMARY_MATRIX: '{"include":[{"backend":"glm","base_url":"https://api.z.ai/api/anthropic","secret_name":"ZAI_CODING_KEY"}]}'
        # `-e` is deliberately absent. `advisory-review` evaluates
        # `fromJSON` on this output, so a step that dies without writing one
        # withholds the review -- exactly what the job-level
        # `continue-on-error` above cannot prevent, because it governs the job
        # and not the output. Every path below therefore ends in a matrix, and
        # PRIMARY_MATRIX is the last resort when even the script cannot run
        # (a checkout from before `--select` existed, a broken interpreter, a
        # timeout). Its literal is pinned against the script's own table by
        # tests/build/ci_claude_review_workflow_test.py.
        run: |
          set -uo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            select_args=(--select "$ORDER")
          else
            # No Pull Request to review, so no evidence to weigh: name the
            # primary and spend no API calls on a run that will skip the job.
            select_args=(--select "${ORDER%%,*}")
          fi
          matrix="$(python3 .github/scripts/advisory_review_liveness.py \
            --repository "$GITHUB_REPOSITORY" "${select_args[@]}" | tail -1 || true)"
          case "$matrix" in
            '{"include":'*) ;;
            *)
              echo "::notice::selector produced no matrix; using the primary"
              matrix="$PRIMARY_MATRIX"
              ;;
          esac
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"
          printf 'selected: %s\n' "$matrix"

  advisory-review:
    # Moved here from claude-review.yml so Pre-heavy Gate can `needs:` it.
    # It is NOT merge evidence: its result is never read, it is
    # continue-on-error, and it appears in neither lane_jobs nor
    # self_hosted_jobs. Pre-heavy Gate reads one thing about it -- whether a
    # human has resolved every review thread on the Pull Request -- and that
    # is an admission condition for native-heavy work, not a verdict. The
    # alternative, a hosted gate polling for a separate workflow to finish,
    # would multiply that gate's billed minutes; `needs:` orders it for free.
    #
    # `continue-on-error` reports a failed review as `success` in the API,
    # so a dead reviewer posts nothing and admits: a dead reviewer must not
    # halt the repository. advisory-review-liveness.yml is what notices.
    name: Claude review (${{ matrix.backend }})
    needs: [select-review-backend]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 30
    # Job-level as well as on the Review step: inside ci.yml a failed job
    # fails the workflow and skips everything that `needs:` it, and the step
    # flag does not cover a job timeout, a failed checkout, or a failed
    # credential step. Pre-heavy Gate needs this job; a dead reviewer must
    # admit, not halt (same shape as macos-primary).
    continue-on-error: true
    # Job-level, so the workflow token for every other job keeps its current
    # posture. Posting review threads needs write; nothing else here does.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      # One entry, chosen by select-review-backend. The backends, their base
      # URLs and their secret names are declared once in
      # advisory_review_liveness.py, so a backend cannot exist for this
      # workflow and not for the check that judges it.
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-review-backend.outputs.matrix) }}
    steps:
      - name: Resolve the backend credential
        id: backend
        env:
          BACKEND_KEY: ${{ secrets[matrix.secret_name] }}
          BACKEND: ${{ matrix.backend }}
          SECRET_NAME: ${{ matrix.secret_name }}
        run: |
          set -euo pipefail
          # There is no enabled-set check here any more. It predates the
          # selector and now contradicts it: with one matrix leg, a
          # CLAUDE_REVIEW_BACKENDS that does not name the chosen backend
          # skips the entire Claude review -- and the case it would bite is
          # the one that matters, where the primary is DOWN and `--select`
          # correctly reached for the other one. CLAUDE_REVIEW_ORDER is the
          # single operator knob: name one backend to pin it, two to set the
          # preference order.
          if [[ -z "$BACKEND_KEY" ]]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice::$BACKEND review skipped: no $SECRET_NAME secret"
            exit 0
          fi
          echo "run=true" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: ${{ steps.backend.outputs.run == 'true' }}
        with:
          fetch-depth: 1

      # Pinned to the commit `v1` resolved to. `continue-on-error` because a
      # failed review is a missing review, not a broken change; a red check
      # from a lane that cannot block a merge only teaches people to ignore
      # red. The liveness workflow reads the effect (the signed comment), not
      # this step's conclusion, which continue-on-error rewrites to success.
      - name: Review
        if: ${{ steps.backend.outputs.run == 'true' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ matrix.base_url }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets[matrix.secret_name] }}
          # Under the job's 30-minute timeout so the API timeout fires first
          # and the log names the error, rather than the job timer recording
          # `timed_out` with nothing to read.
          API_TIMEOUT_MS: "1500000"
        with:
          # Explicit, or the action falls back to the Claude GitHub App and
          # attaches an employer-owned Claude organisation to a personal repo.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets[matrix.secret_name] }}
          # Vendored at .claude/commands/pr-review.md; a runtime marketplace
          # clone was rate-limited on the self-hosted runner. The signature
          # line is machine-read by the liveness check to tell the backends
          # apart -- they post under one identity.
          prompt: |
            /pr-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Sign every comment you post -- each inline comment and any summary comment -- by making its very first line exactly:
            <!-- lmdj-review: ${{ matrix.backend }} -->
            That line is read by the advisory review liveness check to tell the two backends apart. Do not omit, alter, or move it.
          # `curl` because a clean review must land as an issue comment and
          # `gh` is not installed on this role's runners; without the tool the
          # model improvises and files the clean summary as a blocking thread.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(curl:*)"

      # Deterministic counterpart to the prompt rule above. A prompt is an
      # instruction, not a guarantee, and five clean "No issues found" threads
      # were resolved by hand on 2026-09-06 purely to unblock merges. This
      # resolves one only when it is unresolved, unanswered, signed by this
      # backend and carries no finding marker.
      - name: Retire a clean review posted as a thread
        if: ${{ always() && steps.backend.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/retire_clean_review_threads.py \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            "<!-- lmdj-review: ${{ matrix.backend }} -->"

  grok-review:
    # Moved here from grok-review.yml for the same reason the Claude lanes
    # were: Pre-heavy Gate `needs:` its reviewers, and a reviewer in its own
    # workflow is not ordered before the gate. That gap mattered most in the
    # case this lane exists for -- when both Claude backends are down, Grok is
    # the only reviewer producing findings, and those were exactly the runs
    # whose findings could arrive after the gate had already admitted the
    # native-heavy set.
    #
    # What does NOT move is the runtime. Grok runs its own pinned CLI with its
    # own credential, not `claude-code-action`, and that independent failure
    # domain is the whole value of the slot: on #610 one action outage took
    # both Claude backends down together and this lane kept working. Only the
    # ordering is shared.
    name: Grok advisory review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 15
    # Job level, not only on the review step: inside ci.yml a failed job fails
    # the workflow and skips everything that `needs:` it, and the step flag
    # covers neither a job timeout nor a failed install.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GROK_DISABLE_AUTOUPDATER: "1"
      GROK_VERSION: "1.0.13"
      # The digest names the exact bytes; the version alone names only a
      # release. Recomputed by downloading the artifact whenever the version
      # moves. The upstream install script publishes no checksum and verifies
      # nothing but an HTTP status and a `--version` string, so pinning has to
      # happen here.
      GROK_SHA256: "edf79521581bb5e6b95abef848491a6a742e860da3e237ebe86a280d30dce4c1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fetch the versioned artifact directly and verify it, rather than
      # piping the upstream installer to a shell. This job holds
      # `pull-requests: write` and a `GITHUB_TOKEN` on a self-hosted runner,
      # so an altered installer would execute on our own machine with those
      # credentials in reach.
      - name: Install the pinned Grok CLI
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/grok"
          curl --fail --silent --show-error --location \
            --output "$binary" \
            "https://x.ai/cli/grok-${GROK_VERSION}-linux-x86_64"
          printf '%s  %s\n' "$GROK_SHA256" "$binary" | sha256sum --check --strict -
          chmod +x "$binary"
          mkdir -p "$HOME/.local/bin"
          mv "$binary" "$HOME/.local/bin/grok"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm Grok CLI pin
        run: |
          set -euo pipefail
          grok --version
          grok --version | grep -F "$GROK_VERSION"

      - name: Collect the pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --find-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"

      - name: Write the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.md"

      # `continue-on-error` because this lane is advisory in name and must be
      # advisory in effect. It failed red on #610 with `max turns reached`,
      # which is a review that did not finish rather than a change that is
      # wrong. Failures stay visible in the job log and in the absence of a
      # review comment; advisory-review-liveness.yml is what notices a lane
      # that has stopped posting.
      - name: Run advisory Grok review
        continue-on-error: true
        env:
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The review is attached to a commit, so an inline thread lands on
          # the revision that was reviewed rather than on whatever the branch
          # points at by the time the API call arrives.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          DIFF_FILE: ${{ runner.temp }}/pr.diff
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: "false"
          PR_SAME_REPOSITORY: "true"
          POST_COMMENT: "true"
          POST_REVIEW: "true"
        run: python3 .github/scripts/grok_review.py

  pre-heavy-gate:
    name: Pre-heavy Gate
    # advisory-review is a needs: for ordering only -- its result is not in
    # PREFLIGHT_RESULTS_JSON and is never consulted. What is consulted is the
    # count of unresolved review threads on the Pull Request once the review
    # has had its turn. Blocking here is cheap: it is before the ~185-minute
    # native-heavy set. Blocking at merge, where required_conversation_resolution
    # used to catch the same threads, was after it.
    needs: [change-scope, docs-static, ci-contract, deploy-contract, chameleon-lab, web-toolchain-conformance, web-runtime-host, creator-web, web-runtime-lab, advisory-review, grok-review]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Reads review threads with the workflow token, which already carries
      # pull-requests: read at the top of this file; the gate itself grants
      # nothing extra.
      - name: Count unresolved review threads
        id: threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Only a pull_request event has threads to count. A push to main or a
          # dispatch admits on the preflight results alone.
          if [[ -z "$PR_NUMBER" ]]; then
            echo "count=0" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # Paged to exhaustion. Threads accumulate across review rounds, and
          # reading one page of 100 would let an unresolved thread on page two
          # admit native-heavy work -- fail-open on exactly the condition this
          # step exists to hold. $o $r $n $c below are GraphQL variables, not
          # shell; single quotes are correct.
          count=0; cursor=""
          while :; do
            args=(-f o="${GITHUB_REPOSITORY_OWNER}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$PR_NUMBER")
            [[ -n "$cursor" ]] && args+=(-f c="$cursor")
            # shellcheck disable=SC2016
            read -r page_unresolved has_next cursor < <(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!,$c:String){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100,after:$c){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}' \
              "${args[@]}" \
              --jq '.data.repository.pullRequest.reviewThreads | [([.nodes[]|select(.isResolved==false)]|length), .pageInfo.hasNextPage, (.pageInfo.endCursor // "")] | @tsv')
            count=$((count + page_unresolved))
            [[ "$has_next" == "true" ]] || break
          done
          echo "count=$count" >>"$GITHUB_OUTPUT"
      - name: Admit native-heavy work after selected preflight success
        env:
          UNRESOLVED_REVIEW_THREADS: ${{ steps.threads.outputs.count }}
          PREFLIGHT_RESULTS_JSON: >-
            {"docs-static":{"result":"${{ needs.docs-static.result }}"},"ci-contract":{"result":"${{ needs.ci-contract.result }}"},"deploy-contract":{"result":"${{ needs.deploy-contract.result }}"},"chameleon-lab":{"result":"${{ needs.chameleon-lab.result }}"},"web-toolchain-conformance":{"result":"${{ needs.web-toolchain-conformance.result }}"},"web-runtime-host":{"result":"${{ needs.web-runtime-host.result }}"},"creator-web":{"result":"${{ needs.creator-web.result }}"},"web-runtime-lab":{"result":"${{ needs.web-runtime-lab.result }}"}}
          SCOPE_MANIFEST: ${{ needs.change-scope.outputs.manifest }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: >-
          python3 scripts/ci/phase_gate.py
          --policy scripts/ci/scope_policy.json
          --manifest-json "$SCOPE_MANIFEST"
          --results-json "$PREFLIGHT_RESULTS_JSON"
          --change-scope-result "$CHANGE_SCOPE_RESULT"
          --unresolved-review-threads "$UNRESOLVED_REVIEW_THREADS"
          --summary "$GITHUB_STEP_SUMMARY"

  core-ubuntu:
    # First of the three native Core lanes on the shared host's role. The
    # persistent native ccache and the coverage toolchain are host state, so
    # this role deliberately does not span both trusted hosts. Naming it
    # literally is what removes the last automatic Hosted Linux fallback: a
    # busy or absent role queues these lanes rather than diverting a whole
    # manifest to paid runners, so trust stays on each job itself.
    name: core (ubuntu-latest)
    # Direct needs: change-scope is preserved; admission also requires the
    # Pre-heavy Gate and each earlier selected native-heavy predecessor.
    needs: [change-scope, pre-heavy-gate, portal]
    if: >-
      ${{
        !cancelled()
        && needs.pre-heavy-gate.result == 'success'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu
        && needs.change-scope.outputs.trusted-head == 'true'
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: true
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh proof
      - name: Verify Apple-only audio targets are absent on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          scripts/core.sh configure dev

          evidence_dir="$(mktemp -d)"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          cmake --build build/core/dev --target help >"$evidence_dir/targets.txt"

          for target in lmdj_audio_coreaudio lmdj_native_audio_probe; do
            if grep -Fq "$target" "$evidence_dir/targets.txt"; then
              echo "unexpected Apple-only target on Ubuntu: $target" >&2
              exit 1
            fi
            if cmake --build build/core/dev --target "$target" \
              >"$evidence_dir/$target.log" 2>&1; then
              echo "unexpected Apple-only target built on Ubuntu: $target" >&2
              exit 1
            fi
            cat "$evidence_dir/$target.log"
          done
      - name: Report persistent ccache statistics
        if: ${{ always() }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2

  pr-gate:
    name: PR Gate
    needs: [change-scope, pre-heavy-gate, docs-static, portal, ci-contract, select-macos-runner, macos-primary, core-ubuntu, core-asan, core-coverage, core-macos, core-asan-macos, web-toolchain-conformance, web-runtime-host, creator-web, web-runtime-lab, deploy-contract, chameleon-lab, package]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Adjudicate the same-run formal lane results
        env:
          FORMAL_RESULTS_JSON: >-
            {"docs-static":{"result":"${{ needs.docs-static.result }}"},"portal":{"result":"${{ needs.portal.result }}"},"ci-contract":{"result":"${{ needs.ci-contract.result }}"},"select-macos-runner":{"result":"${{ needs.select-macos-runner.result }}"},"macos-primary":{"result":"${{ needs.macos-primary.result }}"},"core-ubuntu":{"result":"${{ needs.core-ubuntu.result }}"},"core-asan":{"result":"${{ needs.core-asan.result }}"},"core-coverage":{"result":"${{ needs.core-coverage.result }}"},"core-macos":{"result":"${{ needs.core-macos.result }}"},"core-asan-macos":{"result":"${{ needs.core-asan-macos.result }}"},"web-toolchain-conformance":{"result":"${{ needs.web-toolchain-conformance.result }}"},"web-runtime-host":{"result":"${{ needs.web-runtime-host.result }}"},"creator-web":{"result":"${{ needs.creator-web.result }}"},"web-runtime-lab":{"result":"${{ needs.web-runtime-lab.result }}"},"deploy-contract":{"result":"${{ needs.deploy-contract.result }}"},"chameleon-lab":{"result":"${{ needs.chameleon-lab.result }}"},"package":{"result":"${{ needs.package.result }}"}}
          SCOPE_MANIFEST: ${{ needs.change-scope.outputs.manifest }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          PRE_HEAVY_GATE_RESULT: ${{ needs.pre-heavy-gate.result }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ci/pr_gate.py
          --policy scripts/ci/scope_policy.json
          --manifest-json "$SCOPE_MANIFEST"
          --results-json "$FORMAL_RESULTS_JSON"
          --change-scope-result "$CHANGE_SCOPE_RESULT"
          --pre-heavy-gate-result "$PRE_HEAVY_GATE_RESULT"
          --base-sha "${{ needs.change-scope.outputs.resolved-base-sha }}"
          --head-sha "${{ needs.change-scope.outputs.resolved-head-sha }}"
          --queue-ticket "${{ inputs.queue_ticket }}"
          --queue-pr-number "${{ inputs.queue_pr_number }}"
          --queue-base-sha "${{ inputs.queue_base_sha }}"
          --queue-head-sha "${{ inputs.queue_head_sha }}"
          --summary "$GITHUB_STEP_SUMMARY"

  select-macos-runner:
    name: Select macOS runner
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      self-hosted: ${{ steps.select.outputs.self-hosted }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Select an online idle trusted runner
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          TARGET_RUNNER_NAME: endaye-mbp-m1
          RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
        run: |
          set -euo pipefail

          select_hosted() {
            {
              echo 'runner=["macos-latest"]'
              echo 'self-hosted=false'
              echo "reason=$1"
            } >>"$GITHUB_OUTPUT"
            echo "Using GitHub-hosted macOS: $1"
          }

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            select_hosted 'untrusted fork pull request'
            exit 0
          fi

          if [[ -z "$RUNNER_READ_TOKEN" ]]; then
            select_hosted 'runner status token is unavailable'
            exit 0
          fi

          if ! runner_response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RUNNER_READ_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runners"
          )"; then
            select_hosted 'runner status API is unavailable'
            exit 0
          fi

          runner_inventory="$(
            jq \
              --compact-output \
              '{
                total_count,
                runners: [
                  .runners[]?
                  | {
                      name,
                      status,
                      busy,
                      labels: [.labels[].name]
                    }
                ]
              }' \
              <<<"$runner_response"
          )"
          echo "Runner selection inventory: $runner_inventory"

          runner_candidates="$(
            jq \
              --compact-output \
              --arg runner_name "$TARGET_RUNNER_NAME" \
              '[
                .runners[]?
                | select(.name == $runner_name)
                | {
                    name,
                    status,
                    busy,
                    labels: [.labels[].name]
                  }
              ]' \
              <<<"$runner_response"
          )"
          echo "Runner selection candidates: $runner_candidates"

          # As with the Linux pool, a busy trusted Mac is a latency condition
          # and queues; only an offline, missing, or mislabeled runner is an
          # availability condition worth paying 10.3x the Linux rate for.
          eligible_count="$(
            jq \
              --arg runner_name "$TARGET_RUNNER_NAME" \
              '[
                .runners[]?
                | select(
                    .name == $runner_name
                    and .status == "online"
                  )
                | [.labels[].name]
                | select(contains(["self-hosted", "macOS", "ARM64", "lmdj"]))
              ] | length' \
              <<<"$runner_response"
          )"

          if [[ "$eligible_count" != "1" ]]; then
            select_hosted 'self-hosted runner is offline, missing, or mislabeled'
            exit 0
          fi

          {
            echo 'runner=["self-hosted","macOS","ARM64","lmdj"]'
            echo 'self-hosted=true'
            echo 'reason=online trusted self-hosted runner'
          } >>"$GITHUB_OUTPUT"
          echo "Using self-hosted runner: $TARGET_RUNNER_NAME"

  macos-primary:
    name: macOS gates (primary)
    needs: [change-scope, select-macos-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ${{ fromJSON(needs.select-macos-runner.outputs.runner) }}
    timeout-minutes: 30
    # Infrastructure failure is adjudicated by the fallback and final gate
    # jobs. Semantic test outcomes are published by the composite action.
    continue-on-error: true
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Verify self-hosted Python 3.11
        if: ${{ needs.select-macos-runner.outputs.self-hosted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if python_path="$(command -v python3.11)"; then
            :
          elif python_path="$(command -v python3)" && \
              "$python_path" -c \
                'import sys; raise SystemExit(sys.version_info[:2] != (3, 11))'; then
            :
          else
            echo 'self-hosted macOS requires Python 3.11' >&2
            exit 1
          fi

          "$python_path" -c \
            'import sys; raise SystemExit(sys.version_info[:2] != (3, 11))'

          python_shim_dir="$RUNNER_TEMP/lmdj-python-3.11"
          mkdir -p "$python_shim_dir"
          ln -sf -- "$python_path" "$python_shim_dir/python3"
          echo "$python_shim_dir" >>"$GITHUB_PATH"
          "$python_shim_dir/python3" --version
      - uses: actions/setup-python@v6
        if: ${{ needs.select-macos-runner.outputs.self-hosted != 'true' }}
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run macOS Core gates
        id: gates
        uses: ./.github/actions/macos-core-gates
        with:
          use-ccache: ${{ needs.select-macos-runner.outputs.self-hosted }}

  macos-fallback:
    name: macOS gates (GitHub-hosted fallback)
    needs: [select-macos-runner, macos-primary]
    if: >-
      ${{
        !cancelled()
        && needs.select-macos-runner.outputs.self-hosted == 'true'
        && needs.macos-primary.outputs.completed != 'true'
      }}
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Rerun macOS Core gates after infrastructure failure
        id: gates
        uses: ./.github/actions/macos-core-gates
        with:
          use-ccache: false

  core-macos:
    name: core (macos-latest)
    needs: [change-scope, select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate macOS Core Proof
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_CORE_RESULT: ${{ needs.macos-primary.outputs.core-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_CORE_RESULT: ${{ needs.macos-fallback.outputs.core-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh core

  core-asan-macos:
    name: core-asan-macos
    needs: [change-scope, select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate native macOS sanitizers
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_ASAN_RESULT: ${{ needs.macos-primary.outputs.asan-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_ASAN_RESULT: ${{ needs.macos-fallback.outputs.asan-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh asan

  core-asan:
    # Same native Core role, same reasoning as core-ubuntu.
    # Direct needs: change-scope is preserved; admission also requires the
    # Pre-heavy Gate and each earlier selected native-heavy predecessor.
    needs: [change-scope, pre-heavy-gate, portal, core-ubuntu, package, core-coverage]
    if: >-
      ${{
        !cancelled()
        && needs.pre-heavy-gate.result == 'success'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.core_asan
        && needs.change-scope.outputs.trusted-head == 'true'
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu || needs.core-ubuntu.result == 'success')
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.package || needs.package.result == 'success')
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.core_coverage || needs.core-coverage.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: true
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure asan
      - run: scripts/core.sh build asan
      - run: scripts/core.sh test asan full
      - run: scripts/core.sh test asan stress
      - name: Report persistent ccache statistics
        if: ${{ always() }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2

  core-coverage:
    # Same native Core role, same reasoning as core-ubuntu.
    # Direct needs: change-scope is preserved; admission also requires the
    # Pre-heavy Gate and each earlier selected native-heavy predecessor.
    needs: [change-scope, pre-heavy-gate, portal, core-ubuntu, package]
    if: >-
      ${{
        !cancelled()
        && needs.pre-heavy-gate.result == 'success'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.core_coverage
        && needs.change-scope.outputs.trusted-head == 'true'
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu || needs.core-ubuntu.result == 'success')
        && (!fromJSON(needs.change-scope.outputs.manifest).lanes.package || needs.package.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: true
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - name: Verify coverage toolchain
        run: |
          command -v clang-18
          command -v clang++-18
          command -v llvm-cov-18
      - run: |
          env \
            PATH="/usr/lib/llvm-18/bin:$PATH" \
            CC=clang-18 \
            CXX=clang++-18 \
            scripts/core-coverage.sh check
      - name: Report test budget headroom
        # Reports, never fails. Coverage runs get no sanitizer timeout
        # multiplier, so this is the tightest budget in the repository and the
        # first place a test that has outgrown its tier shows up. A guardrail
        # allowed to stop a Pull Request would be one more source of the
        # randomness it exists to remove.
        if: ${{ always() }}
        run: >-
          python3 tests/quality/test_budget_report.py
          --ctest-log build/core/coverage/coverage/ctest.log
          --sanitizer coverage
          || true
      - name: Upload failed coverage evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-failure
          path: |
            build/core/coverage/coverage/report.txt
            build/core/coverage/coverage/summary.json
            build/core/coverage/coverage/ctest.log
      - name: Report persistent ccache statistics
        if: ${{ always() }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2
