name: Core CI
run-name: Core CI / admitted batch

on:
  workflow_call:
    inputs:
      batch_request:
        description: Authenticated, durably admitted T3 request JSON; never raw PR input.
        required: true
        type: string
      batch_executor:
        description: Durable claim executor JSON matching this caller run and attempt.
        required: true
        type: string
    secrets:
      SELF_HOSTED_RUNNER_READ_TOKEN:
        description: Existing optional read-only runner inventory credential.
        required: false

permissions:
  contents: read
  actions: read

env:
  LMDJ_EMSDK_REVISION: dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
  LMDJ_EMSDK_VERSION: "6.0.5"

concurrency:
  # Preserve every admitted event, including a delayed older schedule event.
  # No shared single-pending group can replace a newer target or an explicit
  # candidate. Native-heavy jobs retain their existing bounded resource lock.
  group: ${{ format('core-ci-self-test-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  change-scope:
    name: Change Scope
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 3
    outputs:
      batch-mode: ${{ steps.entry.outputs.batch-mode }}
      batch-execution: ${{ steps.batch.outputs.execution }}
      manifest: ${{ steps.batch.outputs.execution }}
      trusted-head: ${{ steps.batch.outputs.trusted-head }}
      # Product documentation checks do not consume PR declarations or queue authority.
      queue-mode: 'false'
      pull-request-body: ''
      resolved-base-sha: ${{ steps.batch.outputs.base }}
      resolved-head-sha: ${{ steps.batch.outputs.target }}
      # Keep the fixed-target checkout interface for every product job.
      # Full and focused selection both come from the admitted frozen request.
      self-test: ${{ steps.batch.outputs.fixed-target }}
      self-test-action: ${{ steps.batch.outputs.action }}
      self-test-target: ${{ steps.batch.outputs.target }}
    steps:
      # Reusable workflows inherit the caller's github event/context, not an
      # event_name of workflow_call. A foreign caller with empty batch strings
      # must fail, never fall through to legacy manual full evidence.
      - name: Resolve the execution entry
        id: entry
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          BATCH_REQUEST: ${{ inputs.batch_request }}
          BATCH_EXECUTOR: ${{ inputs.batch_executor }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          caller = f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/self-test-report.yml@refs/heads/main"
          request, executor = os.environ['BATCH_REQUEST'], os.environ['BATCH_EXECUTOR']
          batch = True
          try:
              if batch:
                  if os.environ['CALLER_WORKFLOW_REF'] != caller:
                      raise ValueError('caller is not the durable controller')
                  def unique(pairs):
                      result = {}
                      for key, value in pairs:
                          if key in result:
                              raise ValueError('duplicate field')
                          result[key] = value
                      return result
                  if os.environ['GITHUB_REF'] != 'refs/heads/main' or os.environ['GITHUB_RUN_ATTEMPT'] != '1':
                      raise ValueError('untrusted caller ref/attempt')
                  parsed = json.loads(request, object_pairs_hook=unique)
                  owner = json.loads(executor, object_pairs_hook=unique)
                  if not isinstance(parsed, dict) or not re.fullmatch('[0-9a-f]{40}', str(parsed.get('control', ''))):
                      raise ValueError('invalid control')
                  if not isinstance(owner, dict) or set(owner) != {'run_id', 'attempt'}:
                      raise ValueError('invalid executor')
                  if any(type(v) is not int for v in owner.values()) or owner != {'run_id': int(os.environ['GITHUB_RUN_ID']), 'attempt': 1}:
                      raise ValueError('wrong executor')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  print('batch-mode=' + str(batch).lower(), file=output)
                  if batch:
                      print('control=' + parsed['control'], file=output)
          except (ValueError, TypeError, KeyError):
              raise SystemExit('why: batch entry is incomplete or not this admitted fresh main run; remedy: pass the authenticated request and matching executor, never retry as legacy full')
          PYEOF
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read the frozen policy checkout
        if: ${{ steps.entry.outputs.batch-mode == 'true' }}
        env:
          FROZEN_CONTROL: ${{ steps.entry.outputs.control }}
        run: |
          # checkout cleans this directory on persistent runners, leaving Git's
          # registration behind. One --force recovers only this missing path;
          # locked registrations still fail rather than overriding their owner.
          git --no-replace-objects worktree add --force --detach .batch-policy "$FROZEN_CONTROL"
      - name: Prepare the admitted fixed-target execution
        id: batch
        if: ${{ steps.entry.outputs.batch-mode == 'true' }}
        env:
          BATCH_REQUEST: ${{ inputs.batch_request }}
          BATCH_EXECUTOR: ${{ inputs.batch_executor }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/batch-execution-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # Only current trusted Python is executed. Historical checkout is
          # policy JSON/Git data, not a source of control scripts or actions.
          python3 - "$work/input.json" <<'PYEOF'
          import json, os, subprocess, sys
          sys.path.insert(0, 'scripts/ci')
          import change_scope
          request = json.loads(os.environ['BATCH_REQUEST'], object_pairs_hook=change_scope.reject_duplicates)
          executor = json.loads(os.environ['BATCH_EXECUTOR'], object_pairs_hook=change_scope.reject_duplicates)
          main = subprocess.check_output(['git', '--no-replace-objects', 'rev-parse', 'refs/remotes/origin/main'], text=True).strip()
          # A queued request can retain an older policy control. The actual
          # executor must still use the same complete reusable-workflow source
          # closure; different SHAs alone are not an incompatibility.
          sources = ('.github/workflows/self-test-report.yml', '.github/workflows/ci.yml',
                     '.github/workflows/core-nightly.yml', '.github/workflows/architecture-portal.yml')
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args], stderr=subprocess.DEVNULL)
          try:
              actual = os.environ['GITHUB_SHA']
              if len(actual) != 40 or any(char not in '0123456789abcdef' for char in actual):
                  raise ValueError('invalid executor source')
              for revision in (request['control'], actual, main):
                  if git('cat-file', '-t', revision).strip() != b'commit':
                      raise ValueError('source is not a commit')
                  git('merge-base', '--is-ancestor', revision, main)
              for path in sources:
                  old, current = request['control'] + ':' + path, actual + ':' + path
                  if git('cat-file', '-t', old).strip() != b'blob' or git('cat-file', '-t', current).strip() != b'blob':
                      raise ValueError('missing source blob')
                  if git('cat-file', 'blob', old) != git('cat-file', 'blob', current):
                      raise ValueError('source changed')
          except (KeyError, ValueError, subprocess.CalledProcessError):
              raise SystemExit('why: batch workflow sources are incompatible or unavailable; remedy: retain verification debt and enqueue a request under compatible trusted control')
          # Candidate acceptance already requires the executor's current
          # policy. Avoid spending full-suite capacity on obsolete evidence;
          # automatic and node requests retain their historical policy rules.
          if request['kind'] == 'candidate':
              import test_scope
              try:
                  documents = [json.loads(git('show', actual + ':scripts/ci/' + name),
                                          object_pairs_hook=change_scope.reject_duplicates)
                               for name in ('scope_policy.json', 'self_test_policy.json', 'test_scope_policy.json')]
                  if test_scope.parse_policy(*documents).digest != request['policy']:
                      raise ValueError('candidate policy changed')
              except (KeyError, ValueError, subprocess.CalledProcessError):
                  raise SystemExit('why: candidate policy is incompatible or unavailable at the actual executor; remedy: retain this request and enqueue a new candidate under current trusted control')
          # The detached data worktree shares this exact fetched object store;
          # do not issue another network fetch with a different main boundary.
          document = dict(request=request, executor=executor, run_id=int(os.environ['GITHUB_RUN_ID']),
                          run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), control_sha=request['control'], main_sha=main)
          with open(sys.argv[1], 'w') as output:
              json.dump(document, output)
          PYEOF
          python3 scripts/ci/batch_execution.py prepare --root "$GITHUB_WORKSPACE/.batch-policy" \
            --input "$work/input.json" --output "$work/execution.json"
          python3 - "$work/execution.json" >>"$GITHUB_OUTPUT" <<'PYEOF'
          import json, sys
          execution = json.load(open(sys.argv[1]))
          print('execution=' + json.dumps(execution, sort_keys=True, separators=(',', ':')))
          print('target=' + execution['identity']['target_sha'])
          print('base=' + (execution['identity']['base_sha'] or execution['identity']['target_sha']))
          print('fixed-target=true')
          print('action=run')
          print('trusted-head=true')
          PYEOF

  docs-static:
    # First of the five general Linux jobs on the dual-node trusted role. That
    # role exists on both the shared and the CI-only host, so unlike the Web
    # role it absorbs whichever node has capacity. These jobs are short, cheap
    # and share no toolchain contract, so the group is the reviewable unit
    # rather than the lane. The label set is literal rather than
    # selector-resolved, so a busy or absent role queues them instead of
    # diverting them to paid runners; trust therefore cannot come from the
    # selector's fork branch and stays on each job itself.
    name: Docs / static
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.docs_static && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      # Three-dot for the same reason `read_git_inventory` uses it: `BASE_SHA`
      # is the base branch tip at event time, so a two-dot range would report,
      # in reverse, everything that landed on the base branch after the branch
      # was cut. A whitespace-carrying line the base branch *deleted* after the
      # cut would then read as added here and fail a branch that never wrote it.
      - name: Validate the exact selected revision range
        env:
          BASE_SHA: ${{ needs.change-scope.outputs.resolved-base-sha }}
          HEAD_SHA: ${{ needs.change-scope.outputs.resolved-head-sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  portal:
    # The one general lane that runs as a reusable workflow. GitHub does not
    # allow a `uses:` job to declare `runs-on`, so this caller keeps only the
    # lane guard and the closed trust condition and the trusted role is
    # declared on the called workflow's own job. That workflow is
    # `workflow_call`-only with this as its single caller, so the role there
    # reroutes Portal and nothing else.
    name: Architecture Portal
    needs: change-scope
    if: >-
      ${{
        !cancelled()
        && needs.change-scope.outputs.self-test == 'true'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.portal
        && needs.change-scope.outputs.trusted-head == 'true'
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/architecture-portal.yml
    with:
      check_documentation_impact: ${{ needs.change-scope.outputs.queue-mode == 'true' }}
      base_sha: ${{ needs.change-scope.outputs.resolved-base-sha }}
      head_sha: ${{ needs.change-scope.outputs.resolved-head-sha }}
      checkout_ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
      snapshot_mode: ${{ needs.change-scope.outputs.self-test == 'true' && 'main-interval' || 'own-tree' }}
      pull_request_body: ${{ needs.change-scope.outputs.pull-request-body }}

  ci-contract:
    # On the dual-node trusted role with the rest of the general group.
    name: CI contract
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.ci_contract && needs.change-scope.outputs.trusted-head == 'true' }}
    # Both hosts carry the general role, but only netcup is CI-only: the
    # Contabo node shares its CPUs with staging and ran these suites about
    # 3x slower (CI contract 196 s vs two 10-minute cancellations; the
    # sharded release suite 8 min vs a 20-minute worker deadline), #1557.
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general, ci-only-host]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      # Queue-aware actionlint release, pinned harder than a mutable Docker tag.
      # The original container action named a version but not an artifact; the
      # digest below names the exact bytes and the check fails closed on
      # mismatch. It also removes CI's only Docker dependency, which the
      # trusted role cannot satisfy by design: the CI-only host runs no
      # daemon and the shared host's runner users are outside the `docker`
      # group, so CI can never reach the socket that runs production.
      # actionlint still reads `.github/actionlint.yaml` from the workspace.
      # v1.7.12 predates GitHub's concurrency.queue schema and reports the
      # approved keys as unknown (https://github.com/rhysd/actionlint/issues/657).
      # Keep the exception exact and removable: workflow contract tests prove
      # every `queue: max` site, while every other actionlint diagnostic still
      # fails this job.
      - name: Validate workflows with pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            -ignore 'unexpected key "queue" for "concurrency" section'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Run every CI-control contract
        run: python3 -m unittest discover -s tests/build -p 'ci_*_test.py'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the pinned PR-Agent real-handler seam proof
        run: scripts/ci/pr-agent/integration-test.sh

  deploy-contract:
    # On the dual-node trusted role with the rest of the general group. This
    # lane only reads release history and runs hermetic tests; it holds no
    # deployment credentials and the runner users have no deployment tree or
    # secret access, so routing it does not widen what CI can reach.
    name: Deploy contract
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.deploy_contract && needs.change-scope.outputs.trusted-head == 'true' }}
    # Both hosts carry the general role, but only netcup is CI-only: the
    # Contabo node shares its CPUs with staging and ran these suites about
    # 3x slower (CI contract 196 s vs two 10-minute cancellations; the
    # sharded release suite 8 min vs a 20-minute worker deadline), #1557.
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general, ci-only-host]
    # Hang detection, not a performance budget: the release suite measured
    # 64 minutes serially on 2026-09-17 and had never finished inside the
    # former 15; it now runs across four workers (#1506). Re-measure from the
    # first complete run before tightening.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - &standalone-python
        name: Select standalone system Python
        shell: bash
        run: |
          set -euo pipefail

          python_executable="/usr/bin/python3"

          python_bin="$(mktemp -d "${RUNNER_TEMP:?}/lmdj-system-python.XXXXXX")"
          trap 'rm -rf -- "$python_bin"' EXIT
          ln -s "$python_executable" "$python_bin/python3"
          ln -s "$python_executable" "$python_bin/python"

          # Probe both resolution by name and the sys.executable spawn used by release
          # validators. Do not forward LD_LIBRARY_PATH, PYTHONHOME or any parent state.
          if ! env -i PATH="$python_bin:/usr/bin:/bin" python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11+ is required")
          child = subprocess.run(
              [sys.executable, "-c", "import sys; print(sys.version)"],
              env={"PATH": os.environ["PATH"]},
              check=True, capture_output=True, text=True,
          )
          print(json.dumps({"python": os.path.realpath(sys.executable),
                            "version": sys.version, "sanitized_child": child.stdout.strip()}))
          PY
          then
            echo 'why: system Python cannot run a Python 3.11+ parent and child without loader variables; remedy: repair the host Python installation, never forward loader variables into sanitized children' >&2
            exit 1
          fi

          printf '%s\n' "$python_bin" >>"${GITHUB_PATH:?}"
          trap - EXIT
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      # Allocated release intents may target pre-squash commits that no
      # branch or tag reaches, so a fresh full clone lacks their objects and
      # the repository-local audit reports them unverifiable. Long-lived
      # runner workspaces masked this with leftover objects; hydrating by SHA
      # makes the lane deterministic on any runner, new or old.
      # `hydrate` is the stable interface's only object-store write, kept
      # separate so the audit stays read-only. Decision:
      # docs/prd/decisions/2026-09-06-release-intent-hydrate-subcommand.md;
      # pitfall: .agents/pitfalls/release-intent-target-reachability.md
      - name: Hydrate release intent target objects
        shell: bash
        run: |
          set -euo pipefail
          scripts/release.sh hydrate
      # Every release_*_test.py module, whole modules per worker: modules own
      # their temporary repositories and ports, classes inside one may share a
      # seeded filesystem. The runner fails closed when the executed ids differ
      # from the discovered set.
      - run: python3 tests/build/release_suite_runner.py --shards 4
      - run: python3 tests/build/web_runtime_deploy_workflow_test.py
      - run: python3 tests/build/creator_web_deploy_workflow_test.py
      - run: python3 tests/build/web_runtime_public_deployment_docs_test.py
      - run: python3 tests/build/creator_web_public_deployment_docs_test.py
      # The suite is hermetic per test, so it shards across the runner's cores
      # instead of spending its serial wall clock on process spawns. The runner
      # runs its two timing-sensitive signal tests alone after the shards and
      # fails closed if the executed test set differs from the discovered one.
      - run: python3 apps/web-runtime-host/test/deploy_command_test.py --shards 4
      - run: python3 apps/creator-web/test/deploy_command_test.py --shards 4

  chameleon-lab:
    # On the dual-node trusted role with the rest of the general group. Like
    # Web Runtime Lab it keeps its own proof path: a short Node/Python suite
    # that installs nothing on the host, so the cutover changes where it runs
    # and nothing about what it runs.
    name: Chameleon Lab
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.chameleon_lab && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: scripts/chameleon-lab.sh test

  package:
    # Native Core role on the shared host. The role is named literally rather
    # than resolved by a selector, so a saturated or absent role queues this
    # job instead of buying paid Ubuntu capacity for it. Trust therefore
    # cannot come from a selector's fork branch and stays on the job itself.
    name: Core package
    # Direct needs: change-scope is preserved, followed by each earlier
    # selected native-heavy predecessor.
    needs: [change-scope, portal, core-ubuntu]
    if: >-
      ${{
        !cancelled()
        && needs.change-scope.outputs.self-test == 'true'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.package
        && needs.change-scope.outputs.trusted-head == 'true'
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu || needs.core-ubuntu.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - *standalone-python
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: false
      # `package` builds Release and runs only the unit and component tiers,
      # so it deliberately skips scripts/verify-core-dependencies.sh and
      # fixture generation: both tiers must stay satisfiable by the LFS
      # fixtures rehydrated above. A generated fixture entering either tier
      # must break this job rather than silently invalidate that assumption.
      - run: scripts/core.sh package
      # Digest-level comparison evidence, never a release input: release assets
      # stay rebuilt and signed by `prepare` on the operator machine, and this
      # lets an operator confirm they describe the same package CI proved
      # packageable. Detached Manifest and checksum only -- a few KB.
      - name: Retain the packaging comparison evidence
        uses: actions/upload-artifact@v6
        with:
          name: package-evidence-${{ (needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target) || github.sha }}
          path: |
            build/core/dist/*.build-manifest.json
            build/core/dist/*.zip.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  web-toolchain-conformance:
    # First lane cut over to the dedicated CI-only netcup node. The earlier
    # hosted pinning answered heterogeneity on the shared Linux pool, not
    # capacity; the dedicated Web role removes that heterogeneity, so the
    # determinism argument no longer applies to this lane. The label set is
    # literal rather than selector-resolved, so a busy or absent role queues
    # this job instead of diverting it to paid runners. System dependencies
    # are provisioned with the role, so Playwright must not apt-install them
    # into state shared by both runner services on every run.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_toolchain && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - uses: ./.github/actions/web-ci-proof
        with:
          lane: web_toolchain
          install-system-deps: "false"

  web-runtime-host:
    # Third lane cut over to the dedicated CI-only netcup node, after Web
    # Toolchain and Creator proved the role. This lane was the shared pool's
    # critical path, so it is the one the dedicated capacity exists for. The
    # label set is literal rather than selector-resolved, so a busy or absent
    # role queues this job instead of diverting it to paid runners; leaving
    # the selector also removes the last path by which a fallback could send
    # this lane back to hosted Ubuntu. System dependencies are provisioned
    # with the role, so Playwright must not apt-install them into state
    # shared by both runner services on every run.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_host && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    # 45 was calibrated to GitHub-hosted speed (16-19 min observed). The
    # shared trusted pool ran this lane about 2.2x slower: one success at 40
    # min and one cancellation at exactly 45. The limit is a hang detector, not
    # a performance budget -- the suite owns its own behavior timeouts -- so it
    # must clear the slow machine with room for contention, which rises as
    # runner services per host go up. The netcup role has not yet reported its
    # own timings for this lane, so the headroom stays until it does.
    timeout-minutes: 75
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: ./.github/actions/web-ci-proof
        with:
          lane: web_runtime_host
          install-system-deps: "false"

  creator-web:
    # Second lane cut over to the dedicated CI-only netcup node, after Web
    # Toolchain proved the role. The full Wasm/OPFS fault matrix is
    # timing-sensitive and has exceeded bounded test budgets on the
    # heterogeneous shared Linux pool; the dedicated Web role removes that
    # heterogeneity, so the earlier determinism pinning no longer applies to
    # this lane either. The label set is literal rather than
    # selector-resolved, so a busy or absent role queues this job
    # instead of diverting it to paid runners. System dependencies are
    # provisioned with the role, so Playwright must not apt-install them into
    # state shared by both runner services on every run.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.creator && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: ./.github/actions/web-ci-proof
        with:
          lane: creator
          install-system-deps: "false"

  web-runtime-lab:
    # Fourth and last Web lane cut over to the dedicated CI-only netcup node,
    # after Web Toolchain, Creator and Web Runtime Host proved the role. The
    # label set is literal rather than selector-resolved, so a busy or absent
    # role queues this job instead of diverting it to paid runners, and the
    # selector now has no Web consumer left at all. This lane keeps its own
    # proof path: it never shared the emsdk/Playwright setup contract, so the
    # cutover changes where it runs and nothing about what it runs.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_lab && needs.change-scope.outputs.trusted-head == 'true' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-web-heavy]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: scripts/web-runtime-lab.sh test

  core-ubuntu:
    # First of the three native Core lanes on the shared host's role. The
    # persistent native ccache and the coverage toolchain are host state, so
    # this role deliberately does not span both trusted hosts. Naming it
    # literally is what removes the last automatic Hosted Linux fallback: a
    # busy or absent role queues these lanes rather than diverting a whole
    # manifest to paid runners, so trust stays on each job itself.
    name: core (ubuntu-latest)
    # Direct needs: change-scope is preserved, followed by each earlier
    # selected native-heavy predecessor.
    needs: [change-scope, portal]
    if: >-
      ${{
        !cancelled()
        && needs.change-scope.outputs.self-test == 'true'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu
        && needs.change-scope.outputs.trusted-head == 'true'
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - *standalone-python
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: true
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh proof
      - name: Verify Apple-only audio targets are absent on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          scripts/core.sh configure dev

          evidence_dir="$(mktemp -d)"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          cmake --build build/core/dev --target help >"$evidence_dir/targets.txt"

          for target in lmdj_audio_coreaudio lmdj_native_audio_probe; do
            if grep -Fq "$target" "$evidence_dir/targets.txt"; then
              echo "unexpected Apple-only target on Ubuntu: $target" >&2
              exit 1
            fi
            if cmake --build build/core/dev --target "$target" \
              >"$evidence_dir/$target.log" 2>&1; then
              echo "unexpected Apple-only target built on Ubuntu: $target" >&2
              exit 1
            fi
            cat "$evidence_dir/$target.log"
          done
      - name: Report persistent ccache statistics
        if: ${{ always() }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2

  select-macos-runner:
    name: Select macOS runner
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      self-hosted: ${{ steps.select.outputs.self-hosted }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Select an online idle trusted runner
        id: select
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_RUNNER_NAME: endaye-mbp-m1
          RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
        run: |
          set -euo pipefail

          select_hosted() {
            {
              echo 'runner=["macos-latest"]'
              echo 'self-hosted=false'
              echo "reason=$1"
            } >>"$GITHUB_OUTPUT"
            echo "Using GitHub-hosted macOS: $1"
          }

          if [[ -z "$RUNNER_READ_TOKEN" ]]; then
            select_hosted 'runner status token is unavailable'
            exit 0
          fi

          if ! runner_response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RUNNER_READ_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runners"
          )"; then
            select_hosted 'runner status API is unavailable'
            exit 0
          fi

          runner_inventory="$(
            jq \
              --compact-output \
              '{
                total_count,
                runners: [
                  .runners[]?
                  | {
                      name,
                      status,
                      busy,
                      labels: [.labels[].name]
                    }
                ]
              }' \
              <<<"$runner_response"
          )"
          echo "Runner selection inventory: $runner_inventory"

          runner_candidates="$(
            jq \
              --compact-output \
              --arg runner_name "$TARGET_RUNNER_NAME" \
              '[
                .runners[]?
                | select(.name == $runner_name)
                | {
                    name,
                    status,
                    busy,
                    labels: [.labels[].name]
                  }
              ]' \
              <<<"$runner_response"
          )"
          echo "Runner selection candidates: $runner_candidates"

          # As with the Linux pool, a busy trusted Mac is a latency condition
          # and queues; only an offline, missing, or mislabeled runner is an
          # availability condition worth paying 10.3x the Linux rate for.
          eligible_count="$(
            jq \
              --arg runner_name "$TARGET_RUNNER_NAME" \
              '[
                .runners[]?
                | select(
                    .name == $runner_name
                    and .status == "online"
                  )
                | [.labels[].name]
                | select(contains(["self-hosted", "macOS", "ARM64", "lmdj"]))
              ] | length' \
              <<<"$runner_response"
          )"

          if [[ "$eligible_count" != "1" ]]; then
            select_hosted 'self-hosted runner is offline, missing, or mislabeled'
            exit 0
          fi

          {
            echo 'runner=["self-hosted","macOS","ARM64","lmdj"]'
            echo 'self-hosted=true'
            echo 'reason=online trusted self-hosted runner'
          } >>"$GITHUB_OUTPUT"
          echo "Using self-hosted runner: $TARGET_RUNNER_NAME"

  macos-primary:
    name: macOS gates (primary)
    needs: [change-scope, select-macos-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ${{ fromJSON(needs.select-macos-runner.outputs.runner) }}
    timeout-minutes: 30
    # Release stress moved to this same bare-metal runner in #1558 because its
    # 2.67 ms thread-CPU deadline cannot survive a hypervisor; a gate compiling
    # beside it would reintroduce exactly the overruns that move eliminated.
    # The repository queue is what makes "one heavy native job at a time" true.
    # On the hosted fallback path the group costs only a queue slot.
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    # Infrastructure failure is adjudicated by the fallback and final gate
    # jobs. Semantic test outcomes are published by the composite action.
    continue-on-error: true
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - name: Verify self-hosted Python 3.11
        if: ${{ needs.select-macos-runner.outputs.self-hosted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if python_path="$(command -v python3.11)"; then
            :
          elif python_path="$(command -v python3)" && \
              "$python_path" -c \
                'import sys; raise SystemExit(sys.version_info[:2] != (3, 11))'; then
            :
          else
            echo 'self-hosted macOS requires Python 3.11' >&2
            exit 1
          fi

          "$python_path" -c \
            'import sys; raise SystemExit(sys.version_info[:2] != (3, 11))'

          # $RUNNER_TEMP persists on a self-hosted runner, so a shim left by an
          # earlier run can shadow the interpreter this run just verified.
          # Recreate the directory empty rather than writing over its contents.
          python_shim_dir="$RUNNER_TEMP/lmdj-python-3.11"
          rm -rf -- "$python_shim_dir"
          mkdir -p "$python_shim_dir"
          ln -s -- "$python_path" "$python_shim_dir/python3"
          echo "$python_shim_dir" >>"$GITHUB_PATH"
          "$python_shim_dir/python3" --version
      - uses: actions/setup-python@v6
        if: ${{ needs.select-macos-runner.outputs.self-hosted != 'true' }}
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Run macOS Core gates
        id: gates
        uses: ./.github/actions/macos-core-gates
        with:
          use-ccache: ${{ needs.select-macos-runner.outputs.self-hosted }}

  macos-fallback:
    name: macOS gates (GitHub-hosted fallback)
    needs: [change-scope, select-macos-runner, macos-primary]
    if: >-
      ${{
        !cancelled()
        && needs.select-macos-runner.outputs.self-hosted == 'true'
        && needs.macos-primary.outputs.completed != 'true'
      }}
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Rerun macOS Core gates after infrastructure failure
        id: gates
        uses: ./.github/actions/macos-core-gates
        with:
          use-ccache: false

  core-macos:
    name: core (macos-latest)
    needs: [change-scope, select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate macOS Core Proof
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_CORE_RESULT: ${{ needs.macos-primary.outputs.core-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_CORE_RESULT: ${{ needs.macos-fallback.outputs.core-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh core

  core-asan-macos:
    name: core-asan-macos
    needs: [change-scope, select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate native macOS sanitizers
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_ASAN_RESULT: ${{ needs.macos-primary.outputs.asan-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_ASAN_RESULT: ${{ needs.macos-fallback.outputs.asan-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh asan

  core-asan:
    # Same native Core role, same reasoning as core-ubuntu.
    # Direct needs: change-scope is preserved, followed by each earlier
    # selected native-heavy predecessor.
    needs: [change-scope, portal, core-ubuntu, package, core-coverage]
    if: >-
      ${{
        !cancelled()
        && needs.change-scope.outputs.self-test == 'true'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.core_asan
        && needs.change-scope.outputs.trusted-head == 'true'
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu || needs.core-ubuntu.result == 'success')
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.package || needs.package.result == 'success')
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.core_coverage || needs.core-coverage.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - *standalone-python
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: true
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure asan
      - run: scripts/core.sh build asan
      - run: scripts/core.sh test asan full
      - run: scripts/core.sh test asan stress
      - name: Report persistent ccache statistics
        if: ${{ always() }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2

  core-coverage:
    # Same native Core role, same reasoning as core-ubuntu.
    # Direct needs: change-scope is preserved, followed by each earlier
    # selected native-heavy predecessor.
    needs: [change-scope, portal, core-ubuntu, package]
    if: >-
      ${{
        !cancelled()
        && needs.change-scope.outputs.self-test == 'true'
        && fromJSON(needs.change-scope.outputs.manifest).lanes.core_coverage
        && needs.change-scope.outputs.trusted-head == 'true'
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.portal || needs.portal.result == 'success')
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu || needs.core-ubuntu.result == 'success')
        && (needs.change-scope.outputs.self-test == 'true' || !fromJSON(needs.change-scope.outputs.manifest).lanes.package || needs.package.result == 'success')
      }}
    concurrency:
      group: lmdj-native-heavy
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-core]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.self-test == 'true' && needs.change-scope.outputs.self-test-target || '' }}
          fetch-depth: 0
          lfs: true
      - name: Verify the checked-out target
        if: ${{ needs.change-scope.outputs.self-test == 'true' }}
        env:
          EXPECTED_TARGET: ${{ needs.change-scope.outputs.self-test-target }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
      - name: Rehydrate Core test fixtures
        run: git lfs checkout -- tests/fixtures
      - *standalone-python
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: true
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - name: Verify coverage toolchain
        run: |
          command -v clang-22
          command -v clang++-22
          command -v llvm-cov-22
      - run: |
          env \
            PATH="/usr/lib/llvm-22/bin:$PATH" \
            CC=clang-22 \
            CXX=clang++-22 \
            scripts/core-coverage.sh check
      - name: Report test budget headroom
        # Reports, never fails. Coverage runs get no sanitizer timeout
        # multiplier, so this is the tightest budget in the repository and the
        # first place a test that has outgrown its tier shows up. A guardrail
        # allowed to stop a Pull Request would be one more source of the
        # randomness it exists to remove.
        if: ${{ always() }}
        run: >-
          python3 tests/quality/test_budget_report.py
          --ctest-log build/core/coverage/coverage/ctest.log
          --sanitizer coverage
          || true
      - name: Upload failed coverage evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: core-coverage-failure
          path: |
            build/core/coverage/coverage/report.txt
            build/core/coverage/coverage/summary.json
            build/core/coverage/coverage/ctest.log
      - name: Report persistent ccache statistics
        if: ${{ always() }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2

  # The two stress workloads Core Nightly defines, run inside a self-test
  # batch against its target so the batch's verdict covers them. Each caller
  # reports one result for the workflow it called, so the callers are one per
  # suite; the called jobs keep their own native-heavy capacity queue.
  nightly-tsan:
    name: Self-test TSan stress
    needs: change-scope
    if: >-
      ${{
        !cancelled()
        && needs.change-scope.outputs.self-test == 'true'
        && needs.change-scope.outputs.self-test-action == 'run'
        && fromJSON(needs.change-scope.outputs.batch-execution).suites.core_tsan_stress
        && needs.change-scope.outputs.trusted-head == 'true'
      }}
    uses: ./.github/workflows/core-nightly.yml
    with:
      suite: tsan
      target_revision: ${{ needs.change-scope.outputs.self-test-target }}

  nightly-stress:
    name: Self-test Release stress
    needs: change-scope
    if: >-
      ${{
        !cancelled()
        && needs.change-scope.outputs.self-test == 'true'
        && needs.change-scope.outputs.self-test-action == 'run'
        && fromJSON(needs.change-scope.outputs.batch-execution).suites.core_release_stress
        && needs.change-scope.outputs.trusted-head == 'true'
      }}
    uses: ./.github/workflows/core-nightly.yml
    with:
      suite: stress
      target_revision: ${{ needs.change-scope.outputs.self-test-target }}

  # New incremental evidence is deliberately not named self-test-verdict or
  # ci-scope: neither focused nor a new-source full is legacy release evidence.
  batch-verdict:
    name: Scoped batch verdict
    needs: [change-scope, docs-static, portal, ci-contract, select-macos-runner, macos-primary, macos-fallback, core-ubuntu, core-asan, core-coverage, core-macos, core-asan-macos, web-toolchain-conformance, web-runtime-host, creator-web, web-runtime-lab, deploy-contract, chameleon-lab, package, nightly-tsan, nightly-stress]
    if: ${{ always() && needs.change-scope.outputs.batch-mode == 'true' && needs.change-scope.outputs.batch-execution != '' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Read the frozen verdict policy
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.change-scope.outputs.batch-execution).identity.control_sha }}
          path: .batch-policy
          persist-credentials: false
      - name: Judge selected suites from actual needs
        id: judge
        env:
          EXECUTION_JSON: ${{ needs.change-scope.outputs.batch-execution }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/batch-verdict-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work"
          # No target or historical-control scripts are executed by this
          # producer. The current trusted adapter reads frozen JSON policy.
          python3 - "$work" <<'PYEOF'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts/ci')
          import batch_execution, change_scope, test_scope
          work = pathlib.Path(sys.argv[1])
          execution = json.loads(os.environ['EXECUTION_JSON'], object_pairs_hook=change_scope.reject_duplicates)
          needs = json.loads(os.environ['NEEDS_JSON'], object_pairs_hook=change_scope.reject_duplicates)
          if execution['identity']['run_id'] != int(os.environ['GITHUB_RUN_ID']) or execution['identity']['run_attempt'] != int(os.environ['GITHUB_RUN_ATTEMPT']) or os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('why: scoped verdict has wrong run/attempt; remedy: use a fresh admitted executor')
          policy = test_scope.load_policy('.batch-policy')
          aliases = {'core-tsan': 'nightly-tsan', 'core-stress': 'nightly-stress'}
          # Batch jobs bypass legacy pre-heavy/pr gates and independent
          # predecessor failures. Only true prerequisite failure explains a
          # skipped selected job; nonselected jobs never become observations.
          dependencies = {job: ['change-scope'] for job in policy.inventory.job_owner}
          dependencies['macos-primary'] = ['change-scope', 'select-macos-runner']
          dependencies['macos-fallback'] = ['change-scope', 'select-macos-runner', 'macos-primary']
          dependencies['core-macos'] = ['change-scope', 'select-macos-runner']
          dependencies['core-asan-macos'] = ['change-scope', 'select-macos-runner']
          document = batch_execution.from_needs(policy, execution['identity'], execution['selection'], needs,
                                                aliases=aliases, dependencies=dependencies)
          for name, value in [('execution.json', execution), ('needs.json', needs), ('verdict.json', document)]:
              (work / name).write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('artifact=batch-verdict-' + execution['identity']['target_sha'] + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'], file=output)
              print('status=' + document['status'], file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('Scoped batch: ' + document['selection']['kind'] + ' / ' + document['status'], file=summary)
              print('Unselected suites are not passed; this is not legacy full release evidence.', file=summary)
          PYEOF
      - name: Retain scoped verdict and raw needs
        if: ${{ always() && steps.judge.outputs.artifact != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.judge.outputs.artifact }}
          path: ${{ runner.temp }}/batch-verdict-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
      - name: Keep failed selected work visible
        if: ${{ steps.judge.outputs.status == 'failed' }}
        run: |
          echo 'why: selected batch work failed or remains uncovered; remedy: retain this verdict, report failures and reconcile verification debt' >&2
          exit 1
