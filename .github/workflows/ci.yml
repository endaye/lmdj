name: Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-ubuntu-runner:
    name: Select Ubuntu runner
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      self-hosted: ${{ steps.select.outputs.self-hosted }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Select an online idle trusted runner
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_NAME: contabo-lmdj-linux
          RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
        run: |
          set -euo pipefail

          select_hosted() {
            {
              echo 'runner=["ubuntu-24.04"]'
              echo 'self-hosted=false'
              echo "reason=$1"
            } >>"$GITHUB_OUTPUT"
            echo "Using GitHub-hosted Ubuntu: $1"
          }

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            select_hosted 'untrusted fork pull request'
            exit 0
          fi

          if [[ -z "$RUNNER_READ_TOKEN" ]]; then
            select_hosted 'runner status token is unavailable'
            exit 0
          fi

          if ! runner_response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RUNNER_READ_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runners"
          )"; then
            select_hosted 'runner status API is unavailable'
            exit 0
          fi

          runner_inventory="$(
            jq \
              --compact-output \
              '{
                total_count,
                runners: [
                  .runners[]?
                  | {
                      name,
                      status,
                      busy,
                      labels: [.labels[].name]
                    }
                ]
              }' \
              <<<"$runner_response"
          )"
          echo "Runner selection inventory: $runner_inventory"

          runner_candidates="$(
            jq \
              --compact-output \
              --arg runner_name "$RUNNER_NAME" \
              '[
                .runners[]?
                | select(.name == $runner_name)
                | {
                    name,
                    status,
                    busy,
                    labels: [.labels[].name]
                  }
              ]' \
              <<<"$runner_response"
          )"
          echo "Runner selection candidates: $runner_candidates"

          eligible_count="$(
            jq \
              --arg runner_name "$RUNNER_NAME" \
              '[
                .runners[]?
                | select(
                    .name == $runner_name
                    and .status == "online"
                    and .busy == false
                  )
                | [.labels[].name]
                | select(contains(["self-hosted", "Linux", "X64", "lmdj-linux", "contabo"]))
              ] | length' \
              <<<"$runner_response"
          )"

          if [[ "$eligible_count" != "1" ]]; then
            select_hosted 'self-hosted runner is offline, busy, missing, or mislabeled'
            exit 0
          fi

          {
            echo 'runner=["self-hosted","Linux","X64","lmdj-linux","contabo"]'
            echo 'self-hosted=true'
            echo 'reason=online idle trusted self-hosted runner'
          } >>"$GITHUB_OUTPUT"
          echo "Using self-hosted runner: $RUNNER_NAME"

  web-toolchain-conformance:
    needs: select-ubuntu-runner
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Clone pinned emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git build/toolchains/emsdk
          git -C build/toolchains/emsdk checkout dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
      - name: Install and activate Emscripten 6.0.5
        run: |
          build/toolchains/emsdk/emsdk install 6.0.5
          build/toolchains/emsdk/emsdk activate 6.0.5
      - name: Install locked browser runner
        working-directory: tests/platform/web
        run: npm ci
      - name: Install Chromium and WebKit
        working-directory: tests/platform/web
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Prove the pre-Product Web toolchain
        run: |
          source build/toolchains/emsdk/emsdk_env.sh
          scripts/web-toolchain-conformance.sh proof

  web-runtime-host:
    needs: select-ubuntu-runner
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Clone pinned emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git build/toolchains/emsdk
          git -C build/toolchains/emsdk checkout dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
      - name: Install and activate Emscripten 6.0.5
        run: |
          build/toolchains/emsdk/emsdk install 6.0.5
          build/toolchains/emsdk/emsdk activate 6.0.5
      - name: Install locked browser runner
        working-directory: tests/platform/web
        run: npm ci
      - name: Install Chromium and WebKit
        working-directory: tests/platform/web
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Verify exact Emscripten identity
        run: |
          source build/toolchains/emsdk/emsdk_env.sh
          python3 tools/web-runtime/verify_emscripten.py
      - name: Prove the Formal Web Runtime Host
        run: |
          source build/toolchains/emsdk/emsdk_env.sh
          scripts/web-runtime-host.sh proof

  web-runtime-lab:
    needs: select-ubuntu-runner
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: scripts/web-runtime-lab.sh test

  core-ubuntu:
    name: core (ubuntu-latest)
    needs: select-ubuntu-runner
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh proof
      - name: Verify Apple-only audio targets are absent on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          scripts/core.sh configure dev
          scripts/core.sh build dev

          evidence_dir="$(mktemp -d)"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          cmake --build build/core/dev --target help >"$evidence_dir/targets.txt"

          for target in lmdj_audio_coreaudio lmdj_native_audio_probe; do
            if grep -Fq "$target" "$evidence_dir/targets.txt"; then
              echo "unexpected Apple-only target on Ubuntu: $target" >&2
              exit 1
            fi
            if cmake --build build/core/dev --target "$target" \
              >"$evidence_dir/$target.log" 2>&1; then
              echo "unexpected Apple-only target built on Ubuntu: $target" >&2
              exit 1
            fi
            cat "$evidence_dir/$target.log"
          done

  select-macos-runner:
    name: Select macOS runner
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      self-hosted: ${{ steps.select.outputs.self-hosted }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Select an online idle trusted runner
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_NAME: endaye-mbp-m1
          RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
        run: |
          set -euo pipefail

          select_hosted() {
            {
              echo 'runner=["macos-latest"]'
              echo 'self-hosted=false'
              echo "reason=$1"
            } >>"$GITHUB_OUTPUT"
            echo "Using GitHub-hosted macOS: $1"
          }

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            select_hosted 'untrusted fork pull request'
            exit 0
          fi

          if [[ -z "$RUNNER_READ_TOKEN" ]]; then
            select_hosted 'runner status token is unavailable'
            exit 0
          fi

          if ! runner_response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RUNNER_READ_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runners"
          )"; then
            select_hosted 'runner status API is unavailable'
            exit 0
          fi

          runner_inventory="$(
            jq \
              --compact-output \
              '{
                total_count,
                runners: [
                  .runners[]?
                  | {
                      name,
                      status,
                      busy,
                      labels: [.labels[].name]
                    }
                ]
              }' \
              <<<"$runner_response"
          )"
          echo "Runner selection inventory: $runner_inventory"

          runner_candidates="$(
            jq \
              --compact-output \
              --arg runner_name "$RUNNER_NAME" \
              '[
                .runners[]?
                | select(.name == $runner_name)
                | {
                    name,
                    status,
                    busy,
                    labels: [.labels[].name]
                  }
              ]' \
              <<<"$runner_response"
          )"
          echo "Runner selection candidates: $runner_candidates"

          eligible_count="$(
            jq \
              --arg runner_name "$RUNNER_NAME" \
              '[
                .runners[]?
                | select(
                    .name == $runner_name
                    and .status == "online"
                    and .busy == false
                  )
                | [.labels[].name]
                | select(contains(["self-hosted", "macOS", "ARM64", "lmdj"]))
              ] | length' \
              <<<"$runner_response"
          )"

          if [[ "$eligible_count" != "1" ]]; then
            select_hosted 'self-hosted runner is offline, busy, missing, or mislabeled'
            exit 0
          fi

          {
            echo 'runner=["self-hosted","macOS","ARM64","lmdj"]'
            echo 'self-hosted=true'
            echo 'reason=online idle trusted self-hosted runner'
          } >>"$GITHUB_OUTPUT"
          echo "Using self-hosted runner: $RUNNER_NAME"

  macos-primary:
    name: macOS gates (primary)
    needs: select-macos-runner
    runs-on: ${{ fromJSON(needs.select-macos-runner.outputs.runner) }}
    timeout-minutes: 30
    # Infrastructure failure is adjudicated by the fallback and final gate
    # jobs. Semantic test outcomes are published by the composite action.
    continue-on-error: true
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run macOS Core gates
        id: gates
        uses: ./.github/actions/macos-core-gates

  macos-fallback:
    name: macOS gates (GitHub-hosted fallback)
    needs: [select-macos-runner, macos-primary]
    if: >-
      ${{
        !cancelled()
        && needs.select-macos-runner.outputs.self-hosted == 'true'
        && needs.macos-primary.outputs.completed != 'true'
      }}
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Rerun macOS Core gates after infrastructure failure
        id: gates
        uses: ./.github/actions/macos-core-gates

  core-macos:
    name: core (macos-latest)
    needs: [select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate macOS Core Proof
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_CORE_RESULT: ${{ needs.macos-primary.outputs.core-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_CORE_RESULT: ${{ needs.macos-fallback.outputs.core-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh core

  core-asan-macos:
    name: core-asan-macos
    needs: [select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate native macOS sanitizers
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_ASAN_RESULT: ${{ needs.macos-primary.outputs.asan-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_ASAN_RESULT: ${{ needs.macos-fallback.outputs.asan-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh asan

  core-asan:
    needs: select-ubuntu-runner
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure asan
      - run: scripts/core.sh build asan
      - run: scripts/core.sh test asan full
      - run: scripts/core.sh test asan stress

  core-coverage:
    needs: select-ubuntu-runner
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - run: |
          env \
            PATH="/usr/lib/llvm-18/bin:$PATH" \
            CC=clang-18 \
            CXX=clang++-18 \
            scripts/core-coverage.sh check
      - name: Upload failed coverage evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-failure
          path: |
            build/core/coverage/coverage/report.txt
            build/core/coverage/coverage/summary.json
