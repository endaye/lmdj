name: Core CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: >-
          Comma-separated lanes to run, e.g. "web_toolchain,creator". Leave
          empty to run every lane, which is what a dispatch does today.
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  LMDJ_EMSDK_REVISION: dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
  LMDJ_EMSDK_VERSION: "6.0.5"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('core-ci-pr-{0}', github.event.pull_request.number) || format('core-ci-sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-scope:
    name: Change Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      manifest: ${{ steps.scope.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify the complete change inventory
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_PATH: ${{ runner.temp }}/ci-scope.json
          REQUESTED_LANES: ${{ inputs.lanes }}
        run: |
          set -euo pipefail
          python3 scripts/ci/change_scope.py \
            --policy scripts/ci/scope_policy.json \
            --event "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --manifest-out "$MANIFEST_PATH" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --lanes "${REQUESTED_LANES:-}"
      - name: Retain the scope manifest
        uses: actions/upload-artifact@v4
        with:
          name: ci-scope-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ci-scope.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  select-ubuntu-runner:
    name: Select Ubuntu runner
    needs: change-scope
    if: ${{ !cancelled() && (fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_host || fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_lab || fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu || fromJSON(needs.change-scope.outputs.manifest).lanes.core_asan || fromJSON(needs.change-scope.outputs.manifest).lanes.core_coverage || fromJSON(needs.change-scope.outputs.manifest).lanes.package) }}
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      self-hosted: ${{ steps.select.outputs.self-hosted }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Select an online idle trusted runner
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
        run: |
          set -euo pipefail

          select_hosted() {
            {
              echo 'runner=["ubuntu-24.04"]'
              echo 'self-hosted=false'
              echo "reason=$1"
            } >>"$GITHUB_OUTPUT"
            echo "Using GitHub-hosted Ubuntu: $1"
          }

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            select_hosted 'untrusted fork pull request'
            exit 0
          fi

          if [[ -z "$RUNNER_READ_TOKEN" ]]; then
            select_hosted 'runner status token is unavailable'
            exit 0
          fi

          if ! runner_response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RUNNER_READ_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runners"
          )"; then
            select_hosted 'runner status API is unavailable'
            exit 0
          fi

          runner_inventory="$(
            jq \
              --compact-output \
              '{
                total_count,
                runners: [
                  .runners[]?
                  | {
                      name,
                      status,
                      busy,
                      labels: [.labels[].name]
                    }
                ]
              }' \
              <<<"$runner_response"
          )"
          echo "Runner selection inventory: $runner_inventory"

          runner_candidates="$(
            jq \
              --compact-output \
              '[
                .runners[]?
                | select(
                    [.labels[].name]
                    | contains(["self-hosted", "Linux", "X64", "lmdj-linux", "contabo"])
                  )
                | {
                    name,
                    status,
                    busy,
                    labels: [.labels[].name]
                  }
              ]' \
              <<<"$runner_response"
          )"
          echo "Runner selection candidates: $runner_candidates"

          # Eligibility deliberately ignores `busy`. GitHub already queues a
          # label-matched job against a loaded pool, so a busy runner is a
          # latency condition; only an absent pool is an availability
          # condition. Treating the two alike diverted an entire manifest to
          # paid infrastructure whenever concurrent runs happened to saturate
          # the pool for an instant.
          eligible_count="$(
            jq \
              '[
                .runners[]?
                | select(.status == "online")
                | [.labels[].name]
                | select(contains(["self-hosted", "Linux", "X64", "lmdj-linux", "contabo"]))
              ] | length' \
              <<<"$runner_response"
          )"

          idle_count="$(
            jq \
              '[
                .runners[]?
                | select(
                    .status == "online"
                    and .busy == false
                  )
                | [.labels[].name]
                | select(contains(["self-hosted", "Linux", "X64", "lmdj-linux", "contabo"]))
              ] | length' \
              <<<"$runner_response"
          )"

          if [[ "$eligible_count" == "0" ]]; then
            select_hosted 'no online trusted self-hosted runner is available'
            exit 0
          fi

          {
            echo 'runner=["self-hosted","Linux","X64","lmdj-linux","contabo"]'
            echo 'self-hosted=true'
            echo 'reason=online trusted self-hosted runner pool'
          } >>"$GITHUB_OUTPUT"
          echo "Using trusted self-hosted runner pool: $eligible_count online runner(s), $idle_count idle"
          if [[ "$idle_count" == "0" ]]; then
            echo 'Trusted pool is saturated; selected jobs queue instead of using paid runners.'
          fi

  docs-static:
    name: Docs / static
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.docs_static }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate the exact selected revision range
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  portal:
    name: Architecture Portal
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.portal }}
    uses: ./.github/workflows/architecture-portal.yml
    with:
      check_documentation_impact: ${{ github.event_name == 'pull_request' }}
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      pull_request_body: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}

  ci-contract:
    name: CI contract
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.ci_contract }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflows with pinned actionlint
        uses: docker://rhysd/actionlint:1.7.7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run every CI-control contract
        run: python3 -m unittest discover -s tests/build -p 'ci_*_test.py'

  deploy-contract:
    name: Deploy contract
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.deploy_contract }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests/build -p 'release_*_test.py'
      - run: python3 tests/build/web_runtime_deploy_workflow_test.py
      - run: python3 tests/build/web_runtime_public_deployment_docs_test.py
      # The suite is hermetic per test, so it shards across the runner's cores
      # instead of spending its serial wall clock on process spawns. The runner
      # runs its two timing-sensitive signal tests alone after the shards and
      # fails closed if the executed test set differs from the discovered one.
      - run: python3 apps/web-runtime-host/test/deploy_command_test.py --shards 4

  chameleon-lab:
    name: Chameleon Lab
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.chameleon_lab }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: scripts/chameleon-lab.sh test

  package:
    name: Core package
    needs: [change-scope, select-ubuntu-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.package }}
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: false
      - run: scripts/core.sh package

  web-toolchain-conformance:
    # The full Wasm/OPFS fault matrix is timing-sensitive and has exceeded
    # bounded test budgets on the heterogeneous self-hosted Linux pool.
    # This lane stays GitHub-hosted for determinism, not for capacity, so
    # neither extra runner slots nor toolchain caching justifies moving it.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure bounded build parallelism
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: false
      - name: Restore pinned emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: build/toolchains/emsdk
          key: emsdk-${{ env.LMDJ_EMSDK_REVISION }}-${{ env.LMDJ_EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Clone pinned emsdk
        if: ${{ steps.emsdk-cache.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/emscripten-core/emsdk.git build/toolchains/emsdk
          git -C build/toolchains/emsdk checkout "$LMDJ_EMSDK_REVISION"
      - name: Install pinned Emscripten
        if: ${{ steps.emsdk-cache.outputs.cache-hit != 'true' }}
        run: build/toolchains/emsdk/emsdk install "$LMDJ_EMSDK_VERSION"
      - name: Activate pinned Emscripten
        run: build/toolchains/emsdk/emsdk activate "$LMDJ_EMSDK_VERSION"
      - name: Install locked browser runner
        working-directory: tests/platform/web
        run: npm ci
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/platform/web/package-lock.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium and WebKit
        working-directory: tests/platform/web
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Prove the pre-Product Web toolchain
        run: |
          source build/toolchains/emsdk/emsdk_env.sh
          scripts/web-toolchain-conformance.sh proof

  web-runtime-host:
    needs: [change-scope, select-ubuntu-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_host }}
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    # 45 was calibrated to GitHub-hosted speed (16-19 min observed). The
    # trusted pool runs this lane about 2.2x slower: one success at 40 min
    # and one cancellation at exactly 45. The limit is a hang detector, not
    # a performance budget -- the suite owns its own behavior timeouts -- so
    # it must clear the slow machine with room for pool contention, which
    # rises as runner services per host go up.
    timeout-minutes: 75
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure bounded build parallelism
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: false
      - name: Restore pinned emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: build/toolchains/emsdk
          key: emsdk-${{ env.LMDJ_EMSDK_REVISION }}-${{ env.LMDJ_EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Clone pinned emsdk
        if: ${{ steps.emsdk-cache.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/emscripten-core/emsdk.git build/toolchains/emsdk
          git -C build/toolchains/emsdk checkout "$LMDJ_EMSDK_REVISION"
      - name: Install pinned Emscripten
        if: ${{ steps.emsdk-cache.outputs.cache-hit != 'true' }}
        run: build/toolchains/emsdk/emsdk install "$LMDJ_EMSDK_VERSION"
      - name: Activate pinned Emscripten
        run: build/toolchains/emsdk/emsdk activate "$LMDJ_EMSDK_VERSION"
      - name: Install locked browser runner
        working-directory: tests/platform/web
        run: npm ci
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/platform/web/package-lock.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium and WebKit
        working-directory: tests/platform/web
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Verify exact Emscripten identity
        run: |
          source build/toolchains/emsdk/emsdk_env.sh
          python3 tools/web-runtime/verify_emscripten.py
      - name: Prove the Formal Web Runtime Host
        run: |
          source build/toolchains/emsdk/emsdk_env.sh
          scripts/web-runtime-host.sh proof

  creator-web:
    # The full Wasm/OPFS fault matrix is timing-sensitive and has exceeded
    # bounded test budgets on the heterogeneous self-hosted Linux pool.
    # This lane stays GitHub-hosted for determinism, not for capacity, so
    # neither extra runner slots nor toolchain caching justifies moving it.
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.creator }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure bounded build parallelism
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: false
      - name: Restore pinned emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: build/toolchains/emsdk
          key: emsdk-${{ env.LMDJ_EMSDK_REVISION }}-${{ env.LMDJ_EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Clone pinned emsdk
        if: ${{ steps.emsdk-cache.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/emscripten-core/emsdk.git build/toolchains/emsdk
          git -C build/toolchains/emsdk checkout "$LMDJ_EMSDK_REVISION"
      - name: Install pinned Emscripten
        if: ${{ steps.emsdk-cache.outputs.cache-hit != 'true' }}
        run: build/toolchains/emsdk/emsdk install "$LMDJ_EMSDK_VERSION"
      - name: Activate pinned Emscripten
        run: build/toolchains/emsdk/emsdk activate "$LMDJ_EMSDK_VERSION"
      - name: Install locked Creator dependencies
        working-directory: apps/creator-web
        run: npm ci
      - name: Install locked browser runner
        working-directory: tests/platform/web
        run: npm ci
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/platform/web/package-lock.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium and WebKit
        working-directory: tests/platform/web
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Prove the packaged Creator Web Host
        run: |
          source build/toolchains/emsdk/emsdk_env.sh
          scripts/creator-web.sh proof

  web-runtime-lab:
    needs: [change-scope, select-ubuntu-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.web_runtime_lab }}
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: scripts/web-runtime-lab.sh test

  core-ubuntu:
    name: core (ubuntu-latest)
    needs: [change-scope, select-ubuntu-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_ubuntu }}
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: ${{ needs.select-ubuntu-runner.outputs.self-hosted }}
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh proof
      - name: Verify Apple-only audio targets are absent on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          scripts/core.sh configure dev

          evidence_dir="$(mktemp -d)"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          cmake --build build/core/dev --target help >"$evidence_dir/targets.txt"

          for target in lmdj_audio_coreaudio lmdj_native_audio_probe; do
            if grep -Fq "$target" "$evidence_dir/targets.txt"; then
              echo "unexpected Apple-only target on Ubuntu: $target" >&2
              exit 1
            fi
            if cmake --build build/core/dev --target "$target" \
              >"$evidence_dir/$target.log" 2>&1; then
              echo "unexpected Apple-only target built on Ubuntu: $target" >&2
              exit 1
            fi
            cat "$evidence_dir/$target.log"
          done
      - name: Report persistent ccache statistics
        if: ${{ always() && needs.select-ubuntu-runner.outputs.self-hosted == 'true' }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2

  pr-gate:
    name: PR Gate
    needs: [change-scope, docs-static, portal, ci-contract, select-ubuntu-runner, select-macos-runner, macos-primary, core-ubuntu, core-asan, core-coverage, core-macos, core-asan-macos, web-toolchain-conformance, web-runtime-host, creator-web, web-runtime-lab, deploy-contract, chameleon-lab, package]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate the same-run formal lane results
        env:
          FORMAL_RESULTS_JSON: >-
            {"docs-static":{"result":"${{ needs.docs-static.result }}"},"portal":{"result":"${{ needs.portal.result }}"},"ci-contract":{"result":"${{ needs.ci-contract.result }}"},"select-ubuntu-runner":{"result":"${{ needs.select-ubuntu-runner.result }}"},"select-macos-runner":{"result":"${{ needs.select-macos-runner.result }}"},"macos-primary":{"result":"${{ needs.macos-primary.result }}"},"core-ubuntu":{"result":"${{ needs.core-ubuntu.result }}"},"core-asan":{"result":"${{ needs.core-asan.result }}"},"core-coverage":{"result":"${{ needs.core-coverage.result }}"},"core-macos":{"result":"${{ needs.core-macos.result }}"},"core-asan-macos":{"result":"${{ needs.core-asan-macos.result }}"},"web-toolchain-conformance":{"result":"${{ needs.web-toolchain-conformance.result }}"},"web-runtime-host":{"result":"${{ needs.web-runtime-host.result }}"},"creator-web":{"result":"${{ needs.creator-web.result }}"},"web-runtime-lab":{"result":"${{ needs.web-runtime-lab.result }}"},"deploy-contract":{"result":"${{ needs.deploy-contract.result }}"},"chameleon-lab":{"result":"${{ needs.chameleon-lab.result }}"},"package":{"result":"${{ needs.package.result }}"}}
          SCOPE_MANIFEST: ${{ needs.change-scope.outputs.manifest }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ci/pr_gate.py
          --policy scripts/ci/scope_policy.json
          --manifest-json "$SCOPE_MANIFEST"
          --results-json "$FORMAL_RESULTS_JSON"
          --change-scope-result "$CHANGE_SCOPE_RESULT"
          --base-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}"
          --head-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          --summary "$GITHUB_STEP_SUMMARY"

  select-macos-runner:
    name: Select macOS runner
    needs: change-scope
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      self-hosted: ${{ steps.select.outputs.self-hosted }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Select an online idle trusted runner
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          TARGET_RUNNER_NAME: endaye-mbp-m1
          RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
        run: |
          set -euo pipefail

          select_hosted() {
            {
              echo 'runner=["macos-latest"]'
              echo 'self-hosted=false'
              echo "reason=$1"
            } >>"$GITHUB_OUTPUT"
            echo "Using GitHub-hosted macOS: $1"
          }

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            select_hosted 'untrusted fork pull request'
            exit 0
          fi

          if [[ -z "$RUNNER_READ_TOKEN" ]]; then
            select_hosted 'runner status token is unavailable'
            exit 0
          fi

          if ! runner_response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RUNNER_READ_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runners"
          )"; then
            select_hosted 'runner status API is unavailable'
            exit 0
          fi

          runner_inventory="$(
            jq \
              --compact-output \
              '{
                total_count,
                runners: [
                  .runners[]?
                  | {
                      name,
                      status,
                      busy,
                      labels: [.labels[].name]
                    }
                ]
              }' \
              <<<"$runner_response"
          )"
          echo "Runner selection inventory: $runner_inventory"

          runner_candidates="$(
            jq \
              --compact-output \
              --arg runner_name "$TARGET_RUNNER_NAME" \
              '[
                .runners[]?
                | select(.name == $runner_name)
                | {
                    name,
                    status,
                    busy,
                    labels: [.labels[].name]
                  }
              ]' \
              <<<"$runner_response"
          )"
          echo "Runner selection candidates: $runner_candidates"

          # As with the Linux pool, a busy trusted Mac is a latency condition
          # and queues; only an offline, missing, or mislabeled runner is an
          # availability condition worth paying 10.3x the Linux rate for.
          eligible_count="$(
            jq \
              --arg runner_name "$TARGET_RUNNER_NAME" \
              '[
                .runners[]?
                | select(
                    .name == $runner_name
                    and .status == "online"
                  )
                | [.labels[].name]
                | select(contains(["self-hosted", "macOS", "ARM64", "lmdj"]))
              ] | length' \
              <<<"$runner_response"
          )"

          if [[ "$eligible_count" != "1" ]]; then
            select_hosted 'self-hosted runner is offline, missing, or mislabeled'
            exit 0
          fi

          {
            echo 'runner=["self-hosted","macOS","ARM64","lmdj"]'
            echo 'self-hosted=true'
            echo 'reason=online trusted self-hosted runner'
          } >>"$GITHUB_OUTPUT"
          echo "Using self-hosted runner: $TARGET_RUNNER_NAME"

  macos-primary:
    name: macOS gates (primary)
    needs: [change-scope, select-macos-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ${{ fromJSON(needs.select-macos-runner.outputs.runner) }}
    timeout-minutes: 30
    # Infrastructure failure is adjudicated by the fallback and final gate
    # jobs. Semantic test outcomes are published by the composite action.
    continue-on-error: true
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Verify self-hosted Python 3.11
        if: ${{ needs.select-macos-runner.outputs.self-hosted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if python_path="$(command -v python3.11)"; then
            :
          elif python_path="$(command -v python3)" && \
              "$python_path" -c \
                'import sys; raise SystemExit(sys.version_info[:2] != (3, 11))'; then
            :
          else
            echo 'self-hosted macOS requires Python 3.11' >&2
            exit 1
          fi

          "$python_path" -c \
            'import sys; raise SystemExit(sys.version_info[:2] != (3, 11))'

          python_shim_dir="$RUNNER_TEMP/lmdj-python-3.11"
          mkdir -p "$python_shim_dir"
          ln -sf -- "$python_path" "$python_shim_dir/python3"
          echo "$python_shim_dir" >>"$GITHUB_PATH"
          "$python_shim_dir/python3" --version
      - uses: actions/setup-python@v6
        if: ${{ needs.select-macos-runner.outputs.self-hosted != 'true' }}
        with:
          python-version: "3.11"
      - name: Run macOS Core gates
        id: gates
        uses: ./.github/actions/macos-core-gates
        with:
          use-ccache: ${{ needs.select-macos-runner.outputs.self-hosted }}

  macos-fallback:
    name: macOS gates (GitHub-hosted fallback)
    needs: [select-macos-runner, macos-primary]
    if: >-
      ${{
        !cancelled()
        && needs.select-macos-runner.outputs.self-hosted == 'true'
        && needs.macos-primary.outputs.completed != 'true'
      }}
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      completed: ${{ steps.gates.outputs.completed }}
      prepare-result: ${{ steps.gates.outputs.prepare-result }}
      core-result: ${{ steps.gates.outputs.core-result }}
      asan-result: ${{ steps.gates.outputs.asan-result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Rerun macOS Core gates after infrastructure failure
        id: gates
        uses: ./.github/actions/macos-core-gates
        with:
          use-ccache: false

  core-macos:
    name: core (macos-latest)
    needs: [change-scope, select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate macOS Core Proof
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_CORE_RESULT: ${{ needs.macos-primary.outputs.core-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_CORE_RESULT: ${{ needs.macos-fallback.outputs.core-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh core

  core-asan-macos:
    name: core-asan-macos
    needs: [change-scope, select-macos-runner, macos-primary, macos-fallback]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_macos }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Adjudicate native macOS sanitizers
        env:
          PRIMARY_COMPLETED: ${{ needs.macos-primary.outputs.completed }}
          PRIMARY_PREPARE_RESULT: ${{ needs.macos-primary.outputs.prepare-result }}
          PRIMARY_ASAN_RESULT: ${{ needs.macos-primary.outputs.asan-result }}
          FALLBACK_COMPLETED: ${{ needs.macos-fallback.outputs.completed }}
          FALLBACK_PREPARE_RESULT: ${{ needs.macos-fallback.outputs.prepare-result }}
          FALLBACK_ASAN_RESULT: ${{ needs.macos-fallback.outputs.asan-result }}
        run: bash .github/scripts/assert-macos-gate-result.sh asan

  core-asan:
    needs: [change-scope, select-ubuntu-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_asan }}
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: ${{ needs.select-ubuntu-runner.outputs.self-hosted }}
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: scripts/core.sh configure asan
      - run: scripts/core.sh build asan
      - run: scripts/core.sh test asan full
      - run: scripts/core.sh test asan stress
      - name: Report persistent ccache statistics
        if: ${{ always() && needs.select-ubuntu-runner.outputs.self-hosted == 'true' }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2

  core-coverage:
    needs: [change-scope, select-ubuntu-runner]
    if: ${{ !cancelled() && fromJSON(needs.change-scope.outputs.manifest).lanes.core_coverage }}
    runs-on: ${{ fromJSON(needs.select-ubuntu-runner.outputs.runner) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Rehydrate deterministic audio fixtures
        run: git lfs checkout -- tests/fixtures/audio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure bounded build acceleration
        uses: ./.github/actions/configure-build-acceleration
        with:
          use-ccache: ${{ needs.select-ubuntu-runner.outputs.self-hosted }}
      - run: python3 tests/fixtures/audio/make_fixtures.py
      - run: python3 tests/fixtures/golden/reference_render.py
      - run: bash scripts/verify-core-dependencies.sh
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - run: |
          env \
            PATH="/usr/lib/llvm-18/bin:$PATH" \
            CC=clang-18 \
            CXX=clang++-18 \
            scripts/core-coverage.sh check
      - name: Upload failed coverage evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-failure
          path: |
            build/core/coverage/coverage/report.txt
            build/core/coverage/coverage/summary.json
      - name: Report persistent ccache statistics
        if: ${{ always() && needs.select-ubuntu-runner.outputs.self-hosted == 'true' }}
        run: >-
          ccache --show-log-stats
          || echo 'warning: ccache statistics are unavailable' >&2
