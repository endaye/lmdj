name: Cloudflare Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Canonical copy with per-entry evidence: scripts/ci/cloudflare_preview_paths.json
    # (tests/build/ci_cloudflare_preview_paths_test.py proves set equality).
    paths:
      - apps/docs-site/**
      - products/lmdj/**
      - packages/*/module.json
      - apps/*/module.json
      - providers/**
      - contracts/**
      - apps/creator-web/CHANGELOG.md
      - apps/web-runtime-host/CHANGELOG.md
      - docs/release-evidence/release-intents.json
      - docs/release-evidence/changelog-publications.json
      - docs/governance/version-management.md
      - docs/quality/2026-08-03-formal-web-runtime-host-acceptance.md
      - docs/quality/2026-08-07-stage7-creator-editor-acceptance.md
      - docs/quality/2026-08-12-stage7-creator-editor-review.md
      - docs/plans/2026-08-07-lmdj-stage7-creator-editor.md
      - docs/plans/2026-08-13-lmdj-stage7-review-remediation.md
      - docs/design/2026-08-07-lmdj-stage7-creator-editor-design.md
      - docs/design/2026-08-13-lmdj-stage7-review-remediation-design.md
      - docs/release-evidence/2026-08-13-stage7-remediation-canary.md
      - docs/release-evidence/2026-08-13-stage7-keyboard-mapping-canary-1.0.20.0.md
      - tools/release/**
      - tools/canary/preparation.py
      - tools/canary/records.py
      - tests/build/release_changelog_site_test.py
      - scripts/docs-site.sh
      - scripts/architecture-portal.sh
      - .github/workflows/cloudflare-preview-build.yml
      - .github/workflows/cloudflare-preview-publish.yml
      - .github/workflows/cloudflare-preview-budget.yml
      - scripts/ci/cloudflare_preview_artifact.py
      - scripts/ci/cloudflare_preview_download.py
      - scripts/ci/cloudflare_preview_publish.py
      - scripts/ci/cloudflare_preview_budget.py
      - scripts/ci/cloudflare_preview_paths.json
      - tests/build/ci_cloudflare_preview_artifact_test.py
      - tests/build/ci_cloudflare_preview_download_test.py
      - tests/build/ci_cloudflare_preview_publish_test.py
      - tests/build/ci_cloudflare_preview_workflow_test.py
      - tests/build/ci_cloudflare_preview_paths_test.py
      - tests/build/ci_cloudflare_preview_budget_test.py

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Empty by default. Setting this repository variable plus an approved
    # monthly budget is a separately authorized activation, not an effect of
    # merging this workflow.
    if: >-
      github.repository == 'endaye/lmdj' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_PREVIEW_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Read-only run metadata for the fail-closed monthly budget gate.
      actions: read
    steps:
      - name: Check out only the trusted budget gate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: gate
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Admit within the approved monthly budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_PREVIEW_BUDGET_MINUTES: ${{ vars.CLOUDFLARE_PREVIEW_BUDGET_MINUTES }}
        run: python3 gate/scripts/ci/cloudflare_preview_budget.py --gate
      - name: Check out trusted artifact tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          persist-credentials: false
      - name: Check out the exact PR source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Build without deployment credentials
        timeout-minutes: 15
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PORTAL_REVISION: ${{ github.event.pull_request.head.sha }}
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          npx --yes npm@10.9.3 --prefix apps/docs-site ci
          npx --yes npm@10.9.3 --prefix apps/docs-site run check
      - name: Package the static artifact
        run: |
          mkdir -p "$RUNNER_TEMP/portal-preview-output"
          python3 control/scripts/ci/cloudflare_preview_artifact.py \
            --source source/apps/docs-site/build \
            --archive "$RUNNER_TEMP/portal-preview-output/static.zip"
      - name: Retain the exact-head artifact
        uses: actions/upload-artifact@v6
        with:
          name: portal-preview-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portal-preview-output/static.zip
          if-no-files-found: error
          retention-days: 7
