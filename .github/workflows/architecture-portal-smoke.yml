name: Architecture Portal Deployment Smoke

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment_url, '.netlify.app')
    runs-on: ubuntu-24.04
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
      PORTAL_REVISION: ${{ github.event.deployment.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/architecture-portal/package-lock.json
      - name: Validate Netlify deployment URL
        run: >-
          node -e 'const u = new URL(process.env.DEPLOYMENT_URL);
          if (u.protocol !== "https:" || !u.hostname.endsWith(".netlify.app")) process.exit(1)'
      - name: Install locked portal dependencies
        run: scripts/architecture-portal.sh install
      - name: Smoke deployed portal
        shell: bash
        run: |
          set -o pipefail
          scripts/architecture-portal.sh smoke "$DEPLOYMENT_URL" 2>&1 | tee portal-smoke.log
      - name: Upload failed smoke evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: architecture-portal-smoke-${{ github.run_id }}
          path: portal-smoke.log
          if-no-files-found: warn
