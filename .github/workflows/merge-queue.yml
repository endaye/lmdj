name: Merge Queue
run-name: Merge queue / ${{ github.event_name }} / PR ${{ github.event.pull_request.number || 'preflight-or-watchdog' }}

on:
  # Retired: labels and periodic watchdog ticks cannot authorize new work.
  # Existing runs retain their original workflow; O2 must reconcile them.
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: Retired compatibility input; the manual entry only reports retirement.
        required: true
        type: string
        default: "60"

permissions: {}

jobs:
  route:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    outputs:
      accepted: ${{ steps.route.outputs.accepted }}
      mode: ${{ steps.route.outputs.mode }}
      pr-number: ${{ steps.route.outputs.pr-number }}
      actor: ${{ steps.route.outputs.actor }}
      event-head-sha: ${{ steps.route.outputs.event-head-sha }}
    steps:
      - name: Route the exact authorization event
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          accepted=false
          mode=retired
          echo 'Merge Queue is retired. Use the ordinary authorized PR merge path.' >>"$GITHUB_STEP_SUMMARY"
          {
            echo "accepted=$accepted"
            echo "mode=$mode"
            echo "pr-number=${PR_NUMBER:-0}"
            echo "actor=$EVENT_ACTOR"
            echo "event-head-sha=${EVENT_HEAD_SHA:-0000000000000000000000000000000000000000}"
          } >>"$GITHUB_OUTPUT"

  queue-item:
    # On the dual-node trusted general role. This job spends nearly all of its
    # time inside `wait_validation`, polling for another GitHub run to finish:
    # measured at about 33 minutes per validation and roughly 43% of the
    # account's remaining hosted Actions minutes. Hosted, that wait is billed;
    # self-hosted it costs a role slot and no money.
    #
    # It does not qualify for the hosted-control-plane exception. That
    # exception protects scope, trust, admission and verdict evidence, and this
    # job publishes none of it -- `route` above makes the admission decision
    # and stays hosted, which is the half that is evidence. And the failure
    # mode it would guard against does not exist here: when every self-hosted
    # runner is down, the validation this job waits for cannot run either, so
    # there is nothing for it to wait on.
    #
    # GitHub's native merge queue would remove the wait entirely by moving it
    # to GitHub's side, but it is unavailable for a private repository on a
    # personal account: it requires a public repository or GitHub Enterprise
    # Cloud.
    needs: route
    if: ${{ needs.route.outputs.accepted == 'true' }}
    concurrency:
      group: lmdj-merge-main
      queue: max
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 360
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Hold the no-mutation queue preflight
        if: ${{ needs.route.outputs.mode == 'preflight' }}
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          python3 - <<'PY'
          import os
          import time

          seconds = int(os.environ["HOLD_SECONDS"])
          if not 30 <= seconds <= 600:
              raise SystemExit("hold_seconds must be between 30 and 600")
          print(f"Holding the fixed queue for {seconds} seconds without mutation.")
          time.sleep(seconds)
          PY
      - name: Process the authorized Pull Request
        if: ${{ needs.route.outputs.mode == 'controller' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_REPORT: ${{ runner.temp }}/merge-queue-report.json
        run: >-
          python3 scripts/ci/merge_queue.py run
          --repository "${{ github.repository }}"
          --pr-number "${{ needs.route.outputs.pr-number }}"
          --actor "${{ needs.route.outputs.actor }}"
          --event-head-sha "${{ needs.route.outputs.event-head-sha }}"
          --queue-run-id "${{ github.run_id }}"
          --report "$QUEUE_REPORT"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain the closed queue report
        if: ${{ always() && needs.route.outputs.mode == 'controller' }}
        uses: actions/upload-artifact@v4
        with:
          name: merge-queue-report-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-queue-report.json
          if-no-files-found: warn
          retention-days: 14

  finalize:
    needs: [route, queue-item]
    if: ${{ always() && needs.route.result == 'success' && needs.route.outputs.mode == 'controller' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Recover the worker report when available
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: merge-queue-report-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-queue-finalize
      - name: Reconcile an aborted worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_REPORT: ${{ runner.temp }}/merge-queue-finalize/merge-queue-report.json
        run: >-
          python3 scripts/ci/merge_queue.py finalize
          --repository "${{ github.repository }}"
          --pr-number "${{ needs.route.outputs.pr-number }}"
          --actor "${{ needs.route.outputs.actor }}"
          --event-head-sha "${{ needs.route.outputs.event-head-sha }}"
          --queue-run-id "${{ github.run_id }}"
          --report "$QUEUE_REPORT"
          --summary "$GITHUB_STEP_SUMMARY"

  watchdog:
    # On the dual-node trusted general role, not the hosted control plane. This
    # job runs every 15 minutes, so at roughly 2,880 runs a month it consumed
    # the account's entire 3,000-minute included Actions allowance on its own:
    # GitHub bills each job rounded up to a whole minute, and the reconcile step
    # takes about ten seconds.
    #
    # It does not qualify for the hosted-control-plane exception. That exception
    # exists so scope, admission and verdict evidence survives a self-hosted
    # outage; this job publishes no such evidence. It is an idempotent
    # reconciler with a 20-minute stall threshold, so a missed run is caught by
    # the next one, and when every self-hosted runner is down nothing can reach
    # the queue for it to reconcile anyway.
    #
    # The cadence is deliberately unchanged: dropping to hourly would have saved
    # only 75% while adding up to an hour of latency before a stalled queue
    # label is cleared.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reconcile orphaned queue authorization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ci/merge_queue_watchdog.py
          --repository "${{ github.repository }}"
          --report "${{ runner.temp }}/merge-queue-watchdog.json"
          --summary "$GITHUB_STEP_SUMMARY"
