name: Self-test Report

# Single durable controller; the health tick recovers pending work, not daily tests.

on:
  push:
    branches: [main]
  workflow_run:
    # Review records are discovered by coalesced main/health observations.
    # PR-only activity must not allocate another scheduler + relay chain.
    # Keep actual batch completion immediate; the health tick recovers gaps.
    workflows: ["Incremental Completion", "Core CI"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: Retired input; use report-legacy with review_run_id and review_attempt.
        required: false
      reconcile:
        description: Retired input; leave false.
        type: boolean
        default: false
      batch_operation:
        description: Durable manual controls; exact full uses reconcile with an explicit node/candidate request.
        type: choice
        options: [report-legacy, init, reconcile, settle, resume, report-init-outbox, report-review, report-batches, report-drain, report-discovery, recovery-probe, claim-probe, cancel-probe]
        default: reconcile
      journal_config:
        description: Optional isolated journal JSON; empty uses the committed production scheduler. Init requires explicit config.
        type: string
        required: false
      batch_request:
        description: Explicit node/candidate JSON for reconcile, or required closed id/suites/reason JSON for resume.
        type: string
        required: false
      report_config:
        description: Optional isolated scheduler/outbox JSON; empty uses the committed production pair. Init requires explicit config.
        type: string
        required: false
      review_run_id:
        description: Exact completed source run ID for report-review, report-legacy or paired report-discovery retry.
        type: string
        required: false
      review_attempt:
        description: Exact source attempt paired with review_run_id; never implicit latest attempt.
        type: string
        required: false
      report_limit:
        description: Maximum newly queued observations for report-batches (1..32).
        type: number
        default: 8
      probe_request:
        description: Isolated manual recovery probe closed intent JSON; omitted fault stays disabled.
        type: string
        required: false

# Everything not listed is `none`. The reporter reads runs and artifacts and
# writes Issues; it holds no pull-request, contents-write or deploy authority.
permissions: {}

# Coalesce automatic observations before they enter the writer queue. This is
# a distinct admission group, NOT the journal lock. Every manual command keeps
# its own admission group; no running controller or product DAG is cancelled.
concurrency:
  group: self-test-report-wakeup-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: false
  queue: single

# One short writer at a time; retain manual commands up to the platform queue
# limit. Automatic entries reconcile recent
# producer-era batches. Manual retries are isolated unless explicitly opted
# into reconciliation, so unrelated errors cannot block a run-id retry.
# The shared journal lock belongs to short writer jobs, never to the workflow:
# the reusable product DAG must not hold the lock needed by its next observer.

jobs:
  controller:
    name: Incremental batch controller
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_run' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general, contabo]
    timeout-minutes: 10
    concurrency:
      group: self-test-report
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      action: ${{ steps.control.outputs.action }}
      request: ${{ steps.control.outputs.request }}
      executor: ${{ steps.control.outputs.executor }}
      diagnostic_ready: ${{ steps.cancel-diagnostic.outputs.diagnostic_ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Reconcile the isolated journal under the short writer lock
        id: control
        if: ${{ !startsWith(inputs.batch_operation, 'report-') && inputs.batch_operation != 'recovery-probe' && inputs.batch_operation != 'claim-probe' && inputs.batch_operation != 'cancel-probe' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: self-test-report
          BATCH_OPERATION: ${{ inputs.batch_operation }}
          JOURNAL_CONFIG: ${{ inputs.journal_config }}
          BATCH_REQUEST: ${{ inputs.batch_request }}
          REPORT_CONFIG: ${{ inputs.report_config }}
          PROBE_REQUEST: ${{ inputs.probe_request }}
          LEGACY_RUN_ID: ${{ inputs.run_id }}
          LEGACY_RECONCILE: ${{ inputs.reconcile }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_ATTEMPT: ${{ inputs.review_attempt }}
          REPORT_LIMIT: ${{ inputs.report_limit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import subprocess
          directory = Path(os.environ['RUNNER_TEMP']) / 'incremental-controller'
          directory.mkdir(exist_ok=True)
          config, output = directory / 'config.json', directory / 'result.json'
          operation = os.environ['BATCH_OPERATION']
          if os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch':
              command = ['python3', 'scripts/ci/incremental_entry.py', 'control',
                         '--root', str(Path.cwd()), '--output', str(output)]
          else:
              if not operation:
                  raise SystemExit('why: missing manual operation; remedy: select reconcile or a recovery command')
              if (any(os.environ.get(key) for key in ('REPORT_CONFIG', 'PROBE_REQUEST', 'LEGACY_RUN_ID', 'REVIEW_RUN_ID', 'REVIEW_ATTEMPT'))
                  or os.environ.get('LEGACY_RECONCILE', '') not in ('', 'false')
                  or os.environ.get('REPORT_LIMIT', '8') != '8'):
                  raise SystemExit('why: scheduler command mixed with another operation; remedy: use only journal_config and batch_request')
              if os.environ.get('JOURNAL_CONFIG'):
                  config.write_text(os.environ['JOURNAL_CONFIG'])
              else:
                  import sys
                  sys.path.insert(0, 'scripts/ci')
                  from incremental_entry import load_storage
                  if operation == 'init':
                      raise SystemExit('why: initialization requires explicit isolated storage; remedy: never initialize the fixed production journal')
                  config.write_text(json.dumps(load_storage(Path.cwd(), os.environ)['scheduler']))
              command = ['python3', 'scripts/ci/batch_runtime.py', operation,
                     '--config', str(config), '--output', str(output)]
          if os.environ.get('BATCH_REQUEST'):
              if operation not in ('reconcile', 'resume'):
                  raise SystemExit('why: explicit request outside reconcile/resume; remedy: select its command or omit the request')
              request = directory / 'request.json'
              request.write_text(os.environ['BATCH_REQUEST'])
              command += ['--request', str(request)]
          subprocess.run(command, check=True)
          result = json.loads(output.read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              for key in ('action', 'request', 'executor'):
                  value = result[key] if key == 'action' else json.dumps(result[key], separators=(',', ':'))
                  handle.write(f'{key}={value}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('Incremental rehearsal: ' + result['action'] + '\n')
              handle.write('Processed progress is not full health or release authority.\n')
          PY
      - name: Report durable observations independently
        id: automatic-report
        if: ${{ always() && github.event_name != 'workflow_dispatch' && steps.control.outcome == 'success' && steps.control.outputs.action != 'execute' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: self-test-report
        run: |
          status=0
          python3 scripts/ci/incremental_entry.py reports --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/incremental-reports-$GITHUB_RUN_ID.json" || status=$?
          if test -f "$RUNNER_TEMP/incremental-reports-$GITHUB_RUN_ID.json"; then
            cat "$RUNNER_TEMP/incremental-reports-$GITHUB_RUN_ID.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Recover missed review observations independently
        id: automatic-discovery
        if: ${{ always() && github.event_name != 'workflow_dispatch' && (github.event_name != 'workflow_run' || github.event.workflow_run.path == '.github/workflows/pr-review.yml') && steps.control.outcome == 'success' && steps.control.outputs.action != 'execute' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: self-test-report
        run: |
          python3 scripts/ci/review_discovery_runtime.py --root "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY" --limit 1
      - name: Keep unresolved reporting visible
        if: ${{ always() && (steps.automatic-report.outcome == 'failure' || steps.automatic-discovery.outcome == 'failure') }}
        run: |
          echo 'why: a bounded report or discovery attempt is unresolved; remedy: inspect its durable backlog and restore evidence; no product rerun was requested' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Report through the isolated outbox under the short writer lock
        if: ${{ startsWith(inputs.batch_operation, 'report-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: self-test-report
          REPORT_OPERATION: ${{ inputs.batch_operation }}
          PROBE_REQUEST: ${{ inputs.probe_request }}
          LEGACY_RUN_ID: ${{ inputs.run_id }}
          LEGACY_RECONCILE: ${{ inputs.reconcile }}
          REPORT_CONFIG: ${{ inputs.report_config }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_ATTEMPT: ${{ inputs.review_attempt }}
          REPORT_LIMIT: ${{ inputs.report_limit }}
          BATCH_REQUEST: ${{ inputs.batch_request }}
          JOURNAL_CONFIG: ${{ inputs.journal_config }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          operations = {'report-init-outbox': 'init-outbox', 'report-review': 'review',
                        'report-batches': 'batches', 'report-drain': 'drain', 'report-legacy': 'legacy'}
          if os.environ['REPORT_OPERATION'] == 'report-discovery':
              import re
              if (any(os.environ.get(key) for key in ('REPORT_CONFIG', 'JOURNAL_CONFIG', 'BATCH_REQUEST', 'PROBE_REQUEST', 'LEGACY_RUN_ID'))
                  or os.environ.get('LEGACY_RECONCILE', '') not in ('', 'false')):
                  raise SystemExit('why: discovery mixed with another operation; remedy: use only report_limit and optional paired review identity')
              limit = os.environ.get('REPORT_LIMIT', '8')
              run_id, attempt = os.environ.get('REVIEW_RUN_ID', ''), os.environ.get('REVIEW_ATTEMPT', '')
              if (not re.fullmatch(r'[1-9][0-9]*', limit) or not 1 <= int(limit) <= 32
                  or bool(run_id) != bool(attempt)
                  or (run_id and (not re.fullmatch(r'[1-9][0-9]*', run_id) or not re.fullmatch(r'[1-9][0-9]*', attempt)))):
                  raise SystemExit('why: discovery limit or exact attempt is invalid; remedy: use limit 1..32 and either omit both review fields or supply positive integers')
              command = ['python3', 'scripts/ci/review_discovery_runtime.py', '--root', str(Path.cwd()),
                         '--summary', os.environ['GITHUB_STEP_SUMMARY'], '--limit', limit]
              if run_id:
                  command += ['--run-id', run_id, '--attempt', attempt]
              # Incomplete discovery remains red; never run the old mapping too.
              raise SystemExit(subprocess.run(command, check=False).returncode)
          operation = operations.get(os.environ['REPORT_OPERATION'])
          if (operation is None or any(os.environ.get(key) for key in ('BATCH_REQUEST', 'JOURNAL_CONFIG', 'PROBE_REQUEST', 'LEGACY_RUN_ID'))
              or os.environ.get('LEGACY_RECONCILE', '') not in ('', 'false')):
              raise SystemExit('why: report command is unknown or mixed with scheduler inputs; remedy: use only report_config and the selected report arguments')
          directory = Path(os.environ['RUNNER_TEMP']) / 'incremental-report'
          directory.mkdir(exist_ok=True)
          config = directory / 'config.json'
          if os.environ.get('REPORT_CONFIG'):
              config.write_text(os.environ['REPORT_CONFIG'])
          else:
              import json, sys
              sys.path.insert(0, 'scripts/ci')
              from incremental_entry import load_storage
              if operation == 'init-outbox':
                  raise SystemExit('why: initialization requires explicit isolated storage; remedy: never initialize the fixed production outbox')
              config.write_text(json.dumps(load_storage(Path.cwd(), os.environ)))
          command = ['python3', 'scripts/ci/report_runtime.py', '--config', str(config),
                     '--root', str(Path.cwd()), '--summary', os.environ['GITHUB_STEP_SUMMARY'], operation]
          run_id, attempt = os.environ.get('REVIEW_RUN_ID', ''), os.environ.get('REVIEW_ATTEMPT', '')
          if operation in ('review', 'legacy'):
              if not run_id or not attempt:
                  raise SystemExit('why: review report lacks exact run/attempt; remedy: supply both review_run_id and review_attempt')
              command += ['--run-id', run_id, '--attempt', attempt]
          elif run_id or attempt:
              raise SystemExit('why: review identity supplied to another report operation; remedy: select report-review or omit it')
          if operation == 'batches':
              command += ['--limit', os.environ.get('REPORT_LIMIT', '8')]
          subprocess.run(command, check=True)
          # Report CLI writes its own summary; there is deliberately no control
          # result, GITHUB_OUTPUT action, or executor request from this step.
          PY
      - name: Prepare the isolated cancellation diagnostic
        id: cancel-diagnostic
        if: ${{ inputs.batch_operation == 'cancel-probe' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: self-test-report
          BATCH_OPERATION: ${{ inputs.batch_operation }}
          JOURNAL_CONFIG: ${{ inputs.journal_config }}
          PROBE_REQUEST: ${{ inputs.probe_request }}
          REPORT_CONFIG: ${{ inputs.report_config }}
          BATCH_REQUEST: ${{ inputs.batch_request }}
          LEGACY_RUN_ID: ${{ inputs.run_id }}
          LEGACY_RECONCILE: ${{ inputs.reconcile }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_ATTEMPT: ${{ inputs.review_attempt }}
          REPORT_LIMIT: ${{ inputs.report_limit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'scripts/ci'))
          from batch_runtime import strict_json
          def require(ok, why):
              if not ok:
                  raise ValueError('why: ' + why + '; remedy: stop C2 and inspect the exact isolated claim without retrying admission')
          try:
              require(os.environ['BATCH_OPERATION'] == 'cancel-probe'
                      and not any(os.environ.get(key) for key in ('REPORT_CONFIG', 'BATCH_REQUEST', 'LEGACY_RUN_ID', 'REVIEW_RUN_ID', 'REVIEW_ATTEMPT'))
                      and os.environ.get('LEGACY_RECONCILE', '') in ('', 'false')
                      and os.environ.get('REPORT_LIMIT', '8') == '8', 'cancel probe mixed with another operation')
              require(bool(os.environ.get('JOURNAL_CONFIG')) and bool(os.environ.get('PROBE_REQUEST')), 'cancel probe lacks config or intent')
              require(os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'cancel probe has wrong main or attempt')
              directory = Path(os.environ['RUNNER_TEMP']) / 'incremental-cancel-probe'
              directory.mkdir(exist_ok=True)
              config, request, diagnostic = [directory / name for name in ('config.json', 'request.json', 'diagnostic.json')]
              config.write_text(os.environ['JOURNAL_CONFIG'])
              request.write_text(os.environ['PROBE_REQUEST'])
              command = ['python3', 'scripts/ci/o1_execution_cancel_probe.py', '--config', str(config),
                         '--request', str(request), '--root', str(Path.cwd()), '--diagnostic', str(diagnostic),
                         '--summary', os.environ['GITHUB_STEP_SUMMARY']]
              result = subprocess.run(command, check=False)
              if result.returncode != 0:
                  raise SystemExit(result.returncode)
              value = strict_json(diagnostic.read_bytes())
              require(isinstance(value, dict) and set(value) == {'schema', 'status', 'diagnostic_ready', 'identity'}
                      and value['schema'] == 'lmdj.o1-cancel-diagnostic.v1'
                      and type(value['diagnostic_ready']) is bool, 'cancel diagnostic schema is not closed')
              if value['status'] == 'disabled':
                  require(value['diagnostic_ready'] is False and value['identity'] is None, 'disabled diagnostic contains readiness')
                  raise SystemExit(0)
              require(value['status'] == 'ready' and value['diagnostic_ready'] is True, 'cancel diagnostic is not ready')
              identity = value['identity']
              expected = {'run_id', 'attempt', 'control_sha', 'request_id', 'journal_head', 'issue_number', 'epoch'}
              require(isinstance(identity, dict) and set(identity) == expected, 'cancel identity is not closed')
              frozen = strict_json((Path.cwd() / 'scripts/ci/o1_recovery_storage.json').read_bytes())['claim']
              require(strict_json(config.read_bytes()) == frozen, 'cancel config differs from fixed claim role')
              require(type(identity['run_id']) is int and identity['run_id'] == int(os.environ['GITHUB_RUN_ID'])
                      and type(identity['attempt']) is int and identity['attempt'] == 1
                      and identity['control_sha'] == os.environ['GITHUB_SHA']
                      and type(identity['issue_number']) is int and identity['issue_number'] == frozen['issue_number']
                      and identity['epoch'] == frozen['epoch']
                      and isinstance(identity['epoch'], str) and re.fullmatch(r'o1-claim-cancel-[a-z0-9-]{1,80}', identity['epoch'])
                      and isinstance(identity['request_id'], str)
                      and re.fullmatch('batch:' + re.escape(identity['epoch']) + r':[1-9][0-9]*', identity['request_id'])
                      and isinstance(identity['journal_head'], str) and re.fullmatch(r'[0-9a-f]{64}', identity['journal_head']),
                      'cancel identity differs from actual controller or fixed storage')
              # This sole literal is diagnostic readiness, never an execution request.
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('diagnostic_ready=true\n')
          except Exception:
              raise SystemExit('why: cancellation diagnostic validation failed; remedy: inspect the exact run and journal, never retry an uncertain claim')
          raise SystemExit(0)
          PY
      - name: Run the isolated claim-before-output probe
        if: ${{ inputs.batch_operation == 'claim-probe' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: self-test-report
          BATCH_OPERATION: ${{ inputs.batch_operation }}
          JOURNAL_CONFIG: ${{ inputs.journal_config }}
          PROBE_REQUEST: ${{ inputs.probe_request }}
          REPORT_CONFIG: ${{ inputs.report_config }}
          BATCH_REQUEST: ${{ inputs.batch_request }}
          LEGACY_RUN_ID: ${{ inputs.run_id }}
          LEGACY_RECONCILE: ${{ inputs.reconcile }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_ATTEMPT: ${{ inputs.review_attempt }}
          REPORT_LIMIT: ${{ inputs.report_limit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          if (os.environ['BATCH_OPERATION'] != 'claim-probe'
              or any(os.environ.get(key) for key in ('REPORT_CONFIG', 'BATCH_REQUEST', 'LEGACY_RUN_ID', 'REVIEW_RUN_ID', 'REVIEW_ATTEMPT'))
              or os.environ.get('LEGACY_RECONCILE', '') not in ('', 'false')
              or os.environ.get('REPORT_LIMIT', '8') != '8'):
              raise SystemExit('why: claim probe mixed with another operation; remedy: use only journal_config and probe_request')
          if not os.environ.get('JOURNAL_CONFIG') or not os.environ.get('PROBE_REQUEST'):
              raise SystemExit('why: claim probe lacks its fixed role config or intent; remedy: supply journal_config matching reviewed claim role and probe_request')
          directory = Path(os.environ['RUNNER_TEMP']) / 'incremental-claim-probe'
          directory.mkdir(exist_ok=True)
          config, request = directory / 'config.json', directory / 'request.json'
          config.write_text(os.environ['JOURNAL_CONFIG'])
          request.write_text(os.environ['PROBE_REQUEST'])
          command = ['python3', 'scripts/ci/o1_execution_claim_probe.py', '--config', str(config),
                     '--request', str(request), '--root', str(Path.cwd()),
                     '--summary', os.environ['GITHUB_STEP_SUMMARY']]
          raise SystemExit(subprocess.run(command, check=False).returncode)
          PY
      - name: Run the isolated recovery response probe
        if: ${{ inputs.batch_operation == 'recovery-probe' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: self-test-report
          BATCH_OPERATION: ${{ inputs.batch_operation }}
          REPORT_CONFIG: ${{ inputs.report_config }}
          PROBE_REQUEST: ${{ inputs.probe_request }}
          JOURNAL_CONFIG: ${{ inputs.journal_config }}
          BATCH_REQUEST: ${{ inputs.batch_request }}
          LEGACY_RUN_ID: ${{ inputs.run_id }}
          LEGACY_RECONCILE: ${{ inputs.reconcile }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_ATTEMPT: ${{ inputs.review_attempt }}
          REPORT_LIMIT: ${{ inputs.report_limit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          if (os.environ['BATCH_OPERATION'] != 'recovery-probe'
              or any(os.environ.get(key) for key in ('JOURNAL_CONFIG', 'BATCH_REQUEST', 'LEGACY_RUN_ID', 'REVIEW_RUN_ID', 'REVIEW_ATTEMPT'))
              or os.environ.get('LEGACY_RECONCILE', '') not in ('', 'false')
              or os.environ.get('REPORT_LIMIT', '8') != '8'):
              raise SystemExit('why: probe mixed with another operation; remedy: use only report_config and probe_request')
          if not os.environ.get('REPORT_CONFIG') or not os.environ.get('PROBE_REQUEST'):
              raise SystemExit('why: probe lacks explicit isolated config or intent; remedy: supply report_config and probe_request')
          directory = Path(os.environ['RUNNER_TEMP']) / 'incremental-recovery-probe'
          directory.mkdir(exist_ok=True)
          config, request = directory / 'config.json', directory / 'request.json'
          config.write_text(os.environ['REPORT_CONFIG'])
          request.write_text(os.environ['PROBE_REQUEST'])
          command = ['python3', 'scripts/ci/o1_recovery_probe.py', '--config', str(config),
                     '--request', str(request), '--root', str(Path.cwd()),
                     '--summary', os.environ['GITHUB_STEP_SUMMARY']]
          raise SystemExit(subprocess.run(command, check=False).returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !startsWith(inputs.batch_operation, 'report-') && inputs.batch_operation != 'recovery-probe' && inputs.batch_operation != 'claim-probe' && inputs.batch_operation != 'cancel-probe' }}
        with:
          name: batch-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incremental-controller/result.json
          if-no-files-found: warn
          retention-days: 30

  cancel-probe-waiter:
    name: Isolated cancellation window
    needs: [controller]
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      inputs.batch_operation == 'cancel-probe' && needs.controller.result == 'success' &&
      needs.controller.outputs.diagnostic_ready == 'true'
    permissions: {}
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general, contabo]
    timeout-minutes: 5
    steps:
      - name: Wait for separately authorized exact-run cancellation
        shell: bash
        run: |
          sleep 285
          echo 'why: cancellation window expired without verified cancellation; remedy: inspect the actual parent run and settle missing evidence separately'
          exit 1

  execute-batch:
    name: Execute incremental batch
    needs: [controller]
    if: ${{ needs.controller.outputs.action == 'execute' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      batch_request: ${{ needs.controller.outputs.request }}
      batch_executor: ${{ needs.controller.outputs.executor }}
    secrets:
      SELF_HOSTED_RUNNER_READ_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_READ_TOKEN }}
