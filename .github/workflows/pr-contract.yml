name: PR Contract
run-name: "PR Contract / #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

# This is an advisory PR signal. It deliberately has no pull_request_target
# entry: a fork must never execute its head on a persistent self-hosted host.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # An edited event must never replace an in-flight source run (including a
  # retarget run). Give each edit its own group; source events still coalesce.
  group: pr-contract-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.run_id || 'source' }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  change-scope:
    name: Select PR contract lanes
    # This condition is evaluated before GitHub allocates the self-hosted
    # runner. Same-repository is the trust boundary; draft PRs wait for the
    # ready_for_review event instead of consuming capacity.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.scope.outputs.manifest }}
      trusted-head: ${{ steps.scope.outputs.trusted-head }}
      base-sha: ${{ steps.scope.outputs.resolved-base-sha }}
      head-sha: ${{ steps.scope.outputs.resolved-head-sha }}
      pull-request-body: ${{ steps.scope.outputs.pull-request-body }}
      metadata-only: ${{ steps.event.outputs.metadata-only }}
    steps:
      - name: Classify the PR edit
        id: event
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          changes = event.get('changes')
          metadata_only = (
              event.get('action') == 'edited'
              and isinstance(changes, dict) and bool(changes)
              and set(changes) <= {'body', 'title'}
              and all(isinstance(value, dict) and set(value) == {'from'}
                      and (value['from'] is None or isinstance(value['from'], str))
                      for value in changes.values())
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('metadata-only=' + str(metadata_only).lower(), file=output)
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Select the deterministic CI floor
        id: scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/ci/change_scope.py \
            --policy scripts/ci/scope_policy.json \
            --event pull_request \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --head-repository "$HEAD_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --manifest-out "$RUNNER_TEMP/pr-contract-manifest.json" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$RUNNER_TEMP/pr-contract-scope.md"

  ci-contract:
    name: CI contract
    needs: change-scope
    if: >-
      !cancelled() &&
      needs.change-scope.outputs.trusted-head == 'true' &&
      needs.change-scope.outputs.metadata-only != 'true' &&
      fromJSON(needs.change-scope.outputs.manifest).lanes.ci_contract
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested PR head
        env:
          EXPECTED_HEAD: ${{ needs.change-scope.outputs.head-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate workflows with pinned actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            -ignore 'unexpected key "queue" for "concurrency" section'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Run affected CI-control contracts
        id: contracts
        env:
          BASE_SHA: ${{ needs.change-scope.outputs.base-sha }}
          HEAD_SHA: ${{ needs.change-scope.outputs.head-sha }}
        run: >-
          python3 scripts/ci/contract_selection.py
          --base "$BASE_SHA" --head "$HEAD_SHA" --execute tests
          --github-output "$GITHUB_OUTPUT"
      # The coverage tooling's own suites take seconds and need no Core
      # build; ci.yml's ci-contract job runs the same step (#2219).
      - name: Run the coverage tooling contracts
        run: python3 -m unittest discover -s tests/quality -p '*_test.py'
      - uses: actions/setup-python@v6
        if: ${{ steps.contracts.outputs.seam != 'false' }}
        with:
          python-version: "3.12"
      - name: Run the pinned PR-Agent real-handler seam proof
        if: ${{ steps.contracts.outputs.seam != 'false' }}
        run: scripts/ci/pr-agent/integration-test.sh

  docs-static:
    name: Docs / static
    needs: change-scope
    if: >-
      !cancelled() &&
      needs.change-scope.outputs.trusted-head == 'true' &&
      needs.change-scope.outputs.metadata-only != 'true' &&
      fromJSON(needs.change-scope.outputs.manifest).lanes.docs_static
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested PR head
        env:
          EXPECTED_HEAD: ${{ needs.change-scope.outputs.head-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate the exact selected revision range
        env:
          BASE_SHA: ${{ needs.change-scope.outputs.base-sha }}
          HEAD_SHA: ${{ needs.change-scope.outputs.head-sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  documentation-impact:
    name: Documentation impact
    needs: change-scope
    if: >-
      !cancelled() &&
      needs.change-scope.outputs.trusted-head == 'true'
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested PR head
        env:
          EXPECTED_HEAD: ${{ needs.change-scope.outputs.head-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Check Pull Request documentation impact
        env:
          PORTAL_PR_BODY: ${{ needs.change-scope.outputs.pull-request-body }}
          PORTAL_BASE_SHA: ${{ needs.change-scope.outputs.base-sha }}
          PORTAL_HEAD_SHA: ${{ needs.change-scope.outputs.head-sha }}
        run: node apps/docs-site/scripts/check-doc-impact.mjs

  portal-provenance:
    # Snapshot provenance is verified before merge, not after. The full
    # Architecture Portal lane in ci.yml is conditioned on the main
    # incremental-batch fixed-target mode, so no Pull Request ever ran it and a
    # frozen snapshot whose provenance a squash had broken could only be found
    # by the next main run -- which is how Build 1.0.57.0 was found, already on
    # main. This runs exactly the portal lane commands from
    # scripts/ci/local_lanes.json (scripts/docs-site.sh install + check,
    # including release-docs snapshot provenance of a newly committed witness)
    # against the exact Pull Request head, on the general role rather than the
    # heavy native queue. The verification is self-authenticating from Git
    # objects. The literal job name is a published check-run surface: keep it
    # stable, since readers may bind to it.
    # review_wait reads the latest real provenance check by its literal name.
    # A skipped metadata run must not mask it or manufacture new evidence.
    name: ${{ needs.change-scope.outputs.metadata-only == 'true' && 'Portal source unchanged (metadata edit)' || 'Architecture Portal provenance' }}
    needs: change-scope
    if: >-
      !cancelled() &&
      needs.change-scope.outputs.trusted-head == 'true' &&
      needs.change-scope.outputs.metadata-only != 'true' &&
      fromJSON(needs.change-scope.outputs.manifest).lanes.portal
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.change-scope.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested PR head
        env:
          EXPECTED_HEAD: ${{ needs.change-scope.outputs.head-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Install locked portal dependencies
        run: scripts/docs-site.sh install
      - name: Verify architecture portal
        run: scripts/docs-site.sh check
