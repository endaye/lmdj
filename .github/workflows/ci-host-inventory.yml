name: CI Host Inventory

# Reports what a self-hosted role actually provides. Dispatch-only, read-only,
# and never a formal result.
#
# It was written while #591 step 6 -- moving native Core work to netcup -- was
# still open and blocked on a host-readiness question nobody had actually
# checked. Step 6 has since been closed on other evidence: queue time stopped
# dominating execution time, so the move buys headroom rather than fixing a
# standing problem.
#
# This is kept anyway, and the honest reason is narrower than the original one.
# The question "what does this host actually provide" recurs whenever a role is
# moved, a lane is added, or a build fails in a way that smells like a missing
# tool, and answering it by reasoning from provisioning scripts is how the
# step 6 estimate went unchecked for as long as it did. A dispatch-only probe
# costs nothing until someone runs it and replaces an assumption with a
# reading. If step 6 is ever reopened, this is the measurement it needs.
#
# Reports rather than asserts. A missing tool is the answer, not a failure, so
# the job stays green and the summary carries the finding. A red job here would
# say "this host is not ready" in a way indistinguishable from "this workflow
# is broken".

on:
  workflow_dispatch:
    inputs:
      role:
        description: Which self-hosted role to inventory.
        required: true
        type: choice
        options:
          - ci-web-heavy
          - ci-general
          - ci-core

permissions:
  contents: read

jobs:
  inventory:
    name: Host inventory (${{ inputs.role }})
    # The role is selected by the dispatch input. `ci-web-heavy` and `ci-core`
    # are both netcup-only since the 2026-09-06 move (#676); `ci-general` spans
    # both hosts, so a `ci-general` dispatch that lands on `shared-with-staging`
    # is the way to read Contabo. Repeat a dispatch if it lands elsewhere.
    runs-on:
      - self-hosted
      - Linux
      - X64
      - lmdj-linux
      - lmdj-linux-pool
      - ${{ inputs.role }}
    timeout-minutes: 10
    steps:
      - name: Report host capacity and toolchain
        shell: bash
        env:
          SELECTED_ROLE: ${{ inputs.role }}
          RUNNER_LABEL: ${{ runner.name }}
        run: |
          set -uo pipefail

          emit() { printf '%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"; printf '%s\n' "$1"; }

          emit "## Host inventory: \`$SELECTED_ROLE\` on \`$RUNNER_LABEL\`"
          emit ""
          emit "| Property | Value |"
          emit "| --- | --- |"
          emit "| runner | \`$RUNNER_LABEL\` |"
          emit "| cores | $(nproc) |"
          emit "| memory | $(free -h | awk '/^Mem:/{print $2}') |"
          emit "| kernel | $(uname -r) |"
          emit "| distribution | $(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME") |"
          emit "| workspace free | $(df -h . | awk 'NR==2{print $4}') |"
          emit ""
          emit "### Native Core toolchain"
          emit ""
          emit "These are what \`core-coverage\` verifies before it will run, and"
          emit "what the \`ci-core\` role needs before it can span this host."
          emit ""
          emit "| Tool | Present | Version | Path |"
          emit "| --- | --- | --- | --- |"
          # A missing tool is a finding, so `command -v` failing must not end the
          # step; `set -e` is deliberately not in force above.
          #
          # The path is reported alongside the version because the two answer
          # different questions. A version alone cannot distinguish a real
          # toolchain from a wrapper on the PATH that forwards to a different
          # compiler, and that distinction is exactly what deciding whether this
          # host can carry native Core work turns on.
          for tool in clang-22 clang++-22 llvm-cov-22 ccache cmake ninja python3 git-lfs; do
            if tool_path="$(command -v "$tool" 2>/dev/null)"; then
              version="$("$tool" --version 2>&1 | head -n1 | cut -c1-60)"
              emit "| \`$tool\` | yes | $version | \`$tool_path\` |"
            else
              emit "| \`$tool\` | **no** | — | — |"
            fi
          done
          emit ""
          emit "### Persistent ccache"
          emit ""
          if command -v ccache >/dev/null 2>&1; then
            emit '```'
            ccache --show-stats 2>&1 | head -n 12 >>"$GITHUB_STEP_SUMMARY" || true
            emit '```'
          else
            emit "ccache is absent, so native Core work here would start cold."
          fi
          emit ""
          emit "### Real-time measurement validity"
          emit ""
          emit "\`audio.master_fx_stress\` asserts zero callback overruns using"
          emit "\`CLOCK_THREAD_CPUTIME_ID\`, and its comment says thread CPU time is"
          emit "why a descheduled runner cannot make it fail. That holds for the"
          emit "kernel descheduling the thread. It does not hold unconditionally for"
          emit "a guest: Linux subtracts steal and IRQ time from the runqueue clock"
          emit "that feeds \`task_sched_runtime()\` only when the matching option is"
          emit "compiled in, so without them a hypervisor preemption or an interrupt"
          emit "burst is billed to whichever thread was running. #666 turns on"
          emit "whether that is the case here, so these are readings, not verdicts."
          emit ""

          # Reports rather than asserts, like every other section here. Both
          # sources can legitimately be absent -- /boot/config-* is not always
          # world-readable and /proc/config.gz needs CONFIG_IKCONFIG_PROC -- so
          # "unavailable" is an answer and never a failure.
          config_answer=""
          config_source=""
          config_verdict=""
          read_kernel_config() {
            local key="$1" src="" line=""
            config_answer="no matching line"
            config_source="unavailable"
            config_verdict="unavailable"
            for src in "/boot/config-$(uname -r)" /proc/config.gz; do
              [ -r "$src" ] || continue
              case "$src" in
                *.gz)
                  command -v zcat >/dev/null 2>&1 || continue
                  line="$(zcat "$src" 2>/dev/null | grep -E "^(# )?${key}[= ]" | head -n1)"
                  ;;
                *)
                  line="$(grep -E "^(# )?${key}[= ]" "$src" 2>/dev/null | head -n1)"
                  ;;
              esac
              config_source="$src"
              if [ -n "$line" ]; then
                config_answer="$line"
                case "$line" in
                  *"=y"*) config_verdict="compiled in" ;;
                  *"=m"*) config_verdict="module" ;;
                  *"is not set"*) config_verdict="**not compiled in**" ;;
                  *) config_verdict="unrecognised" ;;
                esac
              else
                # A key absent from a config that was readable is the same
                # effective answer as an explicit "is not set".
                config_answer="absent from this config"
                config_verdict="**not compiled in**"
              fi
              return 0
            done
          }

          emit "| Kernel option | Effective | Source | Raw line |"
          emit "| --- | --- | --- | --- |"
          for key in CONFIG_PARAVIRT_TIME_ACCOUNTING CONFIG_IRQ_TIME_ACCOUNTING; do
            read_kernel_config "$key"
            emit "| \`$key\` | $config_verdict | \`$config_source\` | \`$config_answer\` |"
          done
          emit ""

          virt="$(systemd-detect-virt 2>/dev/null)" || virt=""
          [ -n "$virt" ] || virt="$(grep -m1 -E 'hypervisor' /proc/cpuinfo >/dev/null 2>&1 && echo "hypervisor flag present" || echo unavailable)"
          emit "| Property | Value |"
          emit "| --- | --- |"
          emit "| virtualization | \`$virt\` |"
          emit "| USER_HZ | $(getconf CLK_TCK 2>/dev/null || echo unavailable) |"
          emit ""

          # An absolute counter since boot cannot say whether steal is accruing
          # now, which is the part that matters for a callback measured in
          # microseconds. Two samples over a fixed window give a rate.
          cpu_fields() { awk '$1=="cpu"{print $7" "$8" "$9; exit}' /proc/stat 2>/dev/null; }
          before="$(cpu_fields)"
          sleep 5
          after="$(cpu_fields)"
          if [ -n "$before" ] && [ -n "$after" ]; then
            emit "Idle-host accounting over a 5 s window, in USER_HZ ticks:"
            emit ""
            emit "| Counter | Before | After | Delta |"
            emit "| --- | --- | --- | --- |"
            printf '%s\n%s\n' "$before" "$after" | awk '
              NR==1 { b1=$1; b2=$2; b3=$3 }
              NR==2 { a1=$1; a2=$2; a3=$3
                      printf "| irq | %s | %s | %s |\n", b1, a1, a1-b1
                      printf "| softirq | %s | %s | %s |\n", b2, a2, a2-b2
                      printf "| steal | %s | %s | %s |\n", b3, a3, a3-b3 }
            ' | while IFS= read -r row; do emit "$row"; done
            emit ""
            emit "A non-zero steal delta on an otherwise idle host means the"
            emit "hypervisor is taking this vCPU away during normal operation."
          else
            emit "\`/proc/stat\` did not yield a \`cpu\` aggregate line, so steal and"
            emit "IRQ accounting is unavailable on this host."
          fi
