name: CI Host Inventory

# Dispatch-only, read-only evidence. A capability/tool reading never claims
# that both providers are ready; each run is bound to one explicit host label.

on:
  workflow_dispatch:
    inputs:
      host:
        description: Which trusted host to inventory (never a generic pool).
        required: true
        type: choice
        options:
          - netcup
          - contabo
      role:
        description: Which self-hosted role to inventory.
        required: true
        type: choice
        options:
          - ci-web-heavy
          - ci-general
          - ci-core

permissions:
  contents: read

jobs:
  inventory:
    name: Host inventory (${{ inputs.host }}/${{ inputs.role }})
    # Both providers carry ci-general. Only netcup carries ci-core and
    # ci-web-heavy. The explicit host label prevents a generic role from
    # randomly sampling one provider and falsely standing in for both.
    runs-on:
      - self-hosted
      - Linux
      - X64
      - lmdj-linux
      - lmdj-linux-pool
      - ${{ inputs.host }}
      # Unsupported Contabo pairs land on its general host so validation can
      # reject them rather than leaving an impossible label intersection queued.
      - ${{ (inputs.host == 'netcup' && inputs.role) || 'ci-general' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository parity source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Report host capacity and toolchain
        shell: bash
        env:
          SELECTED_ROLE: ${{ inputs.role }}
          SELECTED_HOST: ${{ inputs.host }}
          RUNNER_NAME: ${{ runner.name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -uo pipefail
          emit() { printf '%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"; printf '%s\n' "$1"; }

          # Both trusted providers expose ci-general. Only netcup provides the
          # other roles. Reject after explicit host targeting, so an invalid
          # pair is blocked evidence rather than an indefinitely queued job.
          if [ "$SELECTED_HOST" = contabo ] && [ "$SELECTED_ROLE" != ci-general ]; then
            emit "**blocked:** role \`$SELECTED_ROLE\` is not provided by explicitly selected host \`$SELECTED_HOST\`."
            exit 78
          fi

          set +e
          python3 scripts/ci/host_inventory_probe.py \
            --host "$SELECTED_HOST" \
            --role "$SELECTED_ROLE" \
            --expected-config "scripts/ci/elastic-runner/${SELECTED_HOST}.json" \
            --actual-config /etc/lmdj/elastic-runner.json \
            --sanitizer-script scripts/ci/host/configure-sanitizer-aslr.sh \
            --accounting-seconds 5 \
            --format markdown \
            | tee "$RUNNER_TEMP/host-inventory.md"
          probe_status=${PIPESTATUS[0]}
          set -u
          emit ""
          emit "Inventory dispatch provenance: run URL \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`."
          exit "$probe_status"
