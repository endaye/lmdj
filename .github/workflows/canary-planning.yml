name: Canary Planning

# Manual recovery uses one bounded planner. Automatic entry is intentionally
# frozen until independent storage/readiness and live acceptance are explicit.
# The source's existing health observations recover missed callback chains;
# no date-based product test, assessment or deployment is requested here.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Initialize reserved storage, bootstrap/adopt approved version progress, or observe/recover/discover a retained result.
        type: choice
        options: [init, bootstrap, adopt-version-baseline, observe-result, recover, reconcile-next]
        required: true
      storage:
        description: Reviewed dedicated planning journal JSON with exact Issue, bot, workflow and epoch identities.
        type: string
        required: true
      request:
        description: Observe/recover requires source_request_id; other operations require an empty object. No caller evidence is accepted.
        type: string
        default: "{}"

permissions: {}

# Explicit manual commands retain separate admission; the controller below
# owns the only planning writer lock.
concurrency:
  group: canary-planning-wakeup-${{ github.run_id }}
  cancel-in-progress: false
  queue: single

jobs:
  controller:
    name: Canary planning controller
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general, contabo]
    timeout-minutes: 10
    concurrency:
      group: canary-planning
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Persist or recover the exact result-driven plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WRITER_LOCK: canary-planning
          PLANNING_OPERATION: ${{ inputs.operation }}
          PLANNING_STORAGE: ${{ inputs.storage }}
          PLANNING_REQUEST: ${{ inputs.request }}
        run: python3 -m tools.canary.planning_entry --directory "$RUNNER_TEMP/canary-planning-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain complete planning observation
        uses: actions/upload-artifact@v6
        with:
          name: canary-planning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-planning-${{ github.run_id }}-${{ github.run_attempt }}/planning.json
          if-no-files-found: error
          retention-days: 30
