name: Deploy Cloudflare Portal

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'endaye/lmdj'
    runs-on: [self-hosted, Linux, X64, lmdj-linux, lmdj-linux-pool, ci-general]
    timeout-minutes: 60
    environment: portal-cloudflare
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
      - name: Build and verify the Git source
        timeout-minutes: 15
        run: |
          npx --yes npm@10.9.3 --prefix apps/docs-site ci
          npx --yes npm@10.9.3 --prefix apps/docs-site run check
      - name: Install pinned deploy CLI without deployment credentials
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/portal-wrangler-$GITHUB_RUN_ID"
          cp tools/wrangler/package.json tools/wrangler/package-lock.json "$RUNNER_TEMP/portal-wrangler-$GITHUB_RUN_ID/"
          npm ci --prefix "$RUNNER_TEMP/portal-wrangler-$GITHUB_RUN_ID" --ignore-scripts --no-audit --no-fund
      - name: Verify version Preview and publish the same version
        timeout-minutes: 30
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_JS: ${{ runner.temp }}/portal-wrangler-${{ github.run_id }}/node_modules/wrangler/bin/wrangler.js
        run: python3 scripts/cloudflare-portal-deploy.py
      - name: Retain deployment and recovery observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cloudflare-portal-${{ github.sha }}
          path: ${{ runner.temp }}/cloudflare-portal-${{ github.run_id }}.json
          if-no-files-found: ignore
